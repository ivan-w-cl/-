<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>顾问后台 · Liverpool Student Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=ZCOOL+KuaiLe&display=swap">
<link rel="stylesheet" href="./adviser/app.css">
<style>
  /* Layout: one full-height console under a slim bar; inside the two-sided walkthrough the bar is hidden. */
  body { display: flex; flex-direction: column; height: 100%; }
  .wrapA { flex: 1; min-height: 0; display: flex; padding-block: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrapA .adminframe { flex: 1; height: auto; max-height: none; min-height: 0; }
  .pool { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; background: rgba(255,250,240,.12); border: 1.5px dashed var(--panel); border-radius: 12px; padding: 3px 10px; }
  .pool b { font-family: var(--hand); font-weight: normal; font-size: 16px; }
  .pool label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .pool button { border: 2px solid var(--panel); background: transparent; color: var(--panel); border-radius: 999px; padding: 2px 10px; font-family: var(--hand); font-size: 14px; cursor: pointer; }
  .demobar a { color: var(--panel); font-family: var(--hand); font-size: 15px; border: 2px solid var(--panel); border-radius: 999px; padding: 3px 12px; text-decoration: none; }
  body.embed .demobar { display: none; }
  body.embed .wrapA { padding: 0; }
  body.embed .wrapA .adminframe { border: 0; border-radius: 0; box-shadow: none; }
  .mp-wrap { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(59, 42, 26, .45); }
  .mp-wrap[hidden] { display: none; }
  .mp { width: min(980px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: var(--lift); overflow: hidden; }
  .mp-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2px dashed var(--line); }
  .mp-x { border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--ink); }
  .mp-body { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 18px; padding: 14px 16px 18px; overflow-y: auto; }
  .mp-cfg { display: flex; flex-direction: column; gap: 12px; }
  .mp-check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.4; margin-top: 6px; }
  .mp-check.off { color: var(--ink-soft); }
  .mp-check input { width: auto; flex: none; margin: 3px 0 0; }
  .mp-log { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .mp-log ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
  .mp-item { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 1px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .mp-item.on { border-color: var(--ink); background: #fff3c4; }
  .mp-preview { border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: #fff; }
  .mp-subject { padding: 8px 12px; font-weight: 700; font-size: 13.5px; border-bottom: 1.5px solid var(--line); background: var(--panel-2); }
  .mp-preview iframe { display: block; width: 100%; height: 440px; border: 0; }
  @media (max-width: 760px) { .mp-body { grid-template-columns: 1fr; } }
  @media (max-width: 899px) { body { height: auto; } .wrapA .adminframe { min-height: 85vh; } }
</style>
</head>
<body>
<div class="demobar" id="bar"></div>
<div class="wrapA"><div class="adminframe"><div id="admin"></div></div></div>
<script src="./vendor/qrcode.js"></script>
<script src="./adviser/core.js"></script>
<script src="./adviser/data.js"></script>
<script src="./adviser/ui.js"></script>
<script src="./group-pool.js"></script>
<script src="./mail-outbox.js"></script>
<script src="./adviser/email-template.js"></script>
<script src="./adviser/store-live.js"></script>
<script src="./adviser/admin.js"></script>
<script src="./adviser/mail-panel.js"></script>
<script>
(function () {
  'use strict';
  const Store = window.Store, U = window.UI, bar = document.getElementById('bar');
  if (/[?&]embed=1/.test(location.search)) document.body.classList.add('embed');
  let armed = false;
  const C = { zh: { brand: 'Liverpool Student Map', tag: '顾问后台', site: '打开学生网站', flow: '两端流程演示', lang: 'EN', reset: '重置演示数据', confirm: '确定重置？', done: '演示数据已重置',
                     pool: '预建群池（备用）', auto: '学生点击后自动派发（微信群码 7 天过期）', left: 'WhatsApp {a} 个 · 微信 {b} 个', refill: '补充 5 组', refilled: '已补充 5 个 WhatsApp 群和 5 个微信群' },
              en: { brand: 'Liverpool Student Map', tag: 'Adviser console', site: 'Open student site', flow: 'Two-sided walkthrough', lang: '中文', reset: 'Reset demo', confirm: 'Really reset?', done: 'Demo data reset',
                     pool: 'Pre-built groups (backup)', auto: 'Send automatically on tap (WeChat codes expire in 7 days)', left: 'WhatsApp {a} · WeChat {b}', refill: 'Add 5 of each', refilled: 'Added 5 WhatsApp and 5 WeChat groups' } };
  const c = () => C[Store.s.demoLang === 'en' ? 'en' : 'zh'];
  function renderBar() {
    const k = c();
    const P = window.GroupPool.load();
    bar.innerHTML = `<span class="brand">${k.brand} <small>${k.tag}</small></span>
      <div class="pool"><b>${k.pool}</b><label><input type="checkbox" id="poolAuto" ${P.auto ? 'checked' : ''}> ${k.auto}</label>
        <span>${k.left.replace('{a}', window.GroupPool.count('whatsapp')).replace('{b}', window.GroupPool.count('wechat'))}</span><button data-act="refill">${k.refill}</button></div>
      <div class="tools"><button data-act="mail">${window.MailPanel.label()}</button><a href="./index.html" target="_blank" rel="noopener">${k.site}</a><a href="./handoff-demo.html">${k.flow}</a>
      <button data-act="lang">${k.lang}</button><button data-act="reset" class="${armed ? 'warn' : ''}">${armed ? k.confirm : k.reset}</button></div>`;
  }
  bar.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'lang') { Store.s.demoLang = Store.s.demoLang === 'en' ? 'zh' : 'en'; Store.save(); renderBar(); window.Admin.render(); }
    if (b.dataset.act === 'mail') { window.MailPanel.open(); return; }
    if (b.dataset.act === 'refill') { window.GroupPool.refill(5); renderBar(); U.toast(c().refilled); return; }
    if (b.dataset.act === 'reset') {
      if (!armed) { armed = true; renderBar(); setTimeout(() => { armed = false; renderBar(); }, 3500); return; }
      armed = false; window.GroupPool.reset(); window.MailOutbox.clear(); Store.reset(); window.Admin.reset(); window.Admin.render(); renderBar(); U.toast(c().done);
    }
  });
  bar.addEventListener('change', e => { if (e.target.id === 'poolAuto') { window.GroupPool.setAuto(e.target.checked); renderBar(); } });
  addEventListener('storage', e => { if (e.key === window.GroupPool.KEY || e.key === window.MailOutbox.KEY) renderBar(); });
  function badge() { const n = Store.s.notices.filter(x => !x.seen).length; document.title = (n ? '(' + n + ') ' : '') + (Store.s.demoLang === 'en' ? 'Adviser console' : '顾问后台') + ' · Liverpool Student Map'; }
  window.Admin.mount(document.getElementById('admin'));
  /* 从提醒邮件点进来：adviser.html#会话ID 直接打开这位学生 */
  const openFromHash = () => { const id = decodeURIComponent((location.hash || '').slice(1)); if (id) window.Admin.select(id); };
  openFromHash(); addEventListener('hashchange', openFromHash);
  Store.on(() => { window.Admin.refresh(); badge(); renderBar(); });
  renderBar(); badge();
})();
</script>
</body>
</html>
