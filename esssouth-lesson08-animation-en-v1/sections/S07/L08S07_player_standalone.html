<script>/* shared/toolkit/beat-kit.js */
/*
 * esssouth beat kit: shared pieces for clock-driven teaching beats (it is used by src/beat-open.js;
 * src/beat-renderer.js, the first beat, predates the kit and keeps its own copies).
 *  - math and DOM helpers
 *  - poser: character keyframes (with prep/settle tweaks) blended over 0.45 s; amplitude mouth
 *  - room: the seated characters in a scaled, clipped panel, plus bubbles and their placement
 *  - captions: the baseline phrase segments
 *  - tokens: one element that changes rect and content across scenes (shared elements)
 *  - anchors: times taken from MEASURED silent runs in the decoded clips, with an explicit
 *    estimated fallback. Each anchor records its source, and the page lists them.
 * Every function is a pure function of t; nothing here schedules timers.
 */
(function (global) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg', W = 1920, H = 1080;
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, p) => a + (b - a) * p;
  const F = (t, a, d) => (d <= 0 ? (t >= a ? 1 : 0) : easeIO(clamp((t - a) / d)));
  const win = (t, a, b, fi, fo) => Math.min(F(t, a, fi), 1 - F(t, b - fo, fo));
  const el = (tag, cls, p) => { const n = document.createElement(tag); if (cls) n.className = cls; if (p) p.appendChild(n); return n; };
  const sv = (tag, a, p) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
  const rich = (n, s) => { n.textContent = ''; String(s).split(/\[\[(.+?)\]\]/).forEach((x, i) => { if (!x) return; if (i % 2) { const h = el('span', 'hl', n); h.textContent = x; } else n.appendChild(document.createTextNode(x)); }); return n; };
  const op = (n, o) => { o = clamp(o); n.style.opacity = o.toFixed(3); n.style.visibility = o < 0.003 ? 'hidden' : 'visible'; };
  const lr = (a, b, p) => { const o = {}; Object.keys(a).forEach((k) => (o[k] = typeof a[k] === 'number' && typeof b[k] === 'number' ? lerp(a[k], b[k], p) : p < 0.5 ? a[k] : b[k])); return o; };
  const chain = (t, rects) => { // rects: [[t0, dur, rect], ...]; holds the first rect before t0 and blends each step
    let r = rects[0][2]; for (let i = 1; i < rects.length; i++) { const [t0, d, to] = rects[i]; r = lr(r, to, F(t, t0, d)); } return r; };

  // ---- timing: cues placed in order (gapBefore + measured clip + tail) ----
  function placeCues(beat, clip) {
    const cue = {}; let t = 0;
    beat.cues.forEach((c) => {
      const start = t + (c.gapBefore || 0), len = c.kind === 'hold' ? c.duration : clip[c.id];
      const end = start + len + (c.kind === 'line' ? beat.audioTail : 0);
      cue[c.id] = { id: c.id, start, speechEnd: start + len, end, clip: c.kind === 'line' ? len : null, segments: c.segments || [], speakerId: c.speakerId, kind: c.kind };
      t = end;
    });
    return { cue, duration: t };
  }
  // anchors: runs[id] = measured silent runs [[a,b],...] within the clip (seconds from clip start)
  function anchors(runs, cueTimes) {
    const used = [];
    const A = {
      // k-th silent run (0-based) of a clip that contains the expected number of runs near expect
      pause(id, near, fallback, label) {
        const c = cueTimes[id], rs = (runs[id] || []).filter((r) => r[0] > 0.15 && r[1] < c.clip - 0.1);
        let best = null; rs.forEach((r) => { if (!best || Math.abs(r[0] - near) < Math.abs(best[0] - near)) best = r; });
        const ok = best && Math.abs(best[0] - near) < 0.8;
        const v = ok ? { start: c.start + best[0], end: c.start + best[1], source: 'measured' } : { start: c.start + fallback, end: c.start + fallback + 0.15, source: 'estimated' };
        used.push({ label, id, at: +(v.start - c.start).toFixed(2), source: v.source }); return v;
      },
      est(id, sec, label) { const c = cueTimes[id]; used.push({ label, id, at: +sec.toFixed(2), source: 'estimated' }); return c.start + sec; },
      list: used
    };
    return A;
  }

  // ---- poser ----
  function poser(RIG, chars, rmRef) {
    function resolve(spec, c) {
      const [name, look] = spec.split(':'), base = RIG.POSES[name] || RIG.POSES.neutral;
      let dir = 0; if (look && chars[look] && look !== c.id) dir = Math.sign(chars[look].seatX - c.seatX);
      const A = (k) => RIG.ARM[k] || RIG.ARM.rest, mir = (a) => [-a[0], a[1], -a[2], a[3]], nr = dir >= 0;
      return { lean: base.lean, dir, tilt: base.tilt, nod: base.nod, shake: base.shake, brow: base.brow, inner: base.inner, mouth: base.mouth, turn: dir * 0.85,
        gazeY: look === 'down' ? 1 : base.gazeY || 0, armR: nr ? A(base.near) : A(base.far), armL: nr ? mir(A(base.far)) : mir(A(base.near)) };
    }
    const rest = RIG.ARM.rest;
    const tweaks = {
      prep: (p) => Object.assign(p, { lean: p.lean - 1.2, brow: p.brow + 0.3, mouth: Math.min(p.mouth, 0.1) }),
      settle: (p) => Object.assign(p, { lean: p.lean * 0.6, armR: p.armR.map((v, j) => lerp(v, rest[j], 0.6)), armL: p.armL.map((v, j) => lerp(v, j % 2 ? rest[j] : -rest[j], 0.6)) }),
      down: (p) => Object.assign(p, { gazeY: 0.8 })
    };
    let keys = {};
    const NUM = ['lean', 'dir', 'tilt', 'nod', 'shake', 'brow', 'inner', 'mouth', 'turn', 'gazeY'];
    return {
      set(spec) { keys = {}; Object.keys(spec).forEach((id) => (keys[id] = spec[id].slice().sort((a, b) => a[0] - b[0]).map(([t, s, tw]) => ({ t, pose: tw ? tweaks[tw](resolve(s, chars[id])) : resolve(s, chars[id]) })))); },
      at(id, t) {
        const k = keys[id]; let i = 0; while (i + 1 < k.length && k[i + 1].t <= t) i++;
        const rm = rmRef(), cur = k[i], prev = i ? k[i - 1] : k[0], p = rm ? 1 : F(t, cur.t, 0.45), o = {};
        NUM.forEach((n) => (o[n] = lerp(prev.pose[n], cur.pose[n], p)));
        o.armL = cur.pose.armL.map((v, j) => lerp(prev.pose.armL[j], v, p)); o.armR = cur.pose.armR.map((v, j) => lerp(prev.pose.armR[j], v, p));
        o.eyeTurn = lerp(prev.pose.turn, cur.pose.turn, rm ? 1 : F(t, cur.t - 0.12, 0.25));
        const s = t - cur.t; o.nodNow = rm ? 0 : o.nod * clamp(1 - s / 1.6) * Math.sin(s * Math.PI * 2 * 1.4); o.shakeNow = 0;
        return o;
      }
    };

/*
 * esssouth Lesson 08 · future-audio attachment hook. This review is SILENT: every slot in content/source/audio-slots.en.json
 * has path = null, so create() returns null and nothing is loaded, decoded or played.
 *
 * When narration exists (downstream pass): fill each slot's path (relative to the section folder), durationSeconds
 * (measured) and lang, e.g. with tools/attach-audio.mjs. Then:
 *  - profile(D) returns { voiceSec: { cueId: measuredSeconds } }: the compiler replaces the reading estimate with the
 *    measured clip; anchors keep their relative place in the line; holds, motion durations and branch order are unchanged.
 *  - create(D, C) returns a binder that starts the clip of the cue under the visual clock at the right offset, follows the
 *    same rate (preservesPitch = true) and is stopped by the player's single cancellation boundary (stop()). Audio never
 *    runs past a waiting gate: start(track, t, rate, limit) only schedules clips that begin before `limit`.
 * Missing or undecodable clips are listed in window.__l08audio.problems; they are never silently counted as attached.
 */
(function (global) {
  'use strict';
  function slotsWithAudio(D) { return Object.values((D.audioSlots && D.audioSlots.slots) || {}).filter((s) => s.path); }
  function profile(D) {
    const s = slotsWithAudio(D); if (!s.length) return null;
    const voiceSec = {}; s.forEach((x) => { if (x.durationSeconds != null) voiceSec[x.audioId] = +x.durationSeconds; });

  }
  function create(D) {
    const slots = slotsWithAudio(D); if (!slots.length) return null;
    const els = {}, problems = []; global.__l08audio = { problems, els };
    slots.forEach((s) => { const a = new Audio(); a.preload = 'auto'; a.src = s.path; a.preservesPitch = true; a.addEventListener('error', () => problems.push({ audioId: s.audioId, path: s.path, error: 'load/decode failed' })); els[s.audioId] = a; });
    let timers = [];
    return {
      start(track, t, rate, limit) {
        this.stop();
        track.lines.forEach((c) => { const a = els[c.cueId]; if (!a || c.start >= limit || c.speechEnd <= t) return;
          const begin = () => { a.playbackRate = rate; a.currentTime = Math.max(0, t - c.start); a.play().catch((e) => problems.push({ audioId: c.cueId, error: String(e) })); };

      stop() { timers.forEach(clearTimeout); timers = []; Object.values(els).forEach((a) => { if (!a.paused) a.pause(); }); }

/*
 * L08.S07 · Transfer the Synthesis to a New Task. Section adapter (tokens, rects, timing by cue starts and anchors).

 * is a wireframe with labelled blocks ("Supplied meeting details", "Existing bring-list"); no time, place or item is
 * invented. Support statements are attributed; the readability check stays open; "test proposed" and "no checked
 * layout yet" are separate statuses.
 */
(function (global) {
  'use strict';
  const R = (x, y, w, h, fs) => ({ x, y, w, h, fs });
  const C4 = [150, 570, 990, 1410], C3 = [150, 700, 1250];
  const G = {
    reset: R(150, 290, 620, 50, 24), prompt: R(150, 360, 1620, 200, 30),
    page: R(1190, 300, 580, 470), pH: R(1220, 316, 360, 50, 24), bD: R(1220, 390, 520, 120, 26), bL: R(1220, 530, 520, 200, 26),
    pM: R(150, 380, 960, 90, 28), pN: R(150, 540, 960, 90, 28),
    sM: R(1140, 150, 690, 76, 26), sN: R(1140, 240, 690, 76, 26),
    qM: R(150, 340, 1000, 90, 26), qN: R(150, 480, 1000, 90, 26), n1H: R(1200, 330, 570, 44, 26), n1: R(1200, 386, 570, 150, 30), n2H: R(1200, 560, 570, 44, 26), n2: R(1200, 616, 570, 150, 30),
    cM: R(150, 380, 960, 76, 26), cN: R(150, 520, 960, 76, 26), rd: R(150, 660, 960, 66, 26),
    sMod: R(1140, 330, 690, 84, 26),
    tp: R(150, 420, 760, 100, 30), ru: R(1010, 420, 760, 100, 30),
    hRef: R(150, 300, 1620, 200, 30), hpH: R(150, 520, 1620, 44, 26), hp: R(150, 576, 1620, 200, 30),
    m: C4.map((x) => R(x, 400, 360, 84, 28)), ch: R(560, 540, 800, 66, 26),
    rq: C3.map((x) => R(x, 360, 520, 100, 28)), nxH: R(150, 500, 1620, 44, 26), nx: R(150, 556, 1620, 200, 30)
  };

  function setup(E, ctx) {
    const K = global.L08Kit.base(E, ctx), tok = K.tok, L = E.label;
    tok('page', G.page, 'ctx frame', '', 'token.default'); tok('n1', G.n1, 'note', '', 'token.note'); tok('n2', G.n2, 'note', '', 'token.note');
    tok('hp', G.hp, 'note', '', 'token.note'); tok('nx', G.nx, 'note', '', 'token.note'); // containers first
    tok('reset', G.reset, 'framehead', L('transfer.reset'), 'token.frame'); tok('prompt', G.prompt, 'example', L('transfer.prompt'), 'token.quoteLong');
    tok('pH', G.pH, 'framehead', L('notice.limit'), 'token.frame'); tok('bD', G.bD, 'note', L('notice.details'), 'token.note'); tok('bL', G.bL, 'note', L('notice.list'), 'token.note');
    tok('pM', G.pM, 'proposal', L('x.pM'), 'token.step', { tag: 'x.by.maya' }); tok('pN', G.pN, 'proposal', L('x.pN'), 'token.step', { tag: 'x.by.noah' });
    tok('mT', G.sM, 'step', L('maya.transfer'), 'token.step'); tok('nT', G.sN, 'step', L('noah.transfer'), 'token.step');
    tok('qM', G.qM, 'excerpt', E.cueText('L08.S07.d001'), 'token.step', { tag: 'x.by.maya' }); tok('qN', G.qN, 'excerpt', E.cueText('L08.S07.d002'), 'token.step', { tag: 'x.by.noah' });
    tok('n1H', G.n1H, 'colhead dashed', L('x.shared'), 'token.colhead'); tok('n2H', G.n2H, 'colhead dashed', L('x.check'), 'token.colhead');
    tok('rd', G.rd, 'step gap', L('check.readability'), 'token.step');
    tok('mod', G.sMod, 'framehead', L('transfer.model'), 'token.frame');
    tok('tp', G.tp, 'proposal', L('test.proposed'), 'token.step'); tok('ru', G.ru, 'step gap', L('result.unknown'), 'token.step');
    tok('hpH', G.hpH, 'colhead dashed', L('x.priv'), 'token.colhead');
    ['x.m1', 'x.m2', 'x.m3', 'x.m4'].forEach((k, i) => tok('m' + i, G.m[i], 'step plan', L(k), 'token.step')); tok('ch', G.ch, 'chipcard margin', L('transfer.changed'), 'token.chip');
    ['review.truth', 'review.condition', 'review.action'].forEach((k, i) => tok('rq' + i, G.rq[i], 'question', L(k), 'token.question'));
    tok('nxH', G.nxH, 'colhead dashed', L('x.next'), 'token.colhead');
    K.finishTokens();
    return { DEF: K.DEF, G, optRects: K.optRects, lay };
  }

  function lay(S, tr, X) {
    const { L } = X, at = X.at, a = X.a, X0 = X.X0, B = (n) => 'block.L08.S07.B0' + n, M = X.MOTION;
    X.neutral(S, -1e9); S.roomMode = 'off';
    // ---- B01 · c001: a visible new-case reset; the exact transfer prompt ----
    S.head(X0('c001') + 0.1, B(1), null); S.rise('reset', at('s7_here'), G.reset); S.rise('prompt', at('s7_here') + 0.5, G.prompt);
    // ---- c002: two attributed proposals; a one-page wireframe with labelled placeholder blocks ----
    let t = X0('c002'); S.hide(['prompt'], t);
    S.rise('pM', at('s7_maya'), G.pM); S.rise('pN', at('s7_noah'), G.pN);
    S.rise('page', at('s7_details'), G.page); S.rise('pH', at('s7_details') + 0.2, G.pH); S.rise('bD', at('s7_keep'), G.bD); S.rise('bL', at('s7_keep') + 0.3, G.bL);
    // ---- d001 / d002 · Maya's and Noah's exact support in the new case ----
    t = X0('d001'); S.head(t, null, null); X.clearAll(t);
    X.line('d001', 'explain:learner', ['keeping the checklist'], { headFirst: true }); S.rise('mT', a('d001') + 0.4, G.sM);
    X.line('d002', 'ask:learner', ['readable on one page']); S.rise('nT', a('d002') + 0.4, G.sN);
    // ---- h101: the two quotes beside a blank two-part note ----
    const H1 = X.cue('h101'); X.roomOut(H1.start); X.clearAll(H1.start);
    S.rise('qM', H1.start + 0.3, G.qM); S.rise('qN', H1.start + 0.4, G.qN);
    S.rise('n1H', H1.start + 0.5, G.n1H); S.rise('n1', H1.start + 0.6, G.n1, { text: '' }); S.rise('n2H', H1.start + 0.7, G.n2H); S.rise('n2', H1.start + 0.8, G.n2, { text: '' });
    X.hold('h101');
    // ---- B02 · c003: both proposals move into the one-page candidate; readability stays open ----
    t = X0('c003'); S.head(t, B(2), null); X.clearAll(t);
    S.rise('pM', at('s7_conn'), G.cM); S.rise('pN', at('s7_conn') + 0.2, G.cN); S.rise('page', at('s7_conn') + 0.4, G.page); S.rise('pH', at('s7_conn') + 0.5, G.pH);
    S.rise('bD', at('s7_conn') + 0.7, G.bD); S.rise('bL', at('s7_conn') + 0.8, G.bL); S.title(at('s7_not') - 0.2, 'connection.purpose'); S.rise('rd', at('s7_exact'), G.rd);
    // ---- d003 · the participant's provisional synthesis (no reply, no result follows) ----
    t = X0('d003'); S.head(t, null, null); S.title(t, null); X.clearAll(t);
    S.rise('mT', t + 0.3, G.sM); S.rise('nT', t + 0.4, G.sN);
    X.line('d003', 'propose:maya', ['before choosing the layout'], { headFirst: true }); S.rise('mod', a('d003') + 0.3, G.sMod);
    // ---- c004: "test proposed" and "no checked layout yet" as separate statuses ----
    t = X0('c004'); X.roomOut(t); S.head(t + 0.1, B(2), null); X.clearAll(t);
    S.rise('tp', at('s7_model') + 0.8, G.tp); S.rise('ru', at('s7_doesnt'), G.ru);
    // ---- h102: a blank private area with the prompt as an optional reference ----
    const H2 = X.cue('h102'); X.clearAll(H2.start); S.rise('prompt', H2.start + 0.3, G.hRef); S.rise('hpH', H2.start + 0.5, G.hpH); S.rise('hp', H2.start + 0.6, G.hp, { text: '' });
    X.hold('h102');
    // ---- B03 · c005: what transferred (method headings); the content and constraint changed ----
    t = X0('c005'); S.head(t, B(3), null); X.clearAll(t);
    ['m0', 'm1', 'm2', 'm3'].forEach((id, i) => S.rise(id, at('s7_notice') + 0.6 + i * 0.6, G.m[i])); S.rise('ch', at('s7_changed'), G.ch);
    // ---- c006: optional self-review questions; an open next-turn space ----
    t = X0('c006'); X.clearAll(t);
    S.rise('rq0', at('s7_q1'), G.rq[0]); S.rise('rq1', at('s7_q2'), G.rq[1]); S.rise('rq2', at('s7_q3'), G.rq[2]);
    S.rise('nxH', a('c006') - 0.2, G.nxH); S.rise('nx', a('c006'), G.nx, { text: '' });
  }
  global.L08Scenes = { setup };
})(window);
