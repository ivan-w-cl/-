<script>/* shared/toolkit/beat-kit.js */
/*
 * esssouth beat kit: shared pieces for clock-driven teaching beats (it is used by src/beat-open.js;
 * src/beat-renderer.js, the first beat, predates the kit and keeps its own copies).
 *  - math and DOM helpers
 *  - poser: character keyframes (with prep/settle tweaks) blended over 0.45 s; amplitude mouth
 *  - room: the seated characters in a scaled, clipped panel, plus bubbles and their placement
 *  - captions: the baseline phrase segments
 *  - tokens: one element that changes rect and content across scenes (shared elements)
 *  - anchors: times taken from MEASURED silent runs in the decoded clips, with an explicit
 *    estimated fallback. Each anchor records its source, and the page lists them.
 * Every function is a pure function of t; nothing here schedules timers.
 */
(function (global) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg', W = 1920, H = 1080;
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, p) => a + (b - a) * p;
  const F = (t, a, d) => (d <= 0 ? (t >= a ? 1 : 0) : easeIO(clamp((t - a) / d)));
  const win = (t, a, b, fi, fo) => Math.min(F(t, a, fi), 1 - F(t, b - fo, fo));
  const el = (tag, cls, p) => { const n = document.createElement(tag); if (cls) n.className = cls; if (p) p.appendChild(n); return n; };
  const sv = (tag, a, p) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
  const rich = (n, s) => { n.textContent = ''; String(s).split(/\[\[(.+?)\]\]/).forEach((x, i) => { if (!x) return; if (i % 2) { const h = el('span', 'hl', n); h.textContent = x; } else n.appendChild(document.createTextNode(x)); }); return n; };
  const op = (n, o) => { o = clamp(o); n.style.opacity = o.toFixed(3); n.style.visibility = o < 0.003 ? 'hidden' : 'visible'; };
  const lr = (a, b, p) => { const o = {}; Object.keys(a).forEach((k) => (o[k] = typeof a[k] === 'number' && typeof b[k] === 'number' ? lerp(a[k], b[k], p) : p < 0.5 ? a[k] : b[k])); return o; };
  const chain = (t, rects) => { // rects: [[t0, dur, rect], ...]; holds the first rect before t0 and blends each step
    let r = rects[0][2]; for (let i = 1; i < rects.length; i++) { const [t0, d, to] = rects[i]; r = lr(r, to, F(t, t0, d)); } return r; };

  // ---- timing: cues placed in order (gapBefore + measured clip + tail) ----
  function placeCues(beat, clip) {
    const cue = {}; let t = 0;
    beat.cues.forEach((c) => {
      const start = t + (c.gapBefore || 0), len = c.kind === 'hold' ? c.duration : clip[c.id];
      const end = start + len + (c.kind === 'line' ? beat.audioTail : 0);
      cue[c.id] = { id: c.id, start, speechEnd: start + len, end, clip: c.kind === 'line' ? len : null, segments: c.segments || [], speakerId: c.speakerId, kind: c.kind };
      t = end;
    });
    return { cue, duration: t };
  }
  // anchors: runs[id] = measured silent runs [[a,b],...] within the clip (seconds from clip start)
  function anchors(runs, cueTimes) {
    const used = [];
    const A = {
      // k-th silent run (0-based) of a clip that contains the expected number of runs near expect
      pause(id, near, fallback, label) {
        const c = cueTimes[id], rs = (runs[id] || []).filter((r) => r[0] > 0.15 && r[1] < c.clip - 0.1);
        let best = null; rs.forEach((r) => { if (!best || Math.abs(r[0] - near) < Math.abs(best[0] - near)) best = r; });
        const ok = best && Math.abs(best[0] - near) < 0.8;
        const v = ok ? { start: c.start + best[0], end: c.start + best[1], source: 'measured' } : { start: c.start + fallback, end: c.start + fallback + 0.15, source: 'estimated' };
        used.push({ label, id, at: +(v.start - c.start).toFixed(2), source: v.source }); return v;
      },
      est(id, sec, label) { const c = cueTimes[id]; used.push({ label, id, at: +sec.toFixed(2), source: 'estimated' }); return c.start + sec; },
      list: used
    };
    return A;
  }

  // ---- poser ----
  function poser(RIG, chars, rmRef) {
    function resolve(spec, c) {
      const [name, look] = spec.split(':'), base = RIG.POSES[name] || RIG.POSES.neutral;
      let dir = 0; if (look && chars[look] && look !== c.id) dir = Math.sign(chars[look].seatX - c.seatX);
      const A = (k) => RIG.ARM[k] || RIG.ARM.rest, mir = (a) => [-a[0], a[1], -a[2], a[3]], nr = dir >= 0;
      return { lean: base.lean, dir, tilt: base.tilt, nod: base.nod, shake: base.shake, brow: base.brow, inner: base.inner, mouth: base.mouth, turn: dir * 0.85,
        gazeY: look === 'down' ? 1 : base.gazeY || 0, armR: nr ? A(base.near) : A(base.far), armL: nr ? mir(A(base.far)) : mir(A(base.near)) };
    }
    const rest = RIG.ARM.rest;
    const tweaks = {
      prep: (p) => Object.assign(p, { lean: p.lean - 1.2, brow: p.brow + 0.3, mouth: Math.min(p.mouth, 0.1) }),
      settle: (p) => Object.assign(p, { lean: p.lean * 0.6, armR: p.armR.map((v, j) => lerp(v, rest[j], 0.6)), armL: p.armL.map((v, j) => lerp(v, j % 2 ? rest[j] : -rest[j], 0.6)) }),
      down: (p) => Object.assign(p, { gazeY: 0.8 })
    };
    let keys = {};
    const NUM = ['lean', 'dir', 'tilt', 'nod', 'shake', 'brow', 'inner', 'mouth', 'turn', 'gazeY'];
    return {
      set(spec) { keys = {}; Object.keys(spec).forEach((id) => (keys[id] = spec[id].slice().sort((a, b) => a[0] - b[0]).map(([t, s, tw]) => ({ t, pose: tw ? tweaks[tw](resolve(s, chars[id])) : resolve(s, chars[id]) })))); },
      at(id, t) {
        const k = keys[id]; let i = 0; while (i + 1 < k.length && k[i + 1].t <= t) i++;
        const rm = rmRef(), cur = k[i], prev = i ? k[i - 1] : k[0], p = rm ? 1 : F(t, cur.t, 0.45), o = {};
        NUM.forEach((n) => (o[n] = lerp(prev.pose[n], cur.pose[n], p)));
        o.armL = cur.pose.armL.map((v, j) => lerp(prev.pose.armL[j], v, p)); o.armR = cur.pose.armR.map((v, j) => lerp(prev.pose.armR[j], v, p));
        o.eyeTurn = lerp(prev.pose.turn, cur.pose.turn, rm ? 1 : F(t, cur.t - 0.12, 0.25));
        const s = t - cur.t; o.nodNow = rm ? 0 : o.nod * clamp(1 - s / 1.6) * Math.sin(s * Math.PI * 2 * 1.4); o.shakeNow = 0;
        return o;
      }

/*

 *    same rate (preservesPitch = true) and is stopped by the player's single cancellation boundary (stop()). Audio never
 *    runs past a waiting gate: start(track, t, rate, limit) only schedules clips that begin before `limit`.

s":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.d001":{"id":"L07.S03.d001","speaker":"learner","text":"After exchanging names, pairs could—","visualEn":"Show only this unfinished learner fragment in its lane. Do not reveal the rest of the pending point yet. The trailing dash denotes an unfinished turn, not a sound to synthesize. Keep the turn visibly unfinished when the next lane begins.","anchorHint":"pairs could","screenLabelIds":["overlap.learner"],"audioId":"L07.S03.d001","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S03.d002":{"id":"L07.S03.d002","speaker":"noah","text":"We could each draw or write—","visualEn":"Show only the exact opening fragment of F05 in Noah’s second lane, beginning while the learner lane is marked unfinished. Do not expose the full proposal in subtitles, a hidden label or a completed diagram before a branch supplies it. The silent illustration must not claim audible overlap verification.","anchorHint":"draw or write","screenLabelIds":["overlap.noah"],"audioId":"L07.S03.d002","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S03.c003":{"id":"L07.S03.c003","speaker":"coach","text":"We have two unfinished turns, not a complete comparison of ideas. A small repair can decide who continues while keeping the other point available. It need not decide which proposal is better.","visualEn":"Freeze the two fragments beside two neutral continuation places. No idea is adopted, rejected or fully revealed, and no intent or hostility is assigned.","anchorHint":"not a complete comparison of ideas","screenLabelIds":["repair.purpose"],"audioId":"L07.S03.c003","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c004":{"id":"L07.S03.c004","speaker":"coach","text":"You can offer someone room to finish, or ask briefly to finish your own point. The useful choice depends on the moment. Giving a turn away does not mean agreeing, and finishing a turn is not a claim to leadership.","visualEn":"Present two legitimate turn-order moves with equal weight. Neither receives a moral ranking, permanent leader role or agreement badge.","anchorHint":"does not mean agreeing","screenLabelIds":["turn.choice","turn.boundary"],"audioId":"L07.S03.c004","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c005":{"id":"L07.S03.c005","speaker":"coach","text":"If you let the other person continue, keep a short reminder of your unfinished point. Otherwise, an intended return can be lost. The reminder should preserve the point without competing with the next speaker’s whole explanation.","visualEn":"Show a small parked-point marker, not the hidden full learner sentence. Leave Noah’s full idea unavailable; no simultaneous full paragraphs or permanent transcript clutter.","anchorHint":"keep a short reminder","screenLabelIds":["park.rule"],"audioId":"L07.S03.c005","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c006":{"id":"L07.S03.c006","speaker":"coach","text":"Privately identify the immediate need here. Is it to choose a final activity, or to make the next turn hearable and preserve what remains unfinished? Keep the task decision separate from this turn-taking repair.","visualEn":"Retain the two short fragments and a blank private planning area. Do not reveal full proposals or invite a premature vote.","anchorHint":"preserve what remains unfinished","screenLabelIds":["reflection.prompt"],"audioId":"L07.S03.c006","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c007":{"id":"L07.S03.c007","speaker":"coach","text":"Compare these next turns. One asks to finish, one tries to settle the activity too early, and one makes room while keeping a point to return to. Examine what each actually accomplishes.","visualEn":"Reveal equal neutral alternatives after the source fragments. Do not preselect a move or portray yielding as universally superior.","anchorHint":"what each actually accomplishes","screenLabelIds":["choice.prompt"],"audioId":"L07.S03.c007","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c008":{"id":"L07.S03.c008","speaker":"coach","text":"The peer replies are written possibilities. A polite request still needs attention to the answer. Treat permission to continue as permission for a turn, not as approval of the idea itself.","visualEn":"Maintain the practice-example frame and separate turn permission from proposal state. No applause, complete-agreement symbol or claimed learner speech evaluation.","anchorHint":"not as approval of the idea itself","screenLabelIds":["choice.note"],"audioId":"L07.S03.c008","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c010":{"id":"L07.S03.c010","speaker":"coach","text":"The shared principle is to make the next turn clear while protecting an unfinished point. This is a decision about speaking order. It does not settle whether an idea fits the task or whether anyone agrees with it.","visualEn":"All branches and Skip rejoin from the two common unfinished-turn facts only. Clear branch-specific full proposals and permissions. Keep the task undecided.","anchorHint":"a decision about speaking order","screenLabelIds":["shared.principle"],"audioId":"L07.S03.c010","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c011":{"id":"L07.S03.c011","speaker":"coach","text":"If you offer someone the turn, listen to what follows before returning. You can then connect your point to what was said, or explain why it still needs attention. Do not assume your parked point has already been understood.","visualEn":"Show a general offer-listen-return relationship without inserting the content of an unplayed branch. Avoid a guaranteed smooth outcome or compulsory exact phrase.","anchorHint":"has already been understood","screenLabelIds":["return.rule"],"audioId":"L07.S03.c011","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c012":{"id":"L07.S03.c012","speaker":"coach","text":"In a separate example, we can now see the learner’s complete point about linking the introductions to the drawing group.","visualEn":"Reset to a clearly labelled Separate worked example before the full learner sentence. This new common premise is valid after every branch or Skip; no prior agreed turn is implied.","anchorHint":"the learner’s complete point","screenLabelIds":["common.example"],"audioId":"L07.S03.c012","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.d003":{"id":"L07.S03.d003","speaker":"learner","text":"After exchanging names, pairs could identify one question about the weekly drawing group.","visualEn":"Reveal this exact supplied pending point as the new worked example. Keep it unadopted. Identifying a question does not by itself provide accurate programme information; its answer source remains unresolved.","anchorHint":"one question about the weekly drawing group","screenLabelIds":["pending.full","pending.limit"],"audioId":"L07.S03.d003","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S03.c013":{"id":"L07.S03.c013","speaker":"coach","text":"That adds a possible question-forming step. It does not yet tell newcomers the answer or identify where reliable group information will come from. The task connection still needs development, even after the turn is clear.","visualEn":"Connect the question-forming proposal to an unresolved answer/source card. Do not invent a helper, programme, confirmed facts or evidence that the second aim is achieved.","anchorHint":"even after the turn is clear","screenLabelIds":["task.limit"],"audioId":"L07.S03.c013","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c014":{"id":"L07.S03.c014","speaker":"coach","text":"Return privately to the original two unfinished turns. Choose a short way to arrange the next turn and preserve the other point. You may ask to finish or offer room. Pause if you want longer.","visualEn":"Restore only the original fragments for private rehearsal. Hide full branch replies and the later shared worked example; leave the private response area blank and both turn-order choices available.","anchorHint":"preserve the other point","screenLabelIds":["private.prompt"],"audioId":"L07.S03.c014","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.c015":{"id":"L07.S03.c015","speaker":"coach","text":"Check what your chosen move would leave unfinished. A useful repair makes space without pretending the discussion is settled. Next, we will consider inviting a contribution while leaving the person free to pass or join later.","visualEn":"End with a neutral self-check and fresh-excerpt invitation-section title. No completed real attempt, adoption or universal ranking of turn-taking styles.","anchorHint":"without pretending the discussion is settled","screenLabelIds":["review.question","next.title"],"audioId":"L07.S03.c015","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.d101":{"id":"L07.S03.d101","speaker":"learner","text":"Could I finish this point first?","visualEn":"Authored alternative A from the two unfinished fragments. Keep it as a legitimate request, not a demand to dominate or a rejection of Noah’s idea.","anchorHint":"finish this point first","screenLabelIds":["branch.a.label"],"audioId":"L07.S03.d101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S03.d102":{"id":"L07.S03.d102","speaker":"noah","text":"Yes, please finish your point.","visualEn":"Noah grants turn-taking space in this authored continuation. Do not reveal his full F05 proposal or infer support for the learner’s proposal. The learner’s full point is not yet spoken within this branch.","anchorHint":"finish your point","screenLabelIds":[],"audioId":"L07.S03.d102","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S03.f101":{"id":"L07.S03.f101","speaker":"coach","text":"This is a reasonable way to protect an unfinished turn. It does not fulfil the specific aim of letting Noah go first, and he would still need room afterward. His yes concerns the speaking order, not the proposal.","visualEn":"Keep the source fragments and turn-order marker, with both ideas unadopted. No universal judgement against direct requests to finish.","anchorHint":"His yes concerns the speaking order","screenLabelIds":["branch.a.note"],"audioId":"L07.S03.f101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.d201":{"id":"L07.S03.d201","speaker":"learner","text":"We both have ideas, so let's do both activities.","visualEn":"Authored alternative B. Show a proposed merge as unconfirmed wording, never a chosen plan. Keep both incomplete ideas visibly incomplete.","anchorHint":"let's do both activities","screenLabelIds":["branch.b.label"],"audioId":"L07.S03.d201","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S03.d202":{"id":"L07.S03.d202","speaker":"noah","text":"I haven't finished explaining my suggestion.","visualEn":"Noah points to the observable unfinished turn. Do not reveal his full proposal or assign annoyance, hostility or opposition to combining ideas.","anchorHint":"haven't finished explaining","screenLabelIds":[],"audioId":"L07.S03.d202","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S03.f201":{"id":"L07.S03.f201","speaker":"coach","text":"Combining useful parts may eventually produce one coherent activity. Here the ideas have not been heard fully, and their fit with both aims remains open. A turn-taking difficulty has been bypassed with an unsupported decision.","visualEn":"Separate the possibility of a coherent future combination from the premature merge. Do not impose a ban on multiple connected steps or show any activity as adopted.","anchorHint":"one coherent activity","screenLabelIds":["branch.b.note"],"audioId":"L07.S03.f201","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S03.d301":{"id":"L07.S03.d301","speaker":"learner","text":"Go ahead, Noah. Afterwards, I'd like to finish my point about linking the paired introductions to the drawing group.","visualEn":"Authored alternative C. Offer the next turn and park only the named topic. Do not reveal the learner’s entire pending sentence or imply agreement with Noah’s still-unheard idea.","anchorHint":"I'd like to finish my point","screenLabelIds":["branch.c.label"],"audioId":"L07.S03.d301","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S03.d302":{"id":"L07.S03.d302","speaker":"noah","text":"We could each draw or write one thing we'd like to try, then use that to introduce ourselves.","visualEn":"Now and only now in this branch reveal the exact complete F05 proposal in one clear speaking lane. The earlier overlap fragment is replaced, not repeated as a second full simultaneous paragraph. The proposal remains unadopted and does not supply the drawing group’s programme information.","anchorHint":"then use that to introduce ourselves","screenLabelIds":["branch.c.noah"],"audioId":"L07.S03.d302","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S03.f301":{"id":"L07.S03.f301","speaker":"coach","text":"This gives Noah room to explain and keeps a visible point to return to. The learner still needs to make that return; the phrase alone does not complete it. Hearing the proposal is not deciding to adopt it.","visualEn":"Retain the small parked-topic marker alongside Noah’s unadopted proposal. No completed return, agreement or successful activity is invented.","anchorHint":"the phrase alone does not complete it","screenLabelIds":["branch.c.note"],"audioId":"L07.S03.f301","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"}},"holds":{"L07.S03.h101":{"kind":"hold","id":"L07.S03.h101","seconds":8,"purpose":"Privately distinguish the turn-taking need from choosing an activity.","visualEn":"Keep both fragments unfinished and the private area blank. The hold is learner reflection, not a continued real interruption or measured silence.","modes":["watch","practice"],"recordedResponse":false},"L07.S03.h102":{"kind":"hold","id":"L07.S03.h102","seconds":8,"purpose":"Privately rehearse one proportionate turn-taking repair.","visualEn":"Keep the private area blank. Do not infer speaking, evaluate timing, record audio or decide the task on the viewer’s behalf.","modes":["watch","practice"],"recordedResponse":false}},"interactions":{"L07.I02":{"kind":"choice","prompt":"Which move lets Noah explain his idea while preserving the learner’s unfinished point for a return?","watchChoice":"C","watchThinkSeconds":8,"rejoinCue":"L07.S03.c010","options":[{"id":"A","label":"Could I finish this point first?","events":[{"kind":"line","id":"L07.S03.d101"},{"kind":"li <script>/* shared/l07/player.js */

 *

 *  - Watch and Practice. Watch plays the declared path ('watch' route). Practice plays the common route and, at a gate,
 *    WAITS without a timer: awaiting_choice → branch_playing → branch_ready → common continuation (Continue), or Skip.
 *    Try again restores the gate baseline. Play / Space / rate changes / elapsed time never choose.
 *  - Seek: forward across an unvisited gate stops at the gate; before it resets the attempt; inside a branch the scrubber
 *    is branch-local. A mode switch inside a gate or branch resets to that mode's declared entry; outside, the common cue
 *    and offset are kept.
 *  - S06 private rehearsal: model playback sets only modelViewed = true. speakingObserved, completionAssumed and
 *    proposalAdopted stay false. Nothing is stored, recorded or uploaded; no microphone is requested.
 *  - Future audio: shared/l07/audio-hook.js binds clips to the SAME clock if slots carry paths (none in this review).
 * URL: ?mode=practice ?t=<s> ?rm=1 ?nocap=1 ?rate=1.5 ?timing=retime-demo ?text=x1.3|x1.6|long ?debug=slots ?export=1
 *      ?route=<key> (export/QA only: render a Practice route linearly)

  'use strict';

    function renderDomCap(tr, s) {
      let txt = '', who = '';
      if (ST.mode === 'practice' && (ST.gate === 'awaiting' || ST.gate === 'branch_ready')) { const k = 'wait|' + ST.gate; if (lastCap.k === k) return; lastCap.k = k; $('domcap').textContent = uiText('gate.prompt'); return; }
      Object.values(tr.captionCues).forEach((c) => c.segments.forEach((sg) => { if (ST.t >= c.start + sg.start - 0.1 && ST.t <= c.start + sg.end + 0.25) { txt = sg.text; who = (charMap[c.speakerId] || { name: 'Coach' }).name; } }));
      if (!txt && s.kind === 'hold') { who = ''; txt = labels['hold.' + s.id].text + ' ' + uiText('ui.pauseMore'); }
      if (!txt && (s.kind === 'think' || s.kind === 'gate')) { who = ''; txt = uiText('gate.prompt'); }
      const k = who + '|' + txt; if (lastCap.k === k) return; lastCap.k = k;
      const d = $('domcap'); d.textContent = ''; if (who) { const bb = document.createElement('b'); bb.textContent = who; d.appendChild(bb); } d.appendChild(document.createTextNode(txt));
    }
    // the interaction panel (DOM, outside the scaled stage so it stays readable on phones)
    const P = $('ipanel');
    function btn(label, cls, on, extra) { const b = document.createElement('button'); b.type = 'button'; b.className = cls || ''; b.textContent = label; b.addEventListener('click', on); if (extra) extra(b); return b; }
    let panelKey = null;
    function renderPanel(s, atEnd) {
      const key = [ST.mode, ST.gate, ST.choice, atEnd, s.kind === 'think' ? 'think' : ''].join('|'); if (key === panelKey) return; panelKey = key;
      P.textContent = ''; P.hidden = true;
      const head = (t) => { const h = document.createElement('p'); h.className = 'iprompt'; h.textContent = t; P.appendChild(h); };
      const stat = (t) => { const p = document.createElement('p'); p.className = 'istatus'; p.textContent = t; P.appendChild(p); };
      const row = () => { const r = document.createElement('div'); r.className = 'irow'; P.appendChild(r); return r; };
      if (GATE && ST.mode === 'watch' && s.kind === 'think') { P.hidden = false; head(uiText('gate.prompt')); stat(uiText('ui.watchPath') + ' ' + (GATE.kind === 'choice' ? GATE.watchKey : uiText('ui.model').toLowerCase()) + '.'); return; }
      if (GATE && ST.mode === 'practice' && ST.gate !== 'before' && ST.gate !== 'resolved') {
        P.hidden = false; head(uiText('gate.prompt'));
        if (GATE.kind === 'choice') { const r = row(); r.classList.add('opts');
          GATE.options.forEach((o) => r.appendChild(btn(o.key + '. ' + xf(o.label), 'opt', () => choose(o.key), (b) => { b.dataset.choice = o.key; b.setAttribute('aria-pressed', String(ST.choice === o.key)); b.disabled = ST.gate !== 'awaiting'; }))); }
        const r2 = row();
        if (ST.gate === 'awaiting') { stat(uiText(GATE.kind === 'choice' ? 'ui.awaitChoice' : 'ui.awaitRehearsal'));
          if (GATE.kind !== 'choice') { r2.appendChild(btn(uiText('ui.model'), 'primary', () => choose('model'), (b) => (b.dataset.act = 'model'))); r2.appendChild(btn(uiText('ui.continue'), '', () => skip(), (b) => (b.dataset.act = 'continue'))); }
          r2.appendChild(btn(uiText('ui.skip'), '', () => skip(), (b) => (b.dataset.act = 'skip'))); }
        if (ST.gate === 'branch_playing') { stat(uiText('ui.branchPlaying') + (ST.choice === 'model' ? '' : ' ' + ST.choice) + '.'); r2.appendChild(btn(uiText('ui.retry'), '', () => retry(), (b) => (b.dataset.act = 'retry'))); r2.appendChild(btn(uiText('ui.skip'), '', () => skip(), (b) => (b.dataset.act = 'skip'))); }
        if (ST.gate === 'branch_ready') { stat(uiText(ST.choice === 'model' ? 'ui.modelReady' : 'ui.branchReady')); r2.appendChild(btn(uiText('ui.continue'), 'primary', () => cont(), (b) => (b.dataset.act = 'continue'))); r2.appendChild(btn(uiText('ui.retry'), '', () => retry(), (b) => (b.dataset.act = 'retry'))); }
        return;
      }
      if (atEnd) { P.hidden = false; stat(uiText('ui.end')); const r = row();
        r.appendChild(btn(uiText('ui.replay'), '', () => restart(), (b) => (b.dataset.act = 'replay')));
        if (D.nav && D.nav.prev) r.appendChild(btn(uiText('ui.previous'), '', () => nav(D.nav.prev), (b) => (b.dataset.act = 'prev')));
        if (D.nav && D.nav.next) r.appendChild(btn(uiText('ui.next') + ': ' + D.nav.nextTitle, 'primary', () => nav(D.nav.next), (b) => (b.dataset.act = 'next'))); }
    }
    function nav(target) { // explicit user action only; never automatic
      pause(); if (window.parent !== window) { window.parent.postMessage({ l07: 'nav', section: target.id }, '*'); return; }
      const href = /_player_standalone\.html$/.test(location.pathname) ? target.id.replace('.', '') + '_player_standalone.html' : target.href; // standalone players sit side by side
      location.href = href + (ST.mode === 'practice' ? '?mode=practice' : ''); }

    // ---------------- wiring ----------------
    $('play').addEventListener('click', () => (ST.playing ? pause() : play()));
    $('restart').addEventListener('click', restart);
    $('scrub').addEventListener('input', (e) => seek(parseFloat(e.target.value)));
    $('cap').checked = q.get('nocap') !== '1'; $('cap').addEventListener('change', () => { lastCap.k = null; render(); });
    $('rm').checked = E.rm; $('rm').addEventListener('change', (e) => { E.rm = e.target.checked; render(); });
    $('rate').addEventListener('change', (e) => setRate(e.target.value));
    document.querySelectorAll('[data-mode]').forEach((n) => n.addEventListener('click', () => setMode(n.dataset.mode)));
    const onKey = (e) => { if (e.target.closest && e.target.closest('button,input,select,textarea,a')) return;
      if (e.code === 'Space') { e.preventDefault(); ST.playing ? pause() : play(); } else if (e.code === 'ArrowRight') seekBy(5); else if (e.code === 'ArrowLeft') seekBy(-5); };
    document.addEventListener('keydown', onKey);
    const onVis = () => { if (document.hidden && ST.playing) pause(); }; document.addEventListener('visibilitychange', onVis);
    window.addEventListener('message', (e) => { const m = e.data || {}; if (m.l07 === 'pause') pause(); if (m.l07 === 'mode') setMode(m.mode); });
    window.addEventListener('pagehide', () => { stop(); });

    // ---------------- start ----------------
    resetGate(); setRoute(q.get('route') && C.tracks[q.get('route')] ? q.get('route') : baseRoute());
    if (q.get('route')) { ST.gate = 'none'; ST.mode = q.get('route') === 'watch' ? 'watch' : 'practice'; ST.exportRoute = true; }
    if (q.get('rate')) setRate(q.get('rate'));
    const t0 = Math.max(0, parseFloat(q.get('t')) || 0); if (t0) { if (ST.exportRoute) ST.t = Math.min(track().duration, t0); else seek(t0); }
    const dur = C.tracks.watch.duration;
    note(`Silent English review · Watch ${dur.toFixed(3)} s` + (GATE ? ` · Practice common ${COMMON.duration.toFixed(3)} s + branch + unlimited waiting` : ' · Practice uses the same route') +
      ` · ${profile ? 'timing profile: ' + (q.get('timing') || 'audio') : 'estimated reading timing (140 wpm + 0.35 s tail)'} · ${C.anchors.length} anchors.`);
    if (E.warnings.length) note('Layout report: ' + E.warnings.length + ' item(s) · ' + JSON.stringify(E.warnings.slice(0, 12)), true);
    render(); document.body.dataset.ready = '1';
    if (window.parent !== window) { window.parent.postMessage({ l07: 'ready', section: D.sectionId }, '*');
      let lastH = 0; const postH = () => { const h = document.documentElement.scrollHeight; if (Math.abs(h - lastH) > 2) { lastH = h; window.parent.postMessage({ l07: 'height', h }, '*'); } };
      if (window.ResizeObserver) new ResizeObserver(postH).observe(document.body); postH(); }
    window.__l07 = { E, C, scores, ST, get t() { return ST.t; }, get playing() { return ST.playing; }, play, pause, seek, restart, choose, cont, retry, skip, setMode, setRate,
      scrubValue, scrubRange, warnings: E.warnings, uiText,
      renderAt(x, route) { stop(); ST.playing = false; if (route) { setRoute(route); ST.exportRoute = true; ST.gate = 'none'; } ST.t = x; E.render(score(), x, { captions: $('cap').checked, playing: true }); return x; },
      destroy() { stop(); document.removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onVis); } };
  }
  boot().catch((e) => { console.error(e); note('Startup failed: ' + e.message, true); document.body.dataset.ready = 'error'; });
})();
