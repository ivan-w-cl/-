<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8">
<title>Promo stage</title>
<link rel="stylesheet" href="/font/400.css"><link rel="stylesheet" href="/font/700.css"><link rel="stylesheet" href="/font/900.css">
<style>
/* 宣传片舞台：1920×1080，所有画面都是时间 t 的函数（window.S.frame(t)），录制脚本逐帧调用后截图 */
:root { --ink: #1d1d1f; --soft: #6e6e73; --coral: #c2522f; --bg1: #fbf8f2; --bg2: #ebe3d2; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg1); font-family: 'Noto Sans SC', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#bg { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, var(--bg1) 0%, #f4eee3 55%, var(--bg2) 100%); }
#cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
.dev { position: absolute; transform-origin: 50% 50%; }
/* 手机外框：通用的全面屏手机，不用任何品牌图形 */
.phone { width: 418px; height: 872px; left: 751px; top: 104px; }
.phone .body { position: absolute; inset: 0; border-radius: 66px; background: linear-gradient(145deg, #3a3a3c, #1c1c1e 40%, #2c2c2e); padding: 14px;
  box-shadow: 0 50px 90px -30px rgba(60, 40, 20, .45), 0 20px 40px -20px rgba(60, 40, 20, .35), inset 0 0 0 1.5px rgba(255,255,255,.12); }
.phone .btn { position: absolute; width: 4px; border-radius: 2px; background: #2c2c2e; }
.screen { position: relative; width: 390px; height: 844px; border-radius: 53px; overflow: hidden; background: #f1e4c3; isolation: isolate; }
.screen iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; display: block; }
.status { position: absolute; left: 0; right: 0; top: 0; height: 47px; z-index: 5; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 44px;
  font: 600 17px/1 'Noto Sans SC', sans-serif; color: #000; }
.status .r { display: flex; gap: 6px; align-items: center; }
.island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 6; }
.homebar { position: absolute; left: 50%; bottom: 8px; width: 138px; height: 5px; margin-left: -69px; border-radius: 3px; background: rgba(0,0,0,.78); z-index: 6; }
/* 平板 / 折叠屏（片尾用） */
.tablet { width: 1214px; height: 874px; left: 353px; top: 103px; }
.tablet .body { position: absolute; inset: 0; border-radius: 46px; background: linear-gradient(145deg, #3a3a3c, #1c1c1e 40%, #2c2c2e); padding: 20px; box-shadow: 0 50px 90px -30px rgba(60,40,20,.45); }
.tablet .screen { width: 1174px; height: 834px; border-radius: 28px; }
.tablet .screen iframe { width: 1174px; height: 834px; }
.fold { width: 772px; height: 702px; left: 574px; top: 189px; }
.fold .body { position: absolute; inset: 0; border-radius: 44px; background: linear-gradient(145deg, #3a3a3c, #1c1c1e 40%, #2c2c2e); padding: 13px; box-shadow: 0 50px 90px -30px rgba(60,40,20,.45); }
.fold .screen { width: 746px; height: 676px; border-radius: 32px; }
.fold .screen iframe { width: 746px; height: 676px; }
.fold .crease { position: absolute; left: 50%; top: 13px; bottom: 13px; width: 2px; margin-left: -1px; background: linear-gradient(rgba(0,0,0,.06), rgba(0,0,0,.12), rgba(0,0,0,.06)); z-index: 6; }
/* 手指点按 */
.tap { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,255,255,.42); border: 2px solid rgba(255,255,255,.9);
  box-shadow: 0 6px 18px rgba(0,0,0,.18); z-index: 9; opacity: 0; pointer-events: none; }
/* 标题 */
#titles { position: absolute; inset: 0; pointer-events: none; }
.tt { position: absolute; opacity: 0; will-change: transform, opacity, filter; }
.tt .k { font: 600 28px/1.3 'Noto Sans SC'; color: var(--coral); letter-spacing: .04em; margin-bottom: 14px; }
.tt .h { font: 700 76px/1.18 'Noto Sans SC'; letter-spacing: .01em; white-space: nowrap; }
.tt .s { font: 400 30px/1.55 'Noto Sans SC'; color: var(--soft); margin-top: 18px; }
.tt.c { text-align: center; }
.tt.big .h { font-size: 112px; font-weight: 900; }
/* 片尾标题：在设备上方，小一号 */
.tt.end .h { font-size: 64px; font-weight: 800; }
.tt.end .s { font-size: 28px; margin-top: 12px; letter-spacing: .04em; }
.tt.big .h { line-height: 1.16; }
#phone { z-index: 3; } #tablet { z-index: 2; } #fold { z-index: 2; }
/* 竖版 1080×1920（?p=1） */
html.portrait, html.portrait body { width: 1080px; height: 1920px; }
html.portrait .tt .h { font-size: 82px; }
html.portrait .tt.big .h { font-size: 118px; }
html.portrait .tt.end .h { font-size: 76px; }
html.portrait .tt.end .s { font-size: 30px; }
#veil { position: absolute; inset: 0; background: var(--bg1); opacity: 0; pointer-events: none; }
</style></head>
<script>if (new URLSearchParams(location.search).get('p') === '1') document.documentElement.classList.add('portrait');</script>
<body>
<div id="bg"></div>
<div id="cam">
  <div class="dev phone" id="phone">
    <div class="btn" style="left:-3px;top:170px;height:34px"></div><div class="btn" style="left:-3px;top:230px;height:62px"></div><div class="btn" style="left:-3px;top:306px;height:62px"></div><div class="btn" style="right:-3px;top:250px;height:96px"></div>
    <div class="body"><div class="screen" id="scr">
      <iframe id="app" src="about:blank"></iframe>
      <div class="status"><span>9:41</span><span class="r">
        <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.6c2.4 0 4.6.9 6.2 2.5l1.2-1.2C13.9 1.9 11.3.9 8.5.9S3.1 1.9 1.1 3.9l1.2 1.2C3.9 3.5 6.1 2.6 8.5 2.6zm0 3.4c1.5 0 2.8.6 3.8 1.5l1.2-1.2C12.2 5 10.4 4.3 8.5 4.3S4.8 5 3.5 6.3l1.2 1.2c1-.9 2.3-1.5 3.8-1.5zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.5 7 10c.4-.4.9-.6 1.5-.6z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".45"/></svg>
      </span></div>
      <div class="island"></div><div class="homebar"></div>
      <div class="tap" id="tap"></div>
    </div></div>
  </div>
  <div class="dev tablet" id="tablet" style="opacity:0"><div class="body"><div class="screen"><iframe id="appT" src="about:blank"></iframe></div></div></div>
  <div class="dev fold" id="fold" style="opacity:0"><div class="body"><div class="screen"><iframe id="appF" src="about:blank"></iframe><div class="crease"></div></div></div></div>
</div>
<div id="titles"></div>
<div id="veil"></div>
<script src="engine.js"></script>
<script>document.write('<script src="' + (new URLSearchParams(location.search).get('tl') || 'timeline') + '.js"><\/script>');</script>   <!-- ?tl=timeline-30 选 30 秒版 -->
</body></html>
