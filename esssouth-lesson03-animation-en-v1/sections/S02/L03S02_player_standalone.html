/* stage */

<script>/* shared/toolkit/beat-kit.js */
/*
 * esssouth beat kit: shared pieces for clock-driven teaching beats (it is used by src/beat-open.js;
 * src/beat-renderer.js, the first beat, predates the kit and keeps its own copies).
 *  - math and DOM helpers
 *  - poser: character keyframes (with prep/settle tweaks) blended over 0.45 s; amplitude mouth
 *  - room: the seated characters in a scaled, clipped panel, plus bubbles and their placement
 *  - captions: the baseline phrase segments
 *  - tokens: one element that changes rect and content across scenes (shared elements)
 *  - anchors: times taken from MEASURED silent runs in the decoded clips, with an explicit
 *    estimated fallback. Each anchor records its source, and the page lists them.
 * Every function is a pure function of t; nothing here schedules timers.
 */
(function (global) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg', W = 1920, H = 1080;
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, p) => a + (b - a) * p;
  const F = (t, a, d) => (d <= 0 ? (t >= a ? 1 : 0) : easeIO(clamp((t - a) / d)));
  const win = (t, a, b, fi, fo) => Math.min(F(t, a, fi), 1 - F(t, b - fo, fo));
  const el = (tag, cls, p) => { const n = document.createElement(tag); if (cls) n.className = cls; if (p) p.appendChild(n); return n; };
  const sv = (tag, a, p) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
  const rich = (n, s) => { n.textContent = ''; String(s).split(/\[\[(.+?)\]\]/).forEach((x, i) => { if (!x) return; if (i % 2) { const h = el('span', 'hl', n); h.textContent = x; } else n.appendChild(document.createTextNode(x)); }); return n; };
  const op = (n, o) => { o = clamp(o); n.style.opacity = o.toFixed(3); n.style.visibility = o < 0.003 ? 'hidden' : 'visible'; };
  const lr = (a, b, p) => { const o = {}; Object.keys(a).forEach((k) => (o[k] = typeof a[k] === 'number' && typeof b[k] === 'number' ? lerp(a[k], b[k], p) : p < 0.5 ? a[k] : b[k])); return o; };
  const chain = (t, rects) => { // rects: [[t0, dur, rect], ...]; holds the first rect before t0 and blends each step
    let r = rects[0][2]; for (let i = 1; i < rects.length; i++) { const [t0, d, to] = rects[i]; r = lr(r, to, F(t, t0, d)); } return r; };

  // ---- timing: cues placed in order (gapBefore + measured clip + tail) ----
  function placeCues(beat, clip) {
    const cue = {}; let t = 0;
    beat.cues.forEach((c) => {
      const start = t + (c.gapBefore || 0), len = c.kind === 'hold' ? c.duration : clip[c.id];
      const end = start + len + (c.kind === 'line' ? beat.audioTail : 0);
      cue[c.id] = { id: c.id, start, speechEnd: start + len, end, clip: c.kind === 'line' ? len : null, segments: c.segments || [], speakerId: c.speakerId, kind: c.kind };
      t = end;
    });
    return { cue, duration: t };
  }
  // anchors: runs[id] = measured silent runs [[a,b],...] within the clip (seconds from clip start)
  function anchors(runs, cueTimes) {
    const used = [];
    const A = {
      // k-th silent run (0-based) of a clip that contains the expected number of runs near expect
      pause(id, near, fallback, label) {
        const c = cueTimes[id], rs = (runs[id] || []).filter((r) => r[0] > 0.15 && r[1] < c.clip - 0.1);
        let best = null; rs.forEach((r) => { if (!best || Math.abs(r[0] - near) < Math.abs(best[0] - near)) best = r; });
        const ok = best && Math.abs(best[0] - near) < 0.8;
        const v = ok ? { start: c.start + best[0], end: c.start + best[1], source: 'measured' } : { start: c.start + fallback, end: c.start + fallback + 0.15, source: 'estimated' };
        used.push({ label, id, at: +(v.start - c.start).toFixed(2), source: v.source }); return v;
      },
      est(id, sec, label) { const c = cueTimes[id]; used.push({ label, id, at: +sec.toFixed(2), source: 'estimated' }); return c.start + sec; },
      list: used
    };
    return A;
  }

  // ---- poser ----
  function poser(RIG, chars, rmRef) {
    function resolve(spec, c) {
      const [name, look] = spec.split(':'), base = RIG.POSES[name] || RIG.POSES.neutral;
      let dir = 0; if (look && chars[look] && look !== c.id) dir = Math.sign(chars[look].seatX - c.seatX);
      const A = (k) => RIG.ARM[k] || RIG.ARM.rest, mir = (a) => [-a[0], a[1], -a[2], a[3]], nr = dir >= 0;
      return { lean: base.lean, dir, tilt: base.tilt, nod: base.nod, shake: base.shake, brow: base.brow, inner: base.inner, mouth: base.mouth, turn: dir * 0.85,
        gazeY: look === 'down' ? 1 : base.gazeY || 0, armR: nr ? A(base.near) : A(base.far), armL: nr ? mir(A(base.far)) : mir(A(base.near)) };
    }
    const rest = RIG.ARM.rest;
    const tweaks = {
      prep: (p) => Object.assign(p, { lean: p.lean - 1.2, brow: p.brow + 0.3, mouth: Math.min(p.mouth, 0.1) }),
      settle: (p) => Object.assign(p, { lean: p.lean * 0.6, armR: p.armR.map((v, j) => lerp(v, rest[j], 0.6)), armL: p.armL.map((v, j) => lerp(v, j % 2 ? rest[j] : -rest[j], 0.6)) }),
      down: (p) => Object.assign(p, { gazeY: 0.8 })
    };
    let keys = {};
    const NUM = ['lean', 'dir', 'tilt', 'nod', 'shake', 'brow', 'inner', 'mouth', 'turn', 'gazeY'];
    return {
      set(spec) { keys = {}; Object.keys(spec).forEach((id) => (keys[id] = spec[id].slice().sort((a, b) => a[0] - b[0]).map(([t, s, tw]) => ({ t, pose: tw ? tweaks[tw](resolve(s, chars[id])) : resolve(s, chars[id]) })))); },
      at(id, t) {
        const k = keys[id]; let i = 0; while (i + 1 < k.length && k[i + 1].t <= t) i++;
        const rm = rmRef(), cur = k[i], prev = i ? k[i - 1] : k[0], p = rm ? 1 : F(t, cur.t, 0.45), o = {};
        NUM.forEach((n) => (o[n] = lerp(prev.pose[n], cur.pose[n], p)));
        o.armL = cur.pose.armL.map((v, j) => lerp(prev.pose.armL[j], v, p)); o.armR = cur.pose.armR.map((v, j) => lerp(prev.pose.armR[j], v, p));
        o.eyeTurn = lerp(prev.pose.turn, cur.pose.turn, rm ? 1 : F(t, cur.t - 0.12, 0.25));
        const s = t - cur.t; o.nodNow = rm ? 0 : o.nod * clamp(1 - s / 1.6) * Math.sin(s * Math.PI * 2 * 1.4); o.shakeNow = 0;
        return o;
      }
    };
  }
  function mouth(core, env, cueT, t, rm) {
    if (!cueT) return 0; const u = t - cueT.start; if (u < 0 || u > cueT.clip) return 0;
    if (env) { const a = core.envelopeAt(env, u); return a > 0 ? (rm ? 0.35 : 0.1 + 0.8 * a) : 0; }
    return rm ? 0.35 : 0.25 + 0.5 * Math.abs(Math.sin(u * Math.PI * 4.6));
  }

  // ---- room ----
  function room(stage, RIG, characters, tf) {
    const box = el('div', 'room', stage);
    const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H }, box);
    sv('rect', { x: 60, y: 150, width: 1800, height: 640, rx: 44, fill: '#ECEFF4' }, s);
    const backs = sv('g', {}, s);

      tracks[key] = tr;
    });
    const anchorList = Object.entries(A).map(([name, a]) => ({ name, cue: a.cue, phrase: a.phrase, localSec: +localOf(name).toFixed(3), suppliedSec: a.supplied != null ? a.supplied : null, source: a.source }));
    return { tracks, gate, cueTiming: ct, anchors: anchorList, holdSec, words };
  }

  // the common section position of route time x (the skip/main route is the common timeline: no branch, gate as a point)
  function commonTime(C, route, x) {
    const common = C.tracks[C.gate ? 'practice:skip' : 'practice:main'], s = route.stepAt(x);
    if (common.has(s.id) && s.common) return common.cue(s.id).start + Math.min(x - s.start, s.dur);
    if (C.gate) return common.gateStep.end; // inside the gate, a branch or the think hold: the gate's common position
    return x;
  }
  return { compile, commonTime, words, TAIL, GATE_PRESENT };
});

 * Deliberate extension (recorded in STYLE_PROVENANCE.md): the bubble tail points at the speaking seat for Maya and Noah

    X.id = (s) => (s.indexOf('.') >= 0 && s.startsWith('L03') ? s : P + s);

      if (think && G.kind === 'choice') S.put('opt.' + G.watchKey, g.end - 0.9, MOTION.morph, { kind: 'option sel', act: 1 });

<script>/* shared/l03/audio-hook.js */
/*
 * esssouth Lesson 03 · future-audio attachment hook. This review is SILENT: every slot in content/source/audio-slots.en.json
 * has path = null, so create() returns null and nothing is loaded, decoded or played.
 *
 * When narration exists (downstream pass): fill each slot's path (relative to the section folder), durationSeconds
 * (measured) and lang, e.g. with tools/attach-audio.mjs. Then:
 *  - profile(D) returns { voiceSec: { cueId: measuredSeconds } }: the compiler replaces the reading estimate with the
 *    measured clip; anchors keep their relative place in the line; holds, motion durations and branch order are unchanged.
 *  - create(D, C) returns a binder that starts the clip of the cue under the visual clock at the right offset, follows the
 *    same rate (preservesPitch = true) and is stopped by the player's single cancellation boundary (stop()). Audio never
 *    runs past a waiting gate: start(track, t, rate, limit) only schedules clips that begin before `limit`.
 * Missing or undecodable clips are listed in window.__l03audio.problems; they are never silently counted as attached.
 */
(function (global) {
  'use strict';
  function slotsWithAudio(D) { return Object.values((D.audioSlots && D.audioSlots.slots) || {}).filter((s) => s.path); }
  function profile(D) {
    const s = slotsWithAudio(D); if (!s.length) return null;
    const voiceSec = {}; s.forEach((x) => { if (x.durationSeconds != null) voiceSec[x.audioId] = +x.durationSeconds; });
    return { voiceSec, source: 'measured audio (' + (D.audioSlots.lang || 'en') + ')' };
  }
  function create(D) {
    const slots = slotsWithAudio(D); if (!slots.length) return null;
    const els = {}, problems = []; global.__l03audio = { problems, els };
    slots.forEach((s) => { const a = new Audio(); a.preload = 'auto'; a.src = s.path; a.preservesPitch = true; a.addEventListener('error', () => problems.push({ audioId: s.audioId, path: s.path, error: 'load/decode failed' })); els[s.audioId] = a; });
    let timers = [];
    return {
      start(track, t, rate, limit) {
        this.stop();
        track.lines.forEach((c) => { const a = els[c.cueId]; if (!a || c.start >= limit || c.speechEnd <= t) return;
          const begin = () => { a.playbackRate = rate; a.currentTime = Math.max(0, t - c.start); a.play().catch((e) => problems.push({ audioId: c.cueId, error: String(e) })); };

      },
      stop() { timers.forEach(clearTimeout); timers = []; Object.values(els).forEach((a) => { if (!a.paused) a.pause(); }); }
    };

official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.d001":{"id":"L03.S02.d001","speaker":"noah","text":"I would keep the demonstration brief, so people have time to try. I am worried that someone who misses a step could get left behind.","visualEn":"Replay the exact baseline source line once with Noah. Keep quote segments available for later comparison. No response is attributed to the viewer.","anchorHint":"I am worried that someone who misses a step could get left behind","screenLabelIds":["quote.noah"],"audioId":"L03.S02.d001","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice."},"L03.S02.c003":{"id":"L03.S02.c003","speaker":"coach","text":"Suppose you want to check this whole contribution before proposing a change. Keep the brief demonstration, the reason for it, and the possible difficulty in view.","visualEn":"Move source fragments into three meaning cards, preserving brief, time to try and could. The task is a whole-contribution check for this moment, not a general demand.","anchorHint":"before proposing a change","screenLabelIds":["check.target"],"audioId":"L03.S02.c003","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c004":{"id":"L03.S02.c004","speaker":"coach","text":"A paraphrase can use different words. What matters is whether the listener can recognise their point, including its limits. Changing could to will makes a possible difficulty sound certain.","visualEn":"Compare could and will in a labelled analysis area. The stronger wording is an interpretation to examine, never a fact added to the scenario.","anchorHint":"makes a possible difficulty sound certain","screenLabelIds":["paraphrase.rule","modal.possible","modal.certain"],"audioId":"L03.S02.c004","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c005":{"id":"L03.S02.c005","speaker":"coach","text":"Leaving something out is a different issue. A short check may be useful when only one detail needs confirming. Here, however, we are checking both the purpose and the concern.","visualEn":"Keep omission and distortion visually separate. Use a narrow-detail card beside the current whole-contribution task; neither is a universal good/bad category.","anchorHint":"both the purpose and the concern","screenLabelIds":["check.context"],"audioId":"L03.S02.c005","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c006":{"id":"L03.S02.c006","speaker":"coach","text":"Before choosing a response, recall the original point. What does Noah want to keep, why does he want it brief, and what does he say could happen?","visualEn":"Show the source fragments and a blank private recall area. Hide all choice options during this reflection; no inferred retrieval.","anchorHint":"what does he say could happen","screenLabelIds":["reflection.prompt"],"audioId":"L03.S02.c006","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c007":{"id":"L03.S02.c007","speaker":"coach","text":"Each response uses part of the same topic. Compare what it preserves, what it omits, and whether it makes the original claim stronger. Choose the most faithful check for this moment.","visualEn":"Introduce three equal-sized choice cards only as the gate arrives. No option is visually privileged, revealed early or attached to a permanent good/bad character.","anchorHint":"whether it makes the original claim stronger","screenLabelIds":["choice.prompt"],"audioId":"L03.S02.c007","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c008":{"id":"L03.S02.c008","speaker":"coach","text":"The replies that follow are authored examples of how this exchange could continue. They illustrate the wording; they do not predict how every speaker would react.","visualEn":"Retain the original source above the alternatives. Label the consequences as authored examples without adding mood meters or performance scores.","anchorHint":"authored examples","screenLabelIds":["choice.note"],"audioId":"L03.S02.c008","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c010":{"id":"L03.S02.c010","speaker":"coach","text":"A useful check preserves the point you need to understand. In this exchange, that includes a brief demonstration, time to try, and the possibility of missing a step. None cancels the others.","visualEn":"All paths enter here once. Reconstruct essential source meaning from the original line, without assuming which branch was viewed or that a choice was made.","anchorHint":"None cancels the others","screenLabelIds":["shared.check"],"audioId":"L03.S02.c010","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c011":{"id":"L03.S02.c011","speaker":"coach","text":"When the meaning is already clear, you can respond directly. When a small detail is uncertain, check that detail. Repeating an entire contribution may use time without improving understanding.","visualEn":"Show three contexts: clear meaning, one uncertain detail, whole point uncertain. Keep them alternatives chosen by context, not a numbered ritual.","anchorHint":"check that detail","screenLabelIds":["check.selective"],"audioId":"L03.S02.c011","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c012":{"id":"L03.S02.c012","speaker":"coach","text":"A check should also leave room for correction. You are offering your reading, not telling someone what they must mean. Their reply may confirm it, narrow it or change your understanding.","visualEn":"Keep the interpretation card editable and the source intact. Three neutral response directions remain possibilities, without predicted facial reactions or scores.","anchorHint":"offering your reading","screenLabelIds":["check.open"],"audioId":"L03.S02.c012","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c013":{"id":"L03.S02.c013","speaker":"coach","text":"Try a brief check of Noah’s meaning in your own words. Keep the proposal and its purpose, and preserve the possibility in his concern. You do not need to copy the example.","visualEn":"Hide the complete authored paraphrases. Keep short source fragments and a genuinely blank response area. Do not show a microphone or inferred transcript.","anchorHint":"preserve the possibility in his concern","screenLabelIds":["rehearsal.prompt"],"audioId":"L03.S02.c013","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c014":{"id":"L03.S02.c014","speaker":"coach","text":"You can think first or speak privately. Nothing is recorded or assessed. There is a short pause here; pause playback yourself if you want more time.","visualEn":"Show a neutral pause hint before the hold. No required countdown performance or claim that speaking was observed.","anchorHint":"Nothing is recorded or assessed","screenLabelIds":["rehearsal.private","rehearsal.time"],"audioId":"L03.S02.c014","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c015":{"id":"L03.S02.c015","speaker":"coach","text":"If you tried a version, compare its meaning with the source. Did you add certainty, lose the purpose, or leave something unclear? If you did not rehearse, you can return when ready.","visualEn":"Offer neutral self-review questions beside the original source. No comparison to a fabricated learner transcript, diagnosis, grade or completion marker.","anchorHint":"compare its meaning with the source","screenLabelIds":["review.prompt"],"audioId":"L03.S02.c015","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c016":{"id":"L03.S02.c016","speaker":"coach","text":"Paraphrasing helps when you have a reading to check. Sometimes the words themselves leave the relevant part unspecified. Then a focused question may be more useful than a longer summary.","visualEn":"Move from a tentative interpretation to a small unresolved referent, preserving the difference between checking and asking for missing information.","anchorHint":"a focused question may be more useful","screenLabelIds":["bridge.check","bridge.ask"],"audioId":"L03.S02.c016","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.c017":{"id":"L03.S02.c017","speaker":"coach","text":"Next we will examine that choice: asking for the information needed to respond, while leaving already clear details alone. Keep the question connected to the discussion in front of you.","visualEn":"End on the next-section title without automatically navigating, rewarding, opening a new question or showing a purchase prompt.","anchorHint":"the information needed to respond","screenLabelIds":["next.title"],"audioId":"L03.S02.c017","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.d101":{"id":"L03.S02.d101","speaker":"learner","text":"You want people to have more time to practise.","visualEn":"Authored alternative A from the common source baseline. Highlight the retained purpose without inventing other retained details.","anchorHint":"more time to practise","screenLabelIds":["branch.a.label"],"audioId":"L03.S02.d101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice."},"L03.S02.d102":{"id":"L03.S02.d102","speaker":"noah","text":"Yes, and I still want a brief demonstration. I am also thinking about someone who misses a step.","visualEn":"Authored Noah continuation, calm and matter-of-fact. Reintroduce the source proposal and concern; no hurt or triumphant acting.","anchorHint":"someone who misses a step","screenLabelIds":[],"audioId":"L03.S02.d102","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice."},"L03.S02.f101":{"id":"L03.S02.f101","speaker":"coach","text":"This check captures the purpose, but leaves out the proposed demonstration and the concern. It could serve a narrower check. For our present task, we need to preserve those other parts too.","visualEn":"Explain partial coverage using the original three meaning cards. No grade, failure badge or assumption about the learner’s real understanding.","anchorHint":"It could serve a narrower check","screenLabelIds":["branch.a.note"],"audioId":"L03.S02.f101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.d201":{"id":"L03.S02.d201","speaker":"learner","text":"You want a brief demonstration so people have time to try, and you are concerned that someone who misses a step might fall behind.","visualEn":"Authored alternative B from the unchanged source baseline. Match proposal, purpose and possible concern to exact source fragments.","anchorHint":"someone who misses a step might fall behind","screenLabelIds":["branch.b.label"],"audioId":"L03.S02.d201","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice."},"L03.S02.d202":{"id":"L03.S02.d202","speaker":"noah","text":"Yes. I want time for people to try, while keeping a demonstration and a way to help if someone misses a step.","visualEn":"Authored Noah continuation. Present a possible support need as a topic to develop, not a support plan already adopted.","anchorHint":"if someone misses a step","screenLabelIds":[],"audioId":"L03.S02.d202","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice."},"L03.S02.f201":{"id":"L03.S02.f201","speaker":"coach","text":"This paraphrase keeps the proposal, its purpose and the possible difficulty. Noah confirms that reading in this example. The wording is different, but the uncertainty and the connection between the parts remain.","visualEn":"Analyze the authored exchange only. Match might to could without erasing uncertainty. No student mastery claim or simulated automatic assessment.","anchorHint":"the uncertainty and the connection","screenLabelIds":["branch.b.note"],"audioId":"L03.S02.f201","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L03.S02.d301":{"id":"L03.S02.d301","speaker":"learner","text":"You want a brief demonstration so people can practise, and anyone who misses a step will get left behind.","visualEn":"Authored alternative C from the source baseline. Retain proposal and purpose, then isolate anyone/will as a strengthened version under examination.","anchorHint":"will get left behind","screenLabelIds":["branch.c.label"],"audioId":"L03.S02.d301","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice."},"L03.S02.d302":{"id":"L03.S02.d302","speaker":"noah","text":"They could get left behind, but that is not certain. I am raising a possibility we should consider.","visualEn":"Authored Noah correction with a calm delivery. Restore source uncertainty; no accusation, humiliation or claim of universal reaction.","anchorHint":"that is not certain","screenLabelIds":[],"audioId":"L03.S02.d302","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice."},"L03.S02.f301":{"id":"L03.S02.f301","speaker":"coach","text":"The proposal and purpose are recognisable, but the concern has become a certainty about anyone who misses a step. Restore the possible wording rather than defending a stronger claim the speaker did not make.","visualEn":"Compare only the changed scope and modality. Keep the concern as possible, not a guaranteed result or real workshop finding.","anchorHint":"a stronger claim the speaker did not make","screenLabelIds":["branch.c.note"],"audioId":"L03.S02.f301","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."}},"holds":{"L03.S02.h101":{"kind":"hold","id":"L03.S02.h101","seconds":8,"purpose":"Privately recall the source meaning before comparing paraphrases.","visualEn":"Retain the source quote; no choice labels, model, selected focus or learner success state appear during the hold.","modes":["watch","practice"],"recordedResponse":false},"L03.S02.h102":{"kind":"hold","id":"L03.S02.h102","seconds":8,"purpose":"Privately formulate a faithful check, with extra time available by pausing.","visualEn":"Keep the response area blank throughout. Hide f  *    WAITS without a timer: awaiting_choice → branch_playing → branch_ready → common continuation (Continue), or Skip.

 *  - Future audio: shared/l03/audio-hook.js binds clips to the SAME clock if slots carry paths (none in this review).

        return;

        r.appendChild(btn(uiText('ui.replay'), '', () => restart(), (b) => (b.dataset.act = 'replay')));
        if (D.nav && D.nav.prev) r.appendChild(btn(uiText('ui.previous'), '', () => nav(D.nav.prev), (b) => (b.dataset.act = 'prev')));
        if (D.nav && D.nav.next) r.appendChild(btn(uiText('ui.next') + ': ' + D.nav.nextTitle, 'primary', () => nav(D.nav.next), (b) => (b.dataset.act = 'next'))); }
    }
    function nav(target) { // explicit user action only; never automatic

    $('rate').addEventListener('change', (e) => setRate(e.target.value));

    if (q.get('rate')) setRate(q.get('rate'));

      let lastH = 0; const postH = () => { const h = document.documentElement.scrollHeight; if (Math.abs(h - lastH) > 2) { lastH = h; window.parent.postMessage({ l03: 'height', h }, '*'); } };
      if (window.ResizeObserver) new ResizeObserver(postH).observe(document.body); postH(); }
