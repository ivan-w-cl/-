<!doctype html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex,nofollow">
<script src="team-preview-data.js"></script>
<script src="team-preview.js"></script>
<script src="team-preview-demo.js"></script>
<style>.team-preview-badge{position:fixed;right:16px;bottom:16px;z-index:80;border:1px solid var(--line,#ddd);border-radius:24px;padding:9px 14px;background:var(--surface,#fff);color:var(--muted,#696970);font:12px system-ui;box-shadow:0 3px 16px #0001;cursor:pointer}@media(max-width:700px){.team-preview-badge{bottom:calc(76px + env(safe-area-inset-bottom));right:10px;font-size:11px}}</style>
<meta charset="utf-8">
<title>综评国本备考院 · esssouth</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="platform.css">
<link rel="stylesheet" href="experience.css">
<link rel="stylesheet" href="question-library.css">
<link rel="stylesheet" href="discussion-layer.css">
<style>
/* Layout: left rail (today / practice / courses / mocks / records + my schools) and one calm content column.
   Practice, lessons, live rooms and mocks open as a full-screen focus layer instead of windows. */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --tile:#E8E8E4; --tile2:#F7F7F4; --ink:#1A1A1C; --muted:#696970; --faint:#9B9BA0; --line:#E1E1DC;
  --accent:#DD5636; --accent-ink:#FFFFFF; --accent-soft:#FBE8E2;
  --xj:#2B8494; --xj-soft:#E2F0F2; --cu:#B44E68; --cu-soft:#F6E5EA; --gray:#8A8A90; --gray-soft:#EDEDEA;
  --ok:#2E8656; --ok-soft:#E3F2E9; --warn:#A86E14; --warn-soft:#F8EEDB;
  --stage:#121315; --stage-2:#1C1D20; --stage-ink:#ECECEC; --stage-muted:#9C9CA2;
  --overlay:rgba(24,24,26,.42); --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.07);
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1C1C1F; --tile:#26262A; --tile2:#202023; --ink:#F1F1EF; --muted:#A3A3A9; --faint:#6F6F75; --line:#2E2E33;
  --accent:#EC6A4A; --accent-ink:#FFFFFF; --accent-soft:#3B231D;
  --xj:#55B2C2; --xj-soft:#173135; --cu:#DA7A93; --cu-soft:#3A2028; --gray:#9A9AA0; --gray-soft:#2A2A2E;
  --ok:#5CBF86; --ok-soft:#18301F; --warn:#E0A84A; --warn-soft:#352A16;
  --overlay:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1C1C1F; --tile:#26262A; --tile2:#202023; --ink:#F1F1EF; --muted:#A3A3A9; --faint:#6F6F75; --line:#2E2E33;
  --accent:#EC6A4A; --accent-ink:#FFFFFF; --accent-soft:#3B231D;
  --xj:#55B2C2; --xj-soft:#173135; --cu:#DA7A93; --cu-soft:#3A2028; --gray:#9A9AA0; --gray-soft:#2A2A2E;
  --ok:#5CBF86; --ok-soft:#18301F; --warn:#E0A84A; --warn-soft:#352A16;
  --overlay:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:15px}
.brand{flex:none}.brand b{font-size:16px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--faint);line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--tile2);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav a .n{margin-left:auto;font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:0 7px;font-weight:700}
.rail-h{font-size:11px;letter-spacing:.12em;color:var(--faint);padding:0 10px;margin-bottom:4px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--gray)}
.dot.si{background:#786193}.chip.si{background:color-mix(in srgb,#786193 13%,var(--surface));color:var(--ink)}.school-h .bar.si{background:#786193}
.dot.xj{background:var(--xj)} .dot.cu{background:var(--cu)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.rail-foot button{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--muted);font-size:13px;text-align:left}
.rail-foot button:hover{background:var(--tile2);color:var(--ink)}
.demo-clock{font-size:11px;color:var(--faint);padding:0 10px}

.main{padding-block:36px 120px;padding-inline:clamp(16px,4vw,56px);min-width:0}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.page-h{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em}
.page-h h1{font-size:clamp(26px,3.2vw,34px);font-weight:900;line-height:1.25}
.page-h p{color:var(--muted);max-width:60ch}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h .aside{font-size:13px;color:var(--muted)}
.link{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.link:hover{color:var(--ink)}

/* tiles & cards */
.tile{background:var(--tile);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:28px;font-weight:900;line-height:1.1}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.tile.accent{background:var(--accent);color:var(--accent-ink)}
.tile.accent .k{color:var(--accent-ink);opacity:.85}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--tile2);opacity:1}
.btn.soft{background:var(--tile);color:var(--ink)}
.btn.light{background:var(--accent-ink);color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;background:var(--tile);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.free{background:var(--ok-soft);color:var(--ok)}
.chip.paid{background:var(--warn-soft);color:var(--warn)}
.chip.live{background:var(--accent-soft);color:var(--accent)}
.chip.xj{background:var(--xj-soft);color:var(--xj)} .chip.cu{background:var(--cu-soft);color:var(--cu)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* today */
.today-top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.next{padding:24px 26px;gap:14px;justify-content:space-between;min-height:210px}
.next .lbl{font-size:12px;letter-spacing:.1em;font-weight:700;opacity:.85}
.next h2{font-size:26px;font-weight:900;line-height:1.3}
.next p{opacity:.9;max-width:46ch}
.next .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.live-strip{display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

.sched{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .when b{display:block;font-size:14px}
.srow .when span{font-size:12px;color:var(--muted)}
.srow .what{display:flex;flex-direction:column;gap:3px;min-width:0}
.srow .what b{font-weight:500}
.empty{padding:22px;color:var(--muted);font-size:14px;text-align:center}

.school-card{padding:18px 20px;display:flex;flex-direction:column;gap:14px;text-decoration:none}
.school-card:hover{box-shadow:var(--shadow)}
.sc-h{display:flex;align-items:center;gap:10px}
.sc-h b{font-size:17px}
.sc-h .chip{margin-left:auto}
.pathbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pathbar div{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.pathbar i{display:block;height:5px;border-radius:5px;background:var(--tile)}
.pathbar i.half{background:linear-gradient(90deg,var(--ink) 50%,var(--tile) 50%)}
.pathbar i.full{background:var(--ink)}

/* item rows */
.items{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .ico{width:40px;height:40px;border-radius:11px;background:var(--tile2);display:grid;place-items:center;color:var(--muted)}
.irow .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.irow .t b{font-weight:500}
.irow .t span{font-size:13px;color:var(--muted)}
.irow .act{display:flex;gap:8px;align-items:center}

/* school page */
.school-h{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.school-h .bar{width:36px;height:4px;border-radius:4px;background:var(--gray);margin-bottom:12px}
.school-h .bar.xj{background:var(--xj)} .school-h .bar.cu{background:var(--cu)}
.format{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.format .tile .v{font-size:20px}
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:st}
.stage{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.stage-h{display:flex;align-items:center;gap:8px}
.stage-h .num{width:22px;height:22px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:12px;font-weight:700}
.stage-h .num.done{background:var(--ink);color:var(--bg)}
.stage-h b{font-size:15px}
.stage p{font-size:12.5px;color:var(--muted);line-height:1.5}
.mini{display:flex;flex-direction:column;gap:6px}
.mini a,.mini button{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--tile2);text-decoration:none;text-align:left;width:100%}
.mini a:hover,.mini button:hover{background:var(--tile)}
.mini b{font-size:13.5px;font-weight:500;line-height:1.4}
.mini span{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.tasks .irow{grid-template-columns:28px minmax(0,1fr) auto}
.cbox{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--faint);display:grid;place-items:center;color:var(--bg)}
.cbox.on{background:var(--ink);box-shadow:none}
.date-in{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:13px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;background:var(--tile2);border-radius:var(--r);font-size:14px;color:var(--muted)}
.notice b{color:var(--ink);font-weight:500}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{height:32px;padding:0 13px;border-radius:999px;font-size:13px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.filters button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.pcard{padding:18px;display:flex;flex-direction:column;gap:12px}
.pcard h3{font-size:16px;font-weight:700}
.pcard p{font-size:13px;color:var(--muted)}
.pcard .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}

/* course detail */
.lessons .irow .ico{font-family:var(--f-mono);font-size:13px}
.buybox{padding:20px;display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}

/* mock stepper */
.stepper{display:flex;gap:0;align-items:center;flex-wrap:wrap;row-gap:8px}
.stepper span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--faint)}
.stepper span.on{color:var(--ink);font-weight:700}
.stepper span.done{color:var(--muted)}
.stepper span+span::before{content:"";width:22px;height:1px;background:var(--line);margin:0 8px}
.seat{font-size:12px;color:var(--muted)}

/* review */
.quote{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--muted);font-size:14px}
.fb{display:flex;flex-direction:column;gap:10px}
.fb li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.fb ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:2px}
.mark.g{background:var(--ok-soft);color:var(--ok)} .mark.i{background:var(--warn-soft);color:var(--warn)}
.transcript{display:flex;flex-direction:column;gap:12px;padding:18px}
.tline{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;font-size:14px}
.tline .who{font-size:12px;color:var(--muted);padding-top:2px}
.tline.me .who{color:var(--ink);font-weight:700}
.tline.me .txt{font-weight:500}

/* focus layer */
.focus{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.f-top{display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) clamp(16px,3vw,28px) 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.f-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.f-title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-title .chip{flex:none}
.f-timer{font-family:var(--f-mono);font-size:15px;padding:4px 10px;border-radius:8px;background:var(--tile2)}
.f-body{flex:1;overflow-y:auto;padding:clamp(20px,4vw,48px) clamp(16px,4vw,48px) 40px}
.f-col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.f-col.wide{max-width:1120px}
.topic{padding:24px 26px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.topic .over{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.topic h2{font-size:clamp(20px,2.6vw,26px);font-weight:700;line-height:1.35}
.stage-steps{display:flex;gap:6px;flex-wrap:wrap}
.stage-steps span{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--tile);color:var(--muted)}
.stage-steps span.on{background:var(--ink);color:var(--bg)}
.stage-steps span.done{background:var(--tile2);color:var(--faint);text-decoration:line-through}
textarea.in{width:100%;min-height:150px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:14px 16px;line-height:1.7;font-size:15px}
textarea.in:focus{outline:2px solid var(--ink);outline-offset:-1px}
.countdown{font-family:var(--f-mono);font-size:56px;font-weight:500;line-height:1;letter-spacing:-.02em}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px 0}
.members{display:flex;gap:8px;flex-wrap:wrap}
.member{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--tile);color:var(--ink);flex:none}
.av.me{background:var(--ink);color:var(--bg)}
.av.talk{box-shadow:0 0 0 2px var(--accent)}

.chat{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:640px}
.msg .bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:14.5px;line-height:1.6}
.msg .name{font-size:12px;color:var(--muted);margin-bottom:3px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:14px 4px 14px 14px}
.msg.me .name{text-align:right}
.msg.sys{align-self:center;max-width:none}
.msg.sys .bubble{background:transparent;border:0;color:var(--muted);font-size:13px;padding:0}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.composer{position:sticky;bottom:0;background:var(--bg);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.moves{display:flex;gap:6px;flex-wrap:wrap}
.moves button{font-size:12.5px;height:28px;padding:0 11px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.moves button:hover{color:var(--ink)}
.cin{display:flex;gap:8px;align-items:flex-end}
.cin textarea{flex:1;min-height:48px;max-height:160px;resize:none;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;font-size:15px;line-height:1.5}
.micbtn{width:48px;height:48px;border-radius:50%;background:var(--tile);display:grid;place-items:center;color:var(--muted);flex:none}
.hint{font-size:12px;color:var(--faint)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:13px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:15px}
.opt:hover{border-color:var(--faint)}
.opt .l{width:26px;height:26px;border-radius:8px;background:var(--tile);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}

/* player */

.screen .bigt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:8%;gap:10px}

.prog i{display:block;height:100%;background:var(--stage-ink);width:0}
.ctrl .mono{font-size:12px;color:var(--stage-muted)}
.lockscreen{position:absolute;inset:0;background:rgba(10,10,12,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.livechip{position:absolute;top:14px;left:14px;display:flex;gap:8px;align-items:center;font-size:12px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:999px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .card{padding:14px}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;font-size:13.5px}

.chatlog p.t b{color:var(--accent)}
.lessonlist button{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;width:100%;text-align:left;font-size:13.5px}
.lessonlist button:hover{background:var(--tile2)}
.lessonlist button.on{background:var(--tile)}
.lessonlist .mono{font-size:12px;color:var(--faint);width:20px}

/* mock room */
.room{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:760px;width:100%;margin:0 auto}
.cand{aspect-ratio:4/3;border-radius:12px;background:var(--stage-2);color:var(--stage-ink);display:flex;align-items:flex-end;padding:10px;font-size:12.5px;position:relative}

.cand.empty{background:var(--tile2);color:var(--faint)}
.checks{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.checks div{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:88vh;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);animation:rise .25s}

.xbtn{width:32px;height:32px;border-radius:50%;background:var(--tile2);display:grid;place-items:center;color:var(--muted);flex:none}
.slot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);width:100%;text-align:left;gap:10px}

.slot[disabled]{opacity:.45;cursor:not-allowed}
.demo-note{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:9px}

/* onboarding */
.onb{min-height:100%;display:flex;justify-content:center;padding-block:56px 80px;padding-inline:16px}
.onb-in{width:min(760px,100%);display:flex;flex-direction:column;gap:24px}
.onb h1{font-size:clamp(28px,4vw,40px);font-weight:900;line-height:1.2}
.searchbox{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}

.pick{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left}

.pick .t span{display:block;font-size:12.5px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.seg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.onb-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;bottom:0;padding:14px 0;background:var(--bg)}

/* dock */
.dock{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.dock button{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px}
.dock button .go{background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 11px;font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;animation:rise .2s;max-width:calc(100% - 32px)}

/* design notes */
.ia{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ia div{background:var(--tile2);border-radius:12px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:4px}

.notes-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.notes-list b{color:var(--ink);font-weight:500}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp td,table.cmp th{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{font-size:12px;color:var(--muted);font-weight:500}

/* ---------- motion & richer visuals ---------- */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(10%,-8%) scale(1.18)}}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}}
@keyframes talkring{0%,100%{box-shadow:0 0 0 2px var(--accent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 22%,transparent)}}

.anim .wrap>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}

.anim .stagger>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms + .15s)}
.card,.tile,.btn,.opt,.slot,.mini a,.mini button,.ftab{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background .2s,border-color .2s,opacity .15s}
a.card:hover,.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.btn:active,.opt:active,.slot:active{transform:scale(.97)}
.btn .ic{transition:transform .2s}.btn:hover .ic{transform:translateX(2px)}
.mini a:hover,.mini button:hover{transform:translateX(3px)}
.deco svg{width:100%;height:100%;display:block}
.ring{display:block;flex:none}
.ring .track{stroke:var(--tile)}

.ring text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.next{position:relative;overflow:hidden;isolation:isolate}

.bars{display:flex;align-items:flex-end;gap:6px;height:58px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;min-height:4px;border-radius:4px 4px 2px 2px;background:var(--faint);opacity:.4;transform-origin:bottom}

.anim .bars i{animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + .25s)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:4px}

.wave{display:block;width:100%;height:70px}

.tag.ai{background:var(--accent-soft);color:var(--accent)}.tag.hu{background:var(--tile);color:var(--muted)}
.seats .irow{grid-template-columns:40px minmax(0,1fr) auto}
.segs{display:flex;padding:3px;border-radius:11px;background:var(--tile)}

.screen .blob{position:absolute;width:60%;aspect-ratio:1;border-radius:50%;filter:blur(42px);opacity:.38;animation:drift 12s ease-in-out infinite;pointer-events:none}

.cand{transition:box-shadow .3s}

/* ---------- landing ---------- */

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:center;max-width:1160px;margin:0 auto;padding:clamp(36px,6vw,80px) clamp(16px,4vw,56px) clamp(36px,5vw,64px)}
.hero h1{font-size:clamp(40px,6.2vw,78px);font-weight:900;line-height:1.06;letter-spacing:-.035em;isolation:isolate;margin-top:18px}

.lede{font-size:clamp(16px,1.5vw,19px);color:var(--muted);max-width:30ch;margin-top:20px}

.hero-copy>*{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.hero-copy>*:nth-child(2){animation-delay:.08s}.hero-copy>*:nth-child(3){animation-delay:.16s}.hero-copy>*:nth-child(4){animation-delay:.24s}.hero-copy>*:nth-child(5){animation-delay:.32s}
.stage3d{position:relative;height:clamp(460px,46vw,560px);perspective:1400px;--mx:0;--my:0}

.mw-body{flex:1;padding:16px 18px 10px;display:flex;flex-direction:column;gap:12px;min-height:0}
.mw-topic{font-weight:700;font-size:15px;line-height:1.4}
.mw-chat{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden;min-height:0}
.mw-chat .msg{max-width:88%}
.mw-chat .msg .bubble{font-size:13px;padding:8px 12px}

.ftabs{display:flex;flex-direction:column;gap:8px}
.ftab{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px 20px 22px;border-radius:16px;position:relative;overflow:hidden;color:var(--muted)}
.ftab:hover{background:var(--tile2)}
.ftab b{color:var(--ink);font-size:17px;display:flex;align-items:center;gap:10px}
.ftab p{font-size:14px;max-height:0;opacity:0;overflow:hidden;transition:max-height .45s,opacity .3s}
.ftab.on{background:var(--bg)}
.ftab.on p{max-height:90px;opacity:1}
.ftab .pbar{position:absolute;left:20px;right:20px;bottom:10px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;opacity:0}
.ftab.on .pbar{opacity:1}
.ftab.on .pbar i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:growx 6s linear both}
.fpanel{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,32px);min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.fpanel>.inner{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.fpanel>.inner>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.fpanel>.inner>*:nth-child(2){animation-delay:.08s}.fpanel>.inner>*:nth-child(3){animation-delay:.16s}.fpanel>.inner>*:nth-child(4){animation-delay:.24s}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;position:relative}
.steps4 .line{position:absolute;left:12.5%;right:12.5%;top:27px;height:2px;background:var(--line);overflow:hidden}
.steps4 .line i{display:block;height:100%;background:var(--ink);transform-origin:left;animation:growx 2.4s cubic-bezier(.4,0,.2,1) .4s both}
.step4{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.step4 .bub{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.step4:hover .bub{transform:translateY(-4px) scale(1.08)}
.step4 b{font-size:17px}
.step4 p{font-size:13.5px;color:var(--muted);max-width:22ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stats .tile{padding:22px}
.stats .tile .v{font-size:clamp(34px,4vw,48px)}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trust .card{padding:26px;display:flex;flex-direction:column;gap:12px}
.trust .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.trust .ico{width:44px;height:44px;border-radius:12px;background:var(--tile2);display:grid;place-items:center}
.trust b{font-size:17px}
.trust p{color:var(--muted);font-size:14.5px}
.price{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.price .card{padding:30px;display:flex;flex-direction:column;gap:16px}
.price h3{font-size:22px;font-weight:900}
.price ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px}
.price li{display:flex;gap:10px;align-items:flex-start}
.price li .ic{color:var(--ok);margin-top:4px}
.price .card.hl{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.faq{display:flex;flex-direction:column;gap:8px;max-width:820px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 20px;transition:border-color .2s}
.faq details[open]{border-color:var(--faint)}
.faq summary{cursor:pointer;list-style:none;padding:18px 0;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform .3s}
.faq details[open] summary .ic{transform:rotate(45deg)}
.faq details p{padding-bottom:18px;color:var(--muted);font-size:14.5px;animation:up .35s both}
.cta-band{border-radius:28px;background:var(--ink);color:var(--bg);padding:clamp(36px,6vw,72px);display:flex;flex-direction:column;align-items:flex-start;gap:18px;position:relative;overflow:hidden;isolation:isolate}
.cta-band h2{font-size:clamp(28px,4vw,48px);font-weight:900;line-height:1.15;max-width:15ch}
.cta-band p{opacity:.72;max-width:44ch}
.cta-band .deco{position:absolute;right:-90px;top:-90px;width:380px;height:380px;opacity:.16;z-index:-1;animation:spin 80s linear infinite}
.cta-band .btn.inv{background:var(--bg);color:var(--ink)}
.cta-band .btn.ghostinv{background:transparent;color:var(--bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bg) 35%,transparent)}
.lp-foot{padding:36px clamp(16px,4vw,56px) 48px;color:var(--faint);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1160px;margin:0 auto}
/* Content stays readable even if viewport observation or animation is unavailable.
   Do not bind opacity to a scroll timeline: Safari can leave it at the first frame. */
.lp .reveal{opacity:1;transform:none}
.lp .reveal.reveal-entered{animation:up .55s cubic-bezier(.2,.8,.2,1) backwards}
.lp .motion-paused,.lp .motion-paused *{animation-play-state:paused!important}
/* auth */
.auth-tabs{display:flex;gap:4px;padding:4px;background:var(--tile2);border-radius:12px}
.auth-tabs button{flex:1;height:36px;border-radius:9px;font-size:14px;color:var(--muted)}
.auth-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;color:var(--ink);font-family:var(--f-mono)}
.field input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.row-in{display:flex;gap:8px}.row-in input{flex:1;min-width:0}
.qr{width:180px;height:180px;margin:0 auto;display:grid;grid-template-columns:repeat(21,1fr);gap:1px;padding:10px;background:#FFFFFF;border-radius:14px;border:1px solid var(--line);position:relative}
.qr i{background:#111111;border-radius:1px}.qr i.o{background:transparent}
.qr .scan{position:absolute;left:8px;right:8px;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:scan 2.2s ease-in-out infinite}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);text-align:left}
.agree .cbox{flex:none;margin-top:1px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto}
  .rail .rail-schools,.rail .rail-foot,.brand small,.demo-clock{display:none}
  .nav{flex-direction:row}
  .nav a{padding:6px 10px;white-space:nowrap}
  .today-top,.two,.player{grid-template-columns:1fr}
  .path{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ia{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .f-top{flex-wrap:wrap}.f-title{flex-basis:100%}

  .irow{grid-template-columns:40px minmax(0,1fr)}
  .irow .act{grid-column:2}
  .room{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){.hero,.feat{grid-template-columns:1fr}.lp-links{display:none}.stats,.steps4{grid-template-columns:repeat(2,minmax(0,1fr))}.steps4{row-gap:28px}.steps4 .line{display:none}.trust{grid-template-columns:1fr}}
@media (max-width:560px){.price{grid-template-columns:1fr}.fcard.c,.fcard.b{display:none}.mockwin{inset:12px 0 70px 0}.lp-nav .right .ghost{display:none}.stage3d{height:440px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Admissions Academy: existing colours, cards and motion, with three lead schools. */
.academy-brand{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}

.academy-schools .school-card{gap:12px;min-width:0}
.academy-schools h3{font-size:22px}
.academy-schools p{font-size:14px;line-height:1.7}
.academy-schools .chip{align-self:flex-start;white-space:normal}
.academy-select{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

@media(max-width:700px){.academy-schools{grid-template-columns:minmax(0,1fr)}.academy-schools-in{padding-top:24px}.academy-focus{margin-top:20px}}

function seed(){return{

  records:[],

let S;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===2)return o}}catch(e){}return seed()}

/* ---------- derived ---------- */
const recsOf=itemId=>S.records.filter(r=>r.item===itemId);
const recsSchool=sid=>S.records.filter(r=>(ITEMS[r.item]||{}).school===sid);
function stageState(sid,i){ // 0 none,1 started,2 done
  const st=PATH[sid][i];const ids=st[2];
  if(i===0){const p=(S.progress['open-intro']||{}).done||[];const rem=ids.some(x=>S.reminders[x]);return p.length>=3?2:(p.length||rem)?1:0}
  if(i===1){const c=ids[0];const p=(S.progress[c]||{}).done||[];return p.length>=ITEMS[c].lessons.length?2:p.length?1:0}
  if(i===2){const n=ids.reduce((a,x)=>a+recsOf(x).length,0)+(ids.some(x=>S.sessions[x])?0.5:0);return n>=3?2:n>0?1:0}
  if(ids[0]==='room'){const n=S.records.filter(r=>r.room).length;return n>=2?2:n?1:0}
  return S.coach.some(c=>ids.includes(c.item))?1:0;
}
function weekCount(){const wk=dayKey(NOW)-6*864e5;return S.records.filter(r=>r.ts>=wk).length}
function schedule(){
  const out=[];
  Object.keys(ITEMS).forEach(id=>{if(isLiveNow(ITEMS[id])&&!S.reminders[id])out.push({ts:ITEMS[id].start,id,type:'live'})});
  Object.keys(S.reminders).forEach(id=>{if(S.reminders[id]&&ITEMS[id]&&ITEMS[id].start>=NOW-ITEMS[id].dur*6e4)out.push({ts:ITEMS[id].start,id,type:'live'})});
  Object.entries(S.bookings).forEach(([id,b])=>{if(b.st!=='report'&&b.st!=='done')out.push({ts:ITEMS[id].sessions[b.si][0],id,type:'mock'})});
  S.coach.forEach(c=>out.push({ts:c.ts,id:c.item,type:'coach',c}));
  S.schools.forEach(sid=>tasksOf(sid).forEach(([tid,t,k])=>{const dt=S.taskDate[tid];if(k==='plan'&&dt&&!S.taskDone[tid]){const [y,m,d]=dt.split('-').map(Number);out.push({ts:new Date(y,m-1,d,21).getTime(),type:'task',tid,t,sid})}}));
  return out.sort((a,b)=>a.ts-b.ts);
}
const isLiveNow=it=>it.kind==='live'&&NOW>=it.start&&NOW<it.start+it.dur*6e4;
function nextAction(){
  const paused=Object.keys(S.sessions).filter(k=>ITEMS[k]&&ITEMS[k].kind==='practice');
  if(paused.length){const id=paused[0],it=ITEMS[id],s=S.sessions[id];
    return{lbl:'继续练习',title:`继续${sc(it.school).short}${it.title}`,desc:`上次练到「${stageName(it,s)}」，已练 ${Math.max(1,Math.round(s.elapsed/60))} 分钟。可继续上次进度。`,btn:'继续练习',act:`data-a="open" data-id="${id}"`}}
  const soon=Object.entries(S.bookings).find(([id,b])=>b.st==='booked');
  if(soon){const it=ITEMS[soon[0]];return{lbl:'模考前',title:'检查面试设备',desc:`${it.title}在 ${fmtD(it.sessions[soon[1].si][0])} ${fmtT(it.sessions[soon[1].si][0])} 开始。请提前检查网络、麦克风和摄像头。`,btn:'现在检测',act:`data-a="mock-enter" data-id="${soon[0]}"`}}
  if(S.schools.includes('xjtlu')&&!S.records.some(r=>r.room))return{lbl:'今天推荐',title:'西浦小组面试模拟',desc:'按校测流程走一遍：自我介绍、读题准备、小组讨论、总结。可以约同学一起，也可以和 AI 组员练，全程开口说。',btn:'开始模拟',act:'data-a="go-setup" data-id="mock"'};
  const sid=S.schools.find(s=>PATH[s]);
  if(sid){const pr=PATH[sid][2][2].map(id=>[id,recsOf(id).length]).sort((a,b)=>a[1]-b[1])[0][0];const it=ITEMS[pr];
    return{lbl:'今天推荐',title:`${sc(sid).short} · ${it.title}`,desc:`${it.sub}。大约 ${it.min} 分钟，你在这一项练得最少。`,btn:'开始练习',act:`data-a="open" data-id="${pr}"`}}
  return{lbl:'先从这里开始',title:'看一节公开课',desc:'西浦、港中深、上悉怎么准备，3 讲，免费。',btn:'去看看',act:'data-a="watch" data-id="open-intro"'};
}
function stageName(it,s){
  if(it.mode==='group')return{brief:'读题',think:'独立思考',discuss:'小组讨论',summary:'总结'}[s.stage]||'读题';
  if(it.mode==='oral'){if(s.audioError)return'题目没播完';if(s.voice===false&&s.stage==='answer')return'打字作答';if(s.voice===false&&s.stage==='follow')return'打字回答追问';return{pick:'选题',prep:'准备',listen:'听题',answer:s.cap==='review'?'检查回答':'作答',think:'等待追问',flisten:'听追问',follow:s.cap==='review'?'检查追问回答':'回答追问',feedback:'看反馈'}[s.stage]||'选题'}
  if(it.mode==='mcq')return`第 ${(s.qi||0)+1} 题`;
  if(it.mode==='write')return'写作';return'';
}

let lastRoute=null;
function render(){
  const app=document.getElementById('app');
  if(!S.signedIn&&route().startsWith('join-')){lastRoute='join';stopLanding();app.innerHTML=viewJoin(route().slice(5));renderDock();return}
  const publicCourse=route()==='courses'||route().startsWith('course-');
  if((!S.signedIn&&!publicCourse)||route()==='home'){const first=lastRoute!=='landing';lastRoute='landing';if(first||!app.querySelector('.lp')){app.innerHTML=viewLanding();initLanding()}renderDock();return}
  stopLanding();
  if(!S.onboarded&&!publicCourse){lastRoute='onb';app.innerHTML=viewOnboard();renderDock();return}
  const r=route();let body;const anim=r!==lastRoute;lastRoute=r;
  if(r==='today')body=viewToday();
  else if(r==='practice')body=viewPractice();
  else if(window.QuestionLibrary?.handles(r))body=QuestionLibrary.view(r);
  else if(r==='courses')body=viewCourses();
  else if(r==='mocks')body=viewPractice();
  else if(r==='records')body=viewRecords();
  else if(r.startsWith('school-'))body=viewSchool(r.slice(7));
  else if(r.startsWith('course-'))body=viewCourse(r.slice(7));
  else if(r.startsWith('record-'))body=viewRecord(r.slice(7));
  else if(r==='mock-new')body=viewSetup();
  else if(r.startsWith('join-'))body=viewJoin(r.slice(5));
  else if(r==='weights')body=viewWeights();
  else body=viewToday();
  app.innerHTML=`<div class="shell">${nav()}<main class="main ${anim?'anim':''}"><div class="wrap">${body}</div></main></div>`;
  if(window.QuestionLibrary?.handles(r))QuestionLibrary.mount(app);
  if(anim)countUps(app);
  renderDock();
}

const BANK_SCHOOLS=['xjtlu','cuhksz','silc'];
function bankEntry(sid,records=false){
  if(sid&&!BANK_SCHOOLS.includes(sid))return '';

function feedback(r){
  const it=ITEMS[r.item];const good=[],imp=[];
  if(r.score){if(r.score[0]===r.score[1])good.push('全部答对。下一组可以试试限时。');else imp.push(`错了 ${r.score[1]-r.score[0]} 题。看一下解析，再做一遍同类题。`);good.push('每道题都看了解析。');return{good,improve:imp}}
  const mine=r.msgs?r.msgs.filter(m=>m.who==='me').map(m=>m.text):r.lines?r.lines.map(l=>l.a||''):[r.text||''];
  const all=mine.join(' ');const q=s=>`「${esc((s.match(/[^.!?。！？]+[.!?。！？]?/)||[s])[0].trim().slice(0,70))}」`;
  if(it.mode==='write'){const n=all.replace(/\s/g,'').length;n>=300?good.push(`写了 ${n} 字，篇幅够了。`):imp.push(`写了 ${n} 字，目标约 400 字。先把观点、理由、经历三段写完整。`);
    /因为|所以|例如|比如/.test(all)?good.push('用了「因为」「比如」这样的连接词，论证有层次。'):imp.push('加一个具体经历，用「比如」引出来。');return{good,improve:imp}}
  const words=all.trim().split(/\s+/).filter(Boolean).length;
  const find=re=>{for(const m of mine){const ss=m.match(/[^.!?。！？]+[.!?。！？]?/g)||[m];const hit=ss.find(x=>re.test(x));if(hit)return hit.trim()}return null};
  let s;
  if((s=find(/\bbecause\b|\bsince\b|\bso that\b/i)))good.push(`有理由：${q(s)}`);else imp.push('加一句理由，比如「I think …, because …」。');
  if((s=find(/for example|for instance|last (year|summer|month)|when i/i)))good.push(`有具体例子：${q(s)}`);else imp.push('加一个具体例子：时间、地点、你做了什么。');
  if(r.msgs){
    if((s=find(/\bagree\b|\bdisagree\b|your point|as .* said/i)))good.push(`回应了组员：${q(s)}`);else imp.push('先回应上一位同学，比如「I agree with Mia that …, but …」。');
    if((s=find(/what do you think|how about you|would you|\?/i)))good.push(`把话题交给了别人：${q(s)}`);else imp.push('邀请一位还没说话的组员，比如「Sam, what do you think?」');
    if(r.summary)good.push(`做了总结：${q(r.summary)}`);
  }
  if(words<30)imp.push(`这次说了 ${words} 个词，还可以展开。试着把观点、理由、例子都说出来。`);else good.push(`这次说了 ${words} 个词，内容比较完整。`);
  return{good,improve:imp};
}

}

function sheetAuth(mode,msg){S._auth={mode,tab:'phone',sent:0,phone:'',code:'',agree:false,msg:msg||''};drawAuth();setTimeout(()=>document.getElementById('au-phone')?.focus(),60)}
function qrCells(){let h=7,out='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(cx,cy)=>x>=cx&&x<cx+7&&y>=cy&&y<cy+7;let on;
  if(f(0,0)||f(14,0)||f(0,14)){const fx=x>=14?x-14:x,fy=y>=14?y-14:y;on=fx===0||fx===6||fy===0||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4)}else{h=(h*1103515245+12345)&0x7fffffff;on=(h>>16)%2===0}
  out+=`<i class="${on?'':'o'}"></i>`}return out}
function drawAuth(){
  const a=S._auth;const su=a.mode==='signup';
  sheet(`<div class="sheet-h"><div><div class="eyebrow">${su?'免费注册':'欢迎回来'}</div><h2>${su?'注册，开始备考':'登录综评备考'}</h2>${a.msg?`<p class="muted" style="font-size:13px;margin-top:4px">${esc(a.msg)}</p>`:''}</div><button class="xbtn" data-a="close-sheet" aria-label="关闭">${ic('x',16)}</button></div>
  <div class="auth-tabs" role="tablist"><button class="${a.tab==='phone'?'on':''}" data-a="auth-tab" data-id="phone">手机号</button><button class="${a.tab==='wx'?'on':''}" data-a="auth-tab" data-id="wx">微信扫码</button></div>
  ${a.tab==='phone'?`<label class="field">手机号<input id="au-phone" data-in="auphone" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="11 位手机号" value="${esc(a.phone)}"></label>
   <div class="field"><label for="au-code">验证码</label><div class="row-in"><input id="au-code" data-in="aucode" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="6 位数字" value="${esc(a.code)}"><button class="btn ghost" id="au-send" data-a="auth-send" style="height:46px" ${a.sent>0?'disabled':''}>${a.sent>0?a.sent+' 秒后重发':'获取验证码'}</button></div></div>`
  :`<div class="qr" role="img" aria-label="演示用二维码">${qrCells()}<span class="scan"></span></div><p class="muted" style="text-align:center;font-size:13px">用微信扫一扫${su?'注册':'登录'}</p>`}
  <div class="agree"><button class="cbox ${a.agree?'on':''}" data-a="auth-agree" aria-label="同意协议">${a.agree?ic('check',14):''}</button><span>我已阅读并同意《用户协议》和《隐私政策》（演示）</span></div>
  <button class="btn lg" data-a="auth-ok">${a.tab==='wx'?'演示：模拟扫码成功':su?'注册':'登录'}</button>
  <div class="demo-note">演示：不会发送短信，也不会保存手机号。输入任意 1 开头的 11 位号码和任意 6 位数字。${su?'注册后从选学校开始。':'登录后进入一个带示例数据的账号。'}</div>
  <p class="muted" style="font-size:13px;text-align:center">${su?'已有账号？':'还没有账号？'}<a href="#" data-a="auth-switch">${su?'去登录':'免费注册'}</a></p>`);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(!ACT[a])return;
  if(t.tagName==='A'&&a!=='close-focus-go'&&a!=='add-school'&&t.getAttribute('href')==='#')e.preventDefault();ACT[a](t.dataset,t,e)});
document.addEventListener('input',e=>{const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='auphone'){S._auth.phone=t.value.replace(/\D/g,'');return}
  if(k==='aucode'){S._auth.code=t.value.replace(/\D/g,'');return}
  if(k==='draft'){const w=document.querySelector('.composer .wave');if(w)w.dataset.level=t.value.trim()?.45:.12;const ss=sess();if(ss&&t.value.trim()&&ss.msgs&&ss.msgs.some(x=>(x.streaming||x.typing)&&!x.human)){ss.draft=t.value;interruptAI();return}}
  if(k==='onbq'){S._onb.q=t.value.trim();const p=t.selectionStart;render();const n=document.getElementById('onb-q');n.focus();n.setSelectionRange(p,p);return}
  if(k==='addq'){S._add.q=t.value.trim();const p=t.selectionStart;sheetSchools();const n=document.getElementById('add-q');n.focus();n.setSelectionRange(p,p);return}
  if(k==='taskDate'){S.taskDate[t.dataset.id]=t.value;save();return}
  if(k==='attach'){S._attach=t.value||null;return}
  if(k==='wnote'){const id=S.focus.slice(2);(S.progress[id]=S.progress[id]||{done:[]}).note=t.value;save();return}
  if(k==='ldraft'){sess().draft=t.value;return}
  const s=sess();if(!s)return;s[k]=t.value;
  if(k==='text'){const c=document.querySelector('[data-count]');if(c)c.textContent=t.value.replace(/\s/g,'').length+' 字'}
  save();});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.in==='taskDate')render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){const id=e.target.id;if(id==='g-in'){e.preventDefault();ACT['g-send']()}else if(id==='l-in'){e.preventDefault();ACT['l-send']()}else if(id==='mk-in'){e.preventDefault();ACT['mk-send']()}else if(id==='au-code'||id==='au-phone'){e.preventDefault();ACT['auth-ok']()}}
  if(e.key==='Escape'&&document.getElementById('sheet').innerHTML)closeSheet()});
window.addEventListener('hashchange',()=>{if(S.focus){if(S.focus==='room')rmCleanup();vbStop();Player.clear();clearTimers();S.focus=null;document.getElementById('focus').innerHTML=''}window.scrollTo(0,0);render()});

/* ---------- clock ---------- */
setInterval(()=>{
  const k=S.focus;if(!k)return;const s=S.sessions[k];if(!s)return;
  if(k.startsWith('w:'))return; // Progress comes from the media element, never a simulated timer.
  if(k.startsWith('l:')){s.elapsed++;if(s.elapsed%5===0&&s.i<LIVE_CHAT.length){s.chat.push(LIVE_CHAT[s.i++]);paintLiveChat()}return}
  if(k.startsWith('m:')){s.t++;
    if(s.stage==='check'&&s.t%1===0&&s.checks<4){s.checks++;renderFocus();return}
    if(s.stage==='wait'){s.cd--;if(s.t%2===0)renderFocus();else{const c=document.querySelector('[data-cd]');if(c)c.textContent=mmss(s.cd)}return}
    if(s.stage==='read'||s.stage==='discuss'){s.cd--;if(s.cd<=0){s.stage==='read'?mockDiscuss():endMock();return}const c=document.querySelector('[data-cd]');if(c)c.textContent=mmss(s.cd)}
    return}
  s.elapsed++;const tm=document.querySelector('[data-timer]');if(tm)tm.textContent=mmss(s.elapsed);
  if((s.stage==='think'||s.stage==='prep')&&s.cd!=null){s.cd--;const c=document.querySelector('[data-cd]');if(c)c.textContent=mmss(s.cd);const rv=document.querySelector('[data-cdr]');if(rv)rv.setAttribute('stroke-dashoffset',(CDC*(1-Math.max(0,s.cd)/+rv.dataset.cdr)).toFixed(1));
    if(s.cd<=0){s.cd=null;if(s.stage==='think')startDiscuss();else{s.stage='answer';renderFocus()}}}
  if(s.elapsed%10===0)save();
},1000);

addEventListener('scroll',()=>{const n=document.querySelector('.lp-nav');if(n)n.classList.toggle('scrolled',scrollY>10)},{passive:true});
S.focus=null;
document.addEventListener('DOMContentLoaded',()=>render());
