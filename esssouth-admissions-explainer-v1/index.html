<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三校考情与流程解析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: school picker → one "episode player" per school (dark stage + live subtitle + chapter rail), with a score calculator under the 成绩 chapter.
   esssouth site tokens; each school keeps its site colour (西浦 teal, 港中深 rose, 上悉 violet) as the stage accent. */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --tile:#E8E8E4; --tile2:#F7F7F4; --ink:#1A1A1C; --muted:#696970; --faint:#9B9BA0; --line:#E1E1DC;
  --accent:#DD5636; --accent-ink:#FFFFFF; --accent-soft:#FBE8E2; --ok:#2E8656; --ok-soft:#E3F2E9; --warn:#A86E14; --warn-soft:#F8EEDB;
  --stage:#1C2230; --stage2:#262F42; --stage-ink:#F3F5F9; --stage-muted:#A9B2C3;
  --xj:#2B8494; --cu:#B44E68; --si:#786193;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.07);
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1C1C1F; --tile:#26262A; --tile2:#202023; --ink:#F1F1EF; --muted:#A3A3A9; --faint:#6F6F75; --line:#2E2E33;
  --accent:#EC6A4A; --accent-soft:#3B231D; --ok:#5CBF86; --ok-soft:#18301F; --warn:#E0A84A; --warn-soft:#352A16;
  --stage:#10141D; --stage2:#1B2232; --xj:#55B2C2; --cu:#DA7A93; --si:#A08BC0; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1C1C1F; --tile:#26262A; --tile2:#202023; --ink:#F1F1EF; --muted:#A3A3A9; --faint:#6F6F75; --line:#2E2E33;
  --accent:#EC6A4A; --accent-soft:#3B231D; --ok:#5CBF86; --ok-soft:#18301F; --warn:#E0A84A; --warn-soft:#352A16;
  --stage:#10141D; --stage2:#1B2232; --xj:#55B2C2; --cu:#DA7A93; --si:#A08BC0; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1120px;margin:0 auto;height:56px;display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;text-decoration:none;white-space:nowrap}
.brand i{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);font-style:normal;font-size:14px}
.top nav{display:flex;gap:4px;margin-left:auto;flex-wrap:nowrap;overflow-x:auto}
.top nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.top nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{max-width:1120px;margin:0 auto;padding-block:8px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:14.5px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{min-height:34px;padding:0 13px;font-size:13px}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--tile);color:var(--muted);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px;min-width:0}
.note{font-size:12.5px;color:var(--muted)}

/* picker */
.pick-h{display:grid;gap:8px;padding:18px 0 4px}
.pick-h h1{font-size:clamp(28px,4.6vw,44px);font-weight:900;line-height:1.15}
.pick-h p{color:var(--muted);max-width:44em}
.schools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.school{position:relative;overflow:hidden;display:grid;gap:10px;align-content:start;text-decoration:none;color:var(--stage-ink);background:var(--stage);border-radius:22px;padding:22px;min-height:250px;transition:transform .2s var(--ease)}
.school:hover{transform:translateY(-3px)}
.school .orb{position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:var(--c);opacity:.35;animation:orb 7s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(-30px,30px) scale(1.15)}}
.school .k{font-size:12.5px;color:var(--stage-muted);position:relative}
.school h2{font-size:24px;font-weight:900;position:relative}
.school ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px;color:var(--stage-muted);position:relative}
.school ul li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:2px}
.school .go{margin-top:auto;position:relative;font-weight:700;color:var(--stage-ink)}
.eps{display:flex;gap:6px;flex-wrap:wrap;position:relative}
.eps span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--stage-muted)}

/* player */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:clamp(22px,3.2vw,30px);font-weight:900}
.prov{display:inline-flex;background:var(--tile);border-radius:999px;padding:3px}
.prov button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-size:14px;color:var(--muted)}
.prov button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.player{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
.screen{display:grid;gap:0;border-radius:22px;overflow:hidden;background:var(--stage);box-shadow:0 24px 50px rgba(28,34,48,.22)}
.stage{position:relative;color:var(--stage-ink);aspect-ratio:16/10;padding:26px 30px 40px;display:grid;grid-template-rows:auto 1fr;gap:14px;overflow:hidden}
.stage::before{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent),transparent 65%);opacity:.6;pointer-events:none;animation:orb 9s ease-in-out infinite alternate}
.s-head{position:relative;display:grid;gap:4px}
.s-kick{font-size:12.5px;color:var(--stage-muted);letter-spacing:.04em}
.s-title{font-size:clamp(20px,2.6vw,28px);font-weight:900;animation:up .5s var(--ease) both}
.s-body{position:relative;min-height:0;display:grid;align-content:center}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
[data-at]{transition:opacity .45s var(--ease),transform .45s var(--ease)}
[data-at].wait{opacity:0;transform:translateY(12px) scale(.98)}
.sub{background:#0E121B;color:#F3F5F9;padding:14px 22px;min-height:76px;display:flex;align-items:center;font-size:clamp(15px,1.7vw,18px);line-height:1.55}
.sub .caret{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ctrl{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0E121B;border-top:1px solid #222A3A;color:var(--stage-muted)}
.ctrl button{border:0;background:transparent;color:var(--stage-ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.ctrl button:hover{background:#222A3A}
.ctrl button.play{background:var(--stage-ink);color:var(--stage)}
.ctrl svg{width:18px;height:18px}
.bar{flex:1;height:6px;border-radius:3px;background:#2A3346;position:relative;overflow:hidden;cursor:pointer}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:3px}
.ctrl select{background:#1A2130;border:1px solid #2A3346;border-radius:8px;color:var(--stage-ink);padding:4px 6px;font-size:12.5px}
.ctrl .t{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.rail{display:grid;gap:6px}
.ep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px}
.ep .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--tile2);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ep b{font-size:14.5px;display:block}
.ep span.s{font-size:12px;color:var(--muted)}
.ep[aria-current="true"]{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.ep[aria-current="true"] .n{background:var(--c);color:#FFFFFF}
.ep .prog{grid-column:1/-1;height:3px;border-radius:2px;background:var(--tile);overflow:hidden}
.ep .prog i{display:block;height:100%;background:var(--c)}

/* scene pieces */
.big{font-size:clamp(28px,4.4vw,52px);font-weight:900;line-height:1.15}
.big em{font-style:normal;color:var(--c)}
.tchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tchips span{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.sc{background:var(--stage2);border-radius:14px;padding:12px 14px;display:grid;gap:4px;border-left:4px solid var(--c)}
.sc b{font-size:15.5px}
.sc span{font-size:13px;color:var(--stage-muted)}
.sc.warn{border-left-color:#E0A84A}
.sc.ok{border-left-color:#5CBF86}
.steps{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.steps::before{content:"";position:absolute;left:12px;right:12px;top:15px;height:2px;background:#2E3850}
.st{display:grid;gap:6px;justify-items:start;position:relative}
.st .dot{width:32px;height:32px;border-radius:50%;background:var(--stage2);border:2px solid var(--c);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.st:not(.wait) .dot{background:var(--c);color:#FFFFFF}
.st b{font-size:14px;line-height:1.35}
.st span{font-size:12.5px;color:var(--stage-muted);line-height:1.4}
.st .date{font-family:var(--f-mono);font-size:12px;color:var(--stage-ink);background:rgba(255,255,255,.08);border-radius:6px;padding:1px 6px}
.gates{display:grid;gap:10px}
.gate{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--stage2);border-radius:14px;padding:12px 14px}
.gate .lk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.gate:not(.wait) .lk{background:#2E8656;animation:pop .5s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}
.gate .lk svg{width:22px;height:22px}
.gate b{font-size:15.5px}
.gate span{font-size:13px;color:var(--stage-muted)}
.formula{display:grid;gap:14px}
.fbar{display:flex;height:58px;border-radius:14px;overflow:hidden;background:#2A3346}
.fseg{display:grid;place-items:center;font-weight:900;font-size:clamp(15px,2vw,20px);color:#FFFFFF;transition:flex-basis .9s var(--ease);flex-basis:0;overflow:hidden;white-space:nowrap}
.fleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fleg div{display:grid;gap:2px;font-size:13px;color:var(--stage-muted)}
.fleg b{font-size:14.5px;color:var(--stage-ink);display:flex;align-items:center;gap:6px}
.fleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ftotal{font-family:var(--f-mono);font-size:13px;color:var(--stage-muted)}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--stage-muted);font-weight:500;padding:0 10px}
.tbl td{background:var(--stage2);padding:9px 10px;vertical-align:top}
.tbl td:first-child{border-radius:10px 0 0 10px;font-weight:700;white-space:nowrap}
.tbl td:last-child{border-radius:0 10px 10px 0;color:var(--stage-muted)}
.qa{display:grid;gap:10px}
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;max-width:620px}
.q .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);font-size:12px;font-weight:700}
.q .b{background:var(--stage2);border-radius:14px 14px 14px 4px;padding:9px 13px;font-size:15px}
.q .b small{display:block;font-size:11.5px;color:var(--stage-muted)}
.checks{display:grid;gap:8px}
.ck{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;background:var(--stage2);border-radius:12px;padding:10px 12px}
.ck .bx{width:24px;height:24px;border-radius:7px;border:2px solid #4A5570;display:grid;place-items:center}
.ck:not(.wait) .bx{background:#2E8656;border-color:#2E8656}
.ck .bx svg{width:14px;height:14px;opacity:0}
.ck:not(.wait) .bx svg{opacity:1}
.ck b{font-size:14.5px}
.ck span{display:block;font-size:12.5px;color:var(--stage-muted)}
.cta{display:grid;gap:14px;justify-items:start}
.cta .tchips span{background:color-mix(in srgb,var(--c) 30%,transparent)}
.srcline{font-size:11.5px;color:var(--stage-muted);position:absolute;left:30px;bottom:10px}

/* below the player */
.calc{display:grid;gap:12px}
.calc .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.calc label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.calc input,.calc select{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 12px;font-size:16px;min-height:44px}
.calc .out{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.calc .out .v{font-family:var(--f-mono);font-size:34px;font-weight:500;color:var(--c)}
.calc .parts{display:flex;gap:8px;flex-wrap:wrap}
.calc .parts span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--tile2);border:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.facts div{display:grid;gap:2px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.facts b{font-size:15px}
.facts span{font-size:12.5px;color:var(--muted)}
.disc{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:4px}
.disc a{color:var(--muted)}

@media (max-width:900px){.player{grid-template-columns:minmax(0,1fr)}.rail{grid-template-columns:repeat(2,minmax(0,1fr))}.schools{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .stage{aspect-ratio:auto;min-height:480px;padding:18px}
  .steps{grid-template-columns:minmax(0,1fr);gap:10px}.steps::before{left:15px;right:auto;top:10px;bottom:10px;width:2px;height:auto}
  .st{grid-template-columns:32px minmax(0,1fr);column-gap:10px;align-items:start}.st .dot{grid-row:span 3}
  .tbl td:first-child{white-space:normal}
  .rail{grid-template-columns:minmax(0,1fr)}
  .srcline{left:18px;right:18px}
  .brand span{display:none}
  .stage{padding-bottom:52px}
  .sub{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#home"><i>综</i><span>考情与流程解析</span></a>
  <nav aria-label="学校" id="nav"></nav>
</div></header>
<main id="main"></main>

<script id="explainer-data">
/* Content for every episode. Facts come only from the schools' 2026 brochures (see SOURCES); `p` picks the
   province version. Each scene: chapter, type, kicker, title, say[] (the transcript lines = subtitles),
   plus the visual's data; `at` = the subtitle line on which that element appears. */
const SOURCES = {
  xjtlu: { js: ['西交利物浦大学 2026 年在江苏省综合评价招生简章（官网 PDF）', 'https://www.xjtlu.edu.cn/wp-content/uploads/2026/04/bf2775ec98e5c8b14e47a37c5218f575.pdf'],
           gd: ['西交利物浦大学 2026 年在广东省综合评价招生简章（官网 PDF）', 'https://www.xjtlu.edu.cn/wp-content/uploads/2026/04/6e0b4d1bfbed86958729f625e16db083.pdf'] },
  cuhksz: { js: ['香港中文大学（深圳）2026 年江苏省综合评价招生简章（官网，2026-04-30 发布）', 'https://admissions.cuhk.edu.cn/article/2380'],
            gd: ['香港中文大学（深圳）2026 年广东省综合评价招生简章（官网，2026-04-30 发布）', 'https://admissions.cuhk.edu.cn/article/2377'] },
  silc: { all: ['上海大学悉尼工商学院 2026 招生简章（官网 PDF）', 'https://silc.shu.edu.cn/2026zhaosheng.pdf'] },
};
const CHAPTERS = [['what', '考什么'], ['apply', '怎么报名'], ['score', '成绩怎么算'], ['interview', '面试会遇到什么'], ['prepare', '考前准备什么'], ['train', '接下来怎么练']];

const SCHOOLS = {
  xjtlu: {
    short: '西浦', name: '西交利物浦大学', kind: '综合评价招生', c: 'var(--xj)', provinces: { js: '江苏', gd: '广东' },
    blurb: ['高考 + 英文面试（广东另含学考 5%）', '江苏 4 月 20 日–5 月 10 日报名', '广东 4 月 20 日–5 月 20 日报名'],
    facts: p => [['综合成绩', p === 'js' ? '高考 65% + 面试 35%' : '高考 65% + 面试 30% + 学考 5%'], ['报名时间（2026）', p === 'js' ? '4 月 20 日–5 月 10 日 12:00' : '4 月 20 日–5 月 20 日 12:00'], ['面试（2026，拟定）', '6 月 16 日–18 日'], ['高考门槛', '投档成绩不低于特殊类型招生控制线'], ['报名费', '60 元'], ['学费', '2026 年待定（2025 年 93,000 元/学年）']],
    scenes: p => [

      { ch: 'train', type: 'cta', big: '先过本科线，<em>再把英语练开口。</em>', chips: ['esssouth 是独立的练习工具', '与学校无官方合作关系', '以学院官方信息为准'],
        say: ['总结一下：上悉 4+0，高考过本科线是前提，学院笔试和面试决定能否录取。', 'esssouth 是独立的练习工具，与学校没有官方合作关系。所有招生信息，请以学院官网发布的为准。'] },
    ],
  },
};
</script>

<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const IC = {
    play: '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>', pause: '<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/>',
    prev: '<path d="M6 5v14M19 5L9 12l10 7z"/>', next: '<path d="M18 5v14M5 5l10 7-10 7z"/>', lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', check: '<path d="M5 12l5 5 9-10"/>', replay: '<path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/>',
  };
  const svg = (n, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
  const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- state ---------- */
  let school = null, prov = 'js', scenes = [], si = 0, li = 0, playing = false, rate = 1, timer = 0, typeT = 0, lineStart = 0, lineDur = 0, elapsedBefore = 0;
  try { const r = Number(localStorage.getItem('esssouth-explainer-rate')); if ([1, 1.25, 1.5].includes(r)) rate = r; } catch (_) {}
  const durOf = t => Math.max(2.6, t.replace(/\s/g, '').length / 4.6) * 1000;
  const sceneDur = s => s.say.reduce((a, t) => a + durOf(t), 0);

  /* ---------- scene renderers ---------- */
  const W = at => `data-at="${at || 0}"`;
  function body(s) {
    switch (s.type) {
      case 'title': return `<div><div class="big">${s.big}</div><div class="tchips">${s.chips.map((c, i) => `<span ${W(Math.min(i, 1))}>${esc(c)}</span>`).join('')}</div></div>`;
      case 'cta': return `<div class="cta"><div class="big">${s.big}</div><div class="tchips">${s.chips.map(c => `<span ${W(1)}>${esc(c)}</span>`).join('')}</div></div>`;
      case 'cards': return `<div class="cards">${s.items.map(([t, d, at, tone]) => `<div class="sc ${tone || ''}" ${W(at)}><b>${esc(t)}</b>${d ? `<span>${esc(d)}</span>` : ''}</div>`).join('')}</div>`;
      case 'gates': return `<div class="gates">${s.items.map(([t, d, at, tone]) => `<div class="gate" ${W(at)}><span class="lk">${svg(tone === 'warn' ? 'lock' : 'check')}</span><span><b>${esc(t)}</b><span style="display:block">${esc(d)}</span></span></div>`).join('')}</div>`;
      case 'steps': return `<div class="steps" style="--n:${s.items.length}">${s.items.map(([t, d, x, at], i) => `<div class="st" ${W(at)}><span class="dot">${i + 1}</span><b>${esc(t)}</b>${d ? `<span class="date">${esc(d)}</span>` : ''}${x ? `<span>${esc(x)}</span>` : ''}</div>`).join('')}</div>`;
      case 'checks': return `<div class="checks">${s.items.map(([t, d, at]) => `<div class="ck" ${W(at)}><span class="bx">${svg('check', 3)}</span><span><b>${esc(t)}</b>${d ? `<span>${esc(d)}</span>` : ''}</span></div>`).join('')}</div>`;
      case 'qa': return `<div class="qa">${s.items.map(([q, tag, at]) => `<div class="q" ${W(at)}><span class="av">Q</span><span class="b" lang="en"><small>${esc(tag)}</small>${esc(q)}</span></div>`).join('')}</div>`;
      case 'table': return `<table class="tbl"><thead><tr>${s.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r => `<tr ${W(r[3])}><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>`;
      case 'formula': return `<div class="formula"><div class="fbar">${s.parts.map(([n, pct, , col, at]) => `<div class="fseg" data-pct="${pct}" ${W(at)} style="background:${col}">${pct}%</div>`).join('')}</div>
        <div class="fleg">${s.parts.map(([n, pct, d, col, at]) => `<div ${W(at)}><b><i style="background:${col}"></i>${esc(n)} · ${pct}%</b><span>${esc(d)}</span></div>`).join('')}</div><span class="ftotal" ${W(s.parts[s.parts.length - 1][4])}>合计 100%</span></div>`;
    }
    return '';
  }

  function drawScene() {
    const s = scenes[si], st = $('#stage'); if (!st) return;
    const chName = CHAPTERS.find(c => c[0] === s.ch)[1], chNo = CHAPTERS.findIndex(c => c[0] === s.ch) + 1;
    st.innerHTML = `<div class="s-head"><span class="s-kick">第 ${chNo} 集 · ${esc(chName)}${s.kicker && s.type !== 'title' ? ' · ' + esc(s.kicker) : ''}</span>${s.type === 'title' ? `<span class="s-kick" style="color:var(--stage-ink)">${esc(s.kicker)}</span>` : s.type === 'cta' ? '' : `<h2 class="s-title">${esc(s.title)}</h2>`}</div>
      <div class="s-body">${body(s)}</div><span class="srcline">依据：${esc(srcName())}</span>`;
    reveal();
    drawRail();
  }
  function reveal() {
    document.querySelectorAll('#stage [data-at]').forEach(el => {
      const show = Number(el.dataset.at) <= li;
      el.classList.toggle('wait', !show);
      if (el.classList.contains('fseg')) el.style.flexBasis = show ? el.dataset.pct + '%' : '0%';
    });
  }
  function typeLine(instant) {
    clearInterval(typeT);
    const t = scenes[si].say[li], el = $('#sub'); if (!el) return;
    if (instant || REDUCE || !playing) { el.textContent = t; return; }
    let i = 0; const step = Math.max(1, Math.round(t.length / 40));
    el.innerHTML = '<span class="caret"></span>';
    typeT = setInterval(() => { i = Math.min(t.length, i + step); el.innerHTML = esc(t.slice(0, i)) + (i < t.length ? '<span class="caret"></span>' : ''); if (i >= t.length) clearInterval(typeT); }, 28 / rate);
  }

  /* ---------- playback ---------- */
  function schedule() {
    clearTimeout(timer); if (!playing) return;
    lineDur = durOf(scenes[si].say[li]) / rate; lineStart = performance.now();
    timer = setTimeout(advance, lineDur);
  }
  function advance() {
    const s = scenes[si];
    if (li < s.say.length - 1) { li++; reveal(); typeLine(); schedule(); return; }
    if (si < scenes.length - 1) { si++; li = 0; drawScene(); typeLine(); schedule(); return; }
    playing = false; drawCtrl(); $('#sub').textContent = '本校解析播放完毕。可以从右侧任选一集重看。';
  }
  function go(nsi, nli = 0) { si = Math.max(0, Math.min(scenes.length - 1, nsi)); li = nli; drawScene(); typeLine(true); schedule(); drawCtrl(); drawBelow(); }
  function toggle() { playing = !playing; if (playing) { typeLine(); schedule(); } else { clearTimeout(timer); clearInterval(typeT); typeLine(true); } drawCtrl(); }
  function totalBefore() { let ms = 0; for (let i = 0; i < si; i++) ms += sceneDur(scenes[i]); for (let j = 0; j < li; j++) ms += durOf(scenes[si].say[j]); return ms; }
  const total = () => scenes.reduce((a, s) => a + sceneDur(s), 0);
  const fmt = ms => { const s = Math.round(ms / 1000 / rate); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  function drawCtrl() {
    const c = $('#ctrl'); if (!c) return;
    c.querySelector('.play').innerHTML = svg(playing ? 'pause' : 'play');
    c.querySelector('.play').setAttribute('aria-label', playing ? '暂停' : '播放');
    tick();
  }
  function tick() {
    const b = $('#bar i'), t = $('#ctrl .t'); if (!b) return;
    let cur = totalBefore(); if (playing) cur += Math.min(lineDur, performance.now() - lineStart) * rate;
    b.style.width = (cur / total() * 100) + '%'; t.textContent = `${fmt(cur)} / ${fmt(total())}`;
    drawRailProg();
  }
  setInterval(() => { if (playing) tick(); }, 250);

  function drawRail() {
    const r = $('#rail'); if (!r) return;
    const cur = scenes[si].ch;
    r.innerHTML = CHAPTERS.map(([id, n], i) => { const first = scenes.findIndex(s => s.ch === id), cnt = scenes.filter(s => s.ch === id).length, ms = scenes.filter(s => s.ch === id).reduce((a, s) => a + sceneDur(s), 0);
      return `<button type="button" class="ep" data-a="ep" data-i="${first}" aria-current="${cur === id}"><span class="n">${i + 1}</span><span><b>${esc(n)}</b><span class="s">${cnt} 个画面 · ${fmt(ms)}</span></span><span class="prog"><i data-ch="${id}"></i></span></button>`; }).join('');
    drawRailProg();
  }
  function drawRailProg() {
    CHAPTERS.forEach(([id]) => { const el = document.querySelector(`#rail i[data-ch="${id}"]`); if (!el) return;
      const idx = scenes.map((s, i) => [s, i]).filter(([s]) => s.ch === id).map(([, i]) => i);
      const done = idx.filter(i => i < si).length + (idx.includes(si) ? (li + 1) / scenes[si].say.length : 0);
      el.style.width = (done / idx.length * 100) + '%'; });
  }

  /* ---------- calculators (score chapter) ---------- */
  function calcHTML() {
    if (school === 'xjtlu') return `<div class="card calc"><b>算一算：西浦综合成绩（${prov === 'js' ? '江苏' : '广东'}）</b>
      <div class="fields"><label for="c-g">高考投档成绩（满分 750）<input id="c-g" type="number" min="0" max="750" value="600" inputmode="numeric"></label><label for="c-i">面试成绩（百分制）<input id="c-i" type="number" min="0" max="100" value="80" inputmode="numeric"></label>
      ${prov === 'gd' ? `<label for="c-b">学考 6 门里有几个 B<select id="c-b">${[0, 1, 2, 3, 4, 5, 6].map(n => `<option value="${n}">${n} 个 B（${n ? '其余 A' : '全 A'}）</option>`).join('')}</select></label>` : ''}</div>
      <div class="out"><span class="v" id="c-out">—</span><span class="muted">/ 100</span></div><div class="parts" id="c-parts"></div>
      <p class="note">示意：按高考满分 750 分折算成百分制。简章只写「折算成百分制」，实际折算以学校为准。这个计算只帮助理解权重，不预测录取结果。</p></div>`;
    if (school === 'cuhksz') return `<div class="card calc"><b>算一算：港中深综合评价成绩（${prov === 'js' ? '江苏' : '广东'}）</b>
      <div class="fields"><label for="c-g">高考成绩（含政策性加分，满分 750）<input id="c-g" type="number" min="0" max="750" value="600" inputmode="numeric"></label><label for="c-i">入学测试成绩（满分 225）<input id="c-i" type="number" min="0" max="225" value="160" inputmode="numeric"></label>
      ${prov === 'gd' ? `<label for="c-b">3 门选考对应的合格性等级<select id="c-b">${[['AAA', 75], ['AAB', 74.5], ['AAC', 74], ['ABB', 74], ['ABC', 73.5], ['BBB', 73.5]].map(([g, v]) => `<option value="${v}">${g}（${v} 分）</option>`).join('')}</select></label>` : `<label>学考合格性考试<span style="font-size:15px;color:var(--ink);padding-top:10px">全部合格计 75 分</span></label>`}</div>
      <div class="out"><span class="v" id="c-out">—</span><span class="muted">/ 750</span></div><div class="parts" id="c-parts"></div>
      <p class="note">公式来自简章：高考成绩 × 60% + 入学测试实际成绩 + 学考成绩。这个计算只帮助理解权重，不预测录取结果。</p></div>`;
    return `<div class="card"><b>上悉 4+0 没有公开的计分公式</b><p class="small muted">简章只写了：笔试划面试资格线 → 面试成绩计入总分 → 面试后公布录取分数线。各部分权重没有公布，所以这里不提供计算器。</p></div>`;
  }
  function calc() {
    const g = +($('#c-g')?.value || 0), i = +($('#c-i')?.value || 0), out = $('#c-out'), parts = $('#c-parts'); if (!out) return;
    if (school === 'xjtlu') {
      const gg = Math.min(750, Math.max(0, g)) / 750 * 100 * .65, ii = Math.min(100, Math.max(0, i)) * (prov === 'js' ? .35 : .30);
      const bb = prov === 'gd' ? (100 - 2.5 * +$('#c-b').value) * .05 : 0;
      out.textContent = (gg + ii + bb).toFixed(2);
      parts.innerHTML = `<span>高考 ${gg.toFixed(2)}</span><span>面试 ${ii.toFixed(2)}</span>${prov === 'gd' ? `<span>学考 ${bb.toFixed(2)}</span>` : ''}`;
    } else if (school === 'cuhksz') {
      const gg = Math.min(750, Math.max(0, g)) * .6, ii = Math.min(225, Math.max(0, i)), xk = prov === 'gd' ? +$('#c-b').value : 75;
      out.textContent = (gg + ii + xk).toFixed(1);
      parts.innerHTML = `<span>高考 ${gg.toFixed(1)}</span><span>入学测试 ${ii}</span><span>学考 ${xk}</span>`;
    }
  }

  function drawBelow() {
    const b = $('#below'); if (!b) return;
    const S = SCHOOLS[school];
    b.innerHTML = `${scenes[si].ch === 'score' ? calcHTML() : ''}
      <div class="card"><b>${esc(S.short)}${S.provinces ? ' · ' + S.provinces[prov] : ''} · 要点速记（2026 年简章）</b><div class="facts">${S.facts(prov).map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div></div>
      <div class="disc"><span>依据：<a href="${esc(src()[1])}">${esc(src()[0])}</a>。esssouth 根据学校公开简章整理，与学校无官方合作关系；招生政策每年可能调整，一切以学校官方发布为准。</span><span>练习题均为 esssouth 原创，不是真题。计算器只用于理解权重，不预测录取结果。</span></div>`;
    calc();
  }
  const src = () => { const s = SOURCES[school]; return s.all || s[prov]; };
  const srcName = () => src()[0];

  /* ---------- views ---------- */
  function vHome() {
    return `<section class="view"><div class="pick-h"><span class="small muted">2026 年官方简章 · 动画解析 · 逐字稿字幕</span><h1>选一所学校，<br>几分钟看懂考什么、怎么报、怎么算。</h1>
      <p>每所学校 6 集：考什么、怎么报名、成绩怎么算、面试会遇到什么、考前准备什么、接下来怎么练。西浦和港中深分江苏、广东两个版本。</p></div>
      <div class="schools">${Object.entries(SCHOOLS).map(([id, S]) => `<a class="school" href="#${id}" style="--c:${S.c}"><span class="orb" aria-hidden="true"></span><span class="k">${esc(S.kind)}${S.provinces ? ' · 江苏 / 广东' : ' · 全国'}</span><h2>${esc(S.short)}</h2>
        <ul>${S.blurb.map(x => `<li>${esc(x)}</li>`).join('')}</ul><span class="eps">${CHAPTERS.map(c => `<span>${c[1]}</span>`).join('')}</span><span class="go">开始播放 ›</span></a>`).join('')}</div>
      <div class="disc"><span>内容依据各校 2026 年官方招生简章（西浦官网 PDF、港中深招生官网、上海大学悉尼工商学院官网 PDF），2027 年简章发布后更新。</span><span>esssouth 是独立的练习工具，与上述学校无官方合作关系。西交利物浦大学在简章中声明不组织、也未授权任何机构开展综评考前培训。一切以学校官方发布为准。</span></div></section>`;
  }
  function vSchool(id) {
    const S = SCHOOLS[id];
    return `<section class="view" style="--c:${S.c}"><div class="ph"><div style="display:grid;gap:4px"><span class="small muted">${esc(S.name)} · ${esc(S.kind)}</span><h1>${esc(S.short)} · 考情与流程解析</h1></div>
      ${S.provinces ? `<div class="prov" role="group" aria-label="考生省份">${Object.entries(S.provinces).map(([k, v]) => `<button type="button" data-a="prov" data-v="${k}" aria-pressed="${prov === k}">${v}考生</button>`).join('')}</div>` : '<span class="chip">全国考生</span>'}</div>
      <div class="player"><div class="screen"><div class="stage" id="stage" aria-live="off"></div><div class="sub" id="sub" aria-live="polite"></div>
        <div class="ctrl" id="ctrl"><button type="button" data-a="prev" aria-label="上一个画面">${svg('prev')}</button><button type="button" class="play" data-a="toggle"></button><button type="button" data-a="next" aria-label="下一个画面">${svg('next')}</button>
          <div class="bar" id="bar" data-a="seek" role="slider" aria-label="播放进度" tabindex="0"><i></i></div><span class="t"></span>
          <select id="rate" aria-label="播放速度">${[1, 1.25, 1.5].map(r => `<option value="${r}" ${r === rate ? 'selected' : ''}>${r}×</option>`).join('')}</select></div></div>
        <div class="rail" id="rail"></div></div>
      <div class="view" id="below"></div></section>`;
  }

  /* ---------- router ---------- */
  function route() { const h = location.hash.slice(1); return SCHOOLS[h] ? h : 'home'; }
  function render() {
    clearTimeout(timer); clearInterval(typeT); playing = false;
    const r = route();
    $('#nav').innerHTML = [['home', '全部学校'], ...Object.entries(SCHOOLS).map(([k, S]) => [k, S.short])].map(([k, t]) => `<a href="#${k}" ${r === k ? 'aria-current="page"' : ''}>${t}</a>`).join('');
    if (r === 'home') { school = null; $('#main').innerHTML = vHome(); return; }
    school = r; if (!SCHOOLS[r].provinces) prov = 'all'; else if (!SCHOOLS[r].provinces[prov]) prov = 'js';
    scenes = SCHOOLS[r].scenes(prov); si = 0; li = 0;
    $('#main').innerHTML = vSchool(r);
    drawScene(); typeLine(true); drawCtrl(); drawBelow();
    if (!REDUCE) { playing = true; typeLine(); schedule(); drawCtrl(); }
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a;
    if (a === 'toggle') toggle();
    if (a === 'next') { const s = scenes[si]; if (li < s.say.length - 1) go(si, s.say.length - 1); else go(si + 1); }
    if (a === 'prev') go(li > 0 ? si : si - 1);
    if (a === 'ep') { go(+el.dataset.i); }
    if (a === 'prov') { prov = el.dataset.v; const keepCh = scenes[si].ch; render(); go(Math.max(0, scenes.findIndex(s => s.ch === keepCh))); }
    if (a === 'seek') { const r = el.getBoundingClientRect(), target = (e.clientX - r.left) / r.width * total(); let acc = 0;
      for (let i = 0; i < scenes.length; i++) { for (let j = 0; j < scenes[i].say.length; j++) { const d = durOf(scenes[i].say[j]); if (acc + d > target) { go(i, j); reveal(); return; } acc += d; } } }
  });
  document.addEventListener('input', e => { if (['c-g', 'c-i', 'c-b'].includes(e.target.id)) calc(); });
  document.addEventListener('change', e => { if (e.target.id === 'c-b') calc(); if (e.target.id === 'rate') { rate = +e.target.value; try { localStorage.setItem('esssouth-explainer-rate', rate); } catch (_) {} schedule(); tick(); } });
  document.addEventListener('keydown', e => {
    if (school === null || ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    if (e.key === 'ArrowRight') go(si + 1); if (e.key === 'ArrowLeft') go(si - 1);
  });
  render();
})();
</script>
</body>
</html>
