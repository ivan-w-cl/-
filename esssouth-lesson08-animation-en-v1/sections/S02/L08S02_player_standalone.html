<script>/* shared/toolkit/beat-kit.js */
/*
 * esssouth beat kit: shared pieces for clock-driven teaching beats (it is used by src/beat-open.js;
 * src/beat-renderer.js, the first beat, predates the kit and keeps its own copies).
 *  - math and DOM helpers
 *  - poser: character keyframes (with prep/settle tweaks) blended over 0.45 s; amplitude mouth
 *  - room: the seated characters in a scaled, clipped panel, plus bubbles and their placement
 *  - captions: the baseline phrase segments
 *  - tokens: one element that changes rect and content across scenes (shared elements)
 *  - anchors: times taken from MEASURED silent runs in the decoded clips, with an explicit
 *    estimated fallback. Each anchor records its source, and the page lists them.
 * Every function is a pure function of t; nothing here schedules timers.
 */
(function (global) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg', W = 1920, H = 1080;
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, p) => a + (b - a) * p;
  const F = (t, a, d) => (d <= 0 ? (t >= a ? 1 : 0) : easeIO(clamp((t - a) / d)));
  const win = (t, a, b, fi, fo) => Math.min(F(t, a, fi), 1 - F(t, b - fo, fo));
  const el = (tag, cls, p) => { const n = document.createElement(tag); if (cls) n.className = cls; if (p) p.appendChild(n); return n; };
  const sv = (tag, a, p) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
  const rich = (n, s) => { n.textContent = ''; String(s).split(/\[\[(.+?)\]\]/).forEach((x, i) => { if (!x) return; if (i % 2) { const h = el('span', 'hl', n); h.textContent = x; } else n.appendChild(document.createTextNode(x)); }); return n; };
  const op = (n, o) => { o = clamp(o); n.style.opacity = o.toFixed(3); n.style.visibility = o < 0.003 ? 'hidden' : 'visible'; };
  const lr = (a, b, p) => { const o = {}; Object.keys(a).forEach((k) => (o[k] = typeof a[k] === 'number' && typeof b[k] === 'number' ? lerp(a[k], b[k], p) : p < 0.5 ? a[k] : b[k])); return o; };
  const chain = (t, rects) => { // rects: [[t0, dur, rect], ...]; holds the first rect before t0 and blends each step
    let r = rects[0][2]; for (let i = 1; i < rects.length; i++) { const [t0, d, to] = rects[i]; r = lr(r, to, F(t, t0, d)); } return r; };

  // ---- timing: cues placed in order (gapBefore + measured clip + tail) ----
  function placeCues(beat, clip) {
    const cue = {}; let t = 0;
    beat.cues.forEach((c) => {
      const start = t + (c.gapBefore || 0), len = c.kind === 'hold' ? c.duration : clip[c.id];
      const end = start + len + (c.kind === 'line' ? beat.audioTail : 0);
      cue[c.id] = { id: c.id, start, speechEnd: start + len, end, clip: c.kind === 'line' ? len : null, segments: c.segments || [], speakerId: c.speakerId, kind: c.kind };
      t = end;
    });
    return { cue, duration: t };
  }
  // anchors: runs[id] = measured silent runs [[a,b],...] within the clip (seconds from clip start)
  function anchors(runs, cueTimes) {
    const used = [];
    const A = {
      // k-th silent run (0-based) of a clip that contains the expected number of runs near expect
      pause(id, near, fallback, label) {
        const c = cueTimes[id], rs = (runs[id] || []).filter((r) => r[0] > 0.15 && r[1] < c.clip - 0.1);
        let best = null; rs.forEach((r) => { if (!best || Math.abs(r[0] - near) < Math.abs(best[0] - near)) best = r; });
        const ok = best && Math.abs(best[0] - near) < 0.8;
        const v = ok ? { start: c.start + best[0], end: c.start + best[1], source: 'measured' } : { start: c.start + fallback, end: c.start + fallback + 0.15, source: 'estimated' };
        used.push({ label, id, at: +(v.start - c.start).toFixed(2), source: v.source }); return v;
      },
      est(id, sec, label) { const c = cueTimes[id]; used.push({ label, id, at: +sec.toFixed(2), source: 'estimated' }); return c.start + sec; },
      list: used
    };
    return A;
  }

  // ---- poser ----
  function poser(RIG, chars, rmRef) {
    function resolve(spec, c) {
      const [name, look] = spec.split(':'), base = RIG.POSES[name] || RIG.POSES.neutral;
      let dir = 0; if (look && chars[look] && look !== c.id) dir = Math.sign(chars[look].seatX - c.seatX);
      const A = (k) => RIG.ARM[k] || RIG.ARM.rest, mir = (a) => [-a[0], a[1], -a[2], a[3]], nr = dir >= 0;
      return { lean: base.lean, dir, tilt: base.tilt, nod: base.nod, shake: base.shake, brow: base.brow, inner: base.inner, mouth: base.mouth, turn: dir * 0.85,
        gazeY: look === 'down' ? 1 : base.gazeY || 0, armR: nr ? A(base.near) : A(base.far), armL: nr ? mir(A(base.far)) : mir(A(base.near)) };
    }
    const rest = RIG.ARM.rest;
    const tweaks = {
      prep: (p) => Object.assign(p, { lean: p.lean - 1.2, brow: p.brow + 0.3, mouth: Math.min(p.mouth, 0.1) }),
      settle: (p) => Object.assign(p, { lean: p.lean * 0.6, armR: p.armR.map((v, j) => lerp(v, rest[j], 0.6)), armL: p.armL.map((v, j) => lerp(v, j % 2 ? rest[j] : -rest[j], 0.6)) }),
      down: (p) => Object.assign(p, { gazeY: 0.8 })
    };
    let keys = {};
    const NUM = ['lean', 'dir', 'tilt', 'nod', 'shake', 'brow', 'inner', 'mouth', 'turn', 'gazeY'];
    return {
      set(spec) { keys = {}; Object.keys(spec).forEach((id) => (keys[id] = spec[id].slice().sort((a, b) => a[0] - b[0]).map(([t, s, tw]) => ({ t, pose: tw ? tweaks[tw](resolve(s, chars[id])) : resolve(s, chars[id]) })))); },
      at(id, t) {
        const k = keys[id]; let i = 0; while (i + 1 < k.length && k[i + 1].t <= t) i++;
        const rm = rmRef(), cur = k[i], prev = i ? k[i - 1] : k[0], p = rm ? 1 : F(t, cur.t, 0.45), o = {};
        NUM.forEach((n) => (o[n] = lerp(prev.pose[n], cur.pose[n], p)));
        o.armL = cur.pose.armL.map((v, j) => lerp(prev.pose.armL[j], v, p)); o.armR = cur.pose.armR.map((v, j) => lerp(prev.pose.armR[j], v, p));
        o.eyeTurn = lerp(prev.pose.turn, cur.pose.turn, rm ? 1 : F(t, cur.t - 0.12, 0.25));
        const s = t - cur.t; o.nodNow = rm ? 0 : o.nod * clamp(1 - s / 1.6) * Math.sin(s * Math.PI * 2 * 1.4); o.shakeNow = 0;
        return o;
      }

<script>/* shared/l08/kit.js */

 * Deliberate extension (recorded in STYLE_PROVENANCE.md): the bubble tail points at the speaking seat for Maya and Noah

(function (global) {
  'use strict';

    K.optRects = [R(150, 470, 1620, 104, 30), R(150, 594, 1620, 104, 30), R(150, 718, 1620, 104, 30)];

  }

  function helpers(E, S, tr, ctx) {
    const Rx = ctx.Rx, MOTION = Rx.MOTION, D = ctx.D, L = E.label, markup = global.EsssouthStyleEngine.markup, P = D.sectionId + '.';

<script>/* shared/l08/audio-hook.js */
/*
 * esssouth Lesson 08 · future-audio attachment hook. This review is SILENT: every slot in content/source/audio-slots.en.json
 * has path = null, so create() returns null and nothing is loaded, decoded or played.
 *
 * When narration exists (downstream pass): fill each slot's path (relative to the section folder), durationSeconds
 * (measured) and lang, e.g. with tools/attach-audio.mjs. Then:
 *  - profile(D) returns { voiceSec: { cueId: measuredSeconds } }: the compiler replaces the reading estimate with the
 *    measured clip; anchors keep their relative place in the line; holds, motion durations and branch order are unchanged.
 *  - create(D, C) returns a binder that starts the clip of the cue under the visual clock at the right offset, follows the
 *    same rate (preservesPitch = true) and is stopped by the player's single cancellation boundary (stop()). Audio never
 *    runs past a waiting gate: start(track, t, rate, limit) only schedules clips that begin before `limit`.
 * Missing or undecodable clips are listed in window.__l08audio.problems; they are never silently counted as attached.
 */
(function (global) {
  'use strict';
  function slotsWithAudio(D) { return Object.values((D.audioSlots && D.audioSlots.slots) || {}).filter((s) => s.path); }
  function profile(D) {
    const s = slotsWithAudio(D); if (!s.length) return null;
    const voiceSec = {}; s.forEach((x) => { if (x.durationSeconds != null) voiceSec[x.audioId] = +x.durationSeconds; });
    return { voiceSec, source: 'measured audio (' + (D.audioSlots.lang || 'en') + ')' };
  }
  function create(D) {
    const slots = slotsWithAudio(D); if (!slots.length) return null;
    const els = {}, problems = []; global.__l08audio = { problems, els };
    slots.forEach((s) => { const a = new Audio(); a.preload = 'auto'; a.src = s.path; a.preservesPitch = true; a.addEventListener('error', () => problems.push({ audioId: s.audioId, path: s.path, error: 'load/decode failed' })); els[s.audioId] = a; });
    let timers = [];
    return {
      start(track, t, rate, limit) {
        this.stop();
        track.lines.forEach((c) => { const a = els[c.cueId]; if (!a || c.start >= limit || c.speechEnd <= t) return;
          const begin = () => { a.playbackRate = rate; a.currentTime = Math.max(0, t - c.start); a.play().catch((e) => problems.push({ audioId: c.cueId, error: String(e) })); };

      },
      stop() { timers.forEach(clearTimeout); timers = []; Object.values(els).forEach((a) => { if (!a.paused) a.pause(); }); }

6"},{"kind":"line","id":"L08.S02.c007"},{"kind":"line","id":"L08.S02.c008"},{"kind":"line","id":"L08.S02.c009"},{"kind":"interaction","id":"L08.I01"}]},{"id":"L08.S02.B03","title":"Keep the Remaining Decision Visible","family":"summary_check","steps":[{"kind":"line","id":"L08.S02.c010"},{"kind":"hold","id":"L08.S02.h102"}]},{"id":"L08.S02.B04","title":"Move Forward without Closing Too Early","family":"next_decision","steps":[{"kind":"line","id":"L08.S02.c011"},{"kind":"line","id":"L08.S02.c012"}]}],"cues":{"L08.S02.c001":{"id":"L08.S02.c001","speaker":"coach","text":"A shared summary is more than a list of suggestions. It says what people support, how far that support goes, and what is still unresolved. Those are separate claims. If one person supports an example, that is not the same as supporting its length, its place in the session or the complete plan.","visualEn":"Open formal ledger with person, supported element, condition, and open question. Avoid a group consensus badge.","anchorHint":"how far that support goes","screenLabelIds":["section.title","support.scope"],"audioId":"L08.S02.c001","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c002":{"id":"L08.S02.c002","speaker":"coach","text":"Return to the taster proposals. The following support statements are available in this baseline. Read their qualifications as carefully as their positive words. A condition is part of the contribution; it is not a small detail to delete when you shorten the summary.","visualEn":"Show exact F06–F08 as attributed reference cards, including the but/remaining-question clauses.","anchorHint":"A condition is part","screenLabelIds":["baseline.maya","baseline.noah","baseline.participant","snapshot.label"],"audioId":"L08.S02.c002","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c003":{"id":"L08.S02.c003","speaker":"coach","text":"Maya supports showing an example, while protecting pair discussion. Noah supports some pair discussion and still wants a decision about the example's length. These positions have a useful connection, but the connection is not yet a fully timed agreement.","visualEn":"Connect shared elements with thin lines; keep conditions attached to their named owners.","anchorHint":"not yet a fully timed agreement","screenLabelIds":["maya.support","noah.support"],"audioId":"L08.S02.c003","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c004":{"id":"L08.S02.c004","speaker":"coach","text":"A person who has not replied has not supplied a view you can report. Nodding, looking at the board or letting a summary pass might have several meanings. If the status matters, ask a focused question and leave room for a correction or a request for more time.","visualEn":"Display No stated view separately from Supports and Does not support. Neutral character gestures never move a status card.","anchorHint":"has not supplied a view","screenLabelIds":["silence.status","check.invite"],"audioId":"L08.S02.c004","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c005":{"id":"L08.S02.c005","speaker":"coach","text":"You can also overcorrect. Saying nothing is agreed can erase a real point of support. Keep agreement at the level where it exists: a named person's support for a named element, with the words that limit it. A complete group decision requires more evidence than a tidy diagram.","visualEn":"Zoom by card movement, not camera, from whole-plan label to individual supported elements. Use status text as well as colour.","anchorHint":"at the level where it exists","screenLabelIds":["support.level","whole.open"],"audioId":"L08.S02.c005","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c006":{"id":"L08.S02.c006","speaker":"coach","text":"The prompt gives a firm constraint: at least five minutes for questions within thirty. That is not something you have to infer from a person's reaction. Separate the task requirement from the group's preferences so the summary can preserve both without calling them the same kind of agreement.","visualEn":"Use a distinct fixed requirements rail beneath the support ledger.","anchorHint":"Separate the task requirement","screenLabelIds":["constraint.notvote","time.included"],"audioId":"L08.S02.c006","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c007":{"id":"L08.S02.c007","speaker":"coach","text":"A useful summary can therefore contain a positive connection and an open question together. It need not sound indecisive. Saying what is supported gives the group a base to work from; saying what remains open tells them what their next decision actually concerns.","visualEn":"Build an accurate-summary card from Supported elements plus Remaining decision; do not fill the learner response field.","anchorHint":"a positive connection and an open question","screenLabelIds":["summary.parts"],"audioId":"L08.S02.c007","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c008":{"id":"L08.S02.c008","speaker":"coach","text":"Now compare three possible accounts of this same baseline. Judge each against the actual statements, not just against how confident or friendly it sounds. The question is whether the account changes the scope of support or discards useful information.","visualEn":"Prepare three neutral option cards; all keep the same ledger visible.","anchorHint":"the scope of support","screenLabelIds":["choice.focus"],"audioId":"L08.S02.c008","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c009":{"id":"L08.S02.c009","speaker":"coach","text":"Choose the account you could defend by pointing back to the source. Afterward, notice whether a peer's reply confirms only their own position or settles something wider. A reply from one person is still one person's reply.","visualEn":"Hold the source names beside the choice area; no winning colour before selection.","anchorHint":"one person is still one person","screenLabelIds":["reply.scope"],"audioId":"L08.S02.c009","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c010":{"id":"L08.S02.c010","speaker":"coach","text":"On any path, return to the scope of the claim. The baseline supports keeping useful elements in consideration, and it leaves decisions about their arrangement and timing open. A summary is ready for use when another person can see what to confirm, qualify or correct.","visualEn":"Common rejoin is valid after A/B/C or Skip. Reset to the source ledger, without importing a branch correction as universal evidence.","anchorHint":"confirm, qualify or correct","screenLabelIds":["check.actions"],"audioId":"L08.S02.c010","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c011":{"id":"L08.S02.c011","speaker":"coach","text":"Use accurate status words when they help: proposed, supported with a condition, or still open. You do not need to recite labels in every sentence. Their job is to stop a provisional idea from becoming a decision simply because it has been repeated.","visualEn":"Three status cards remain visually distinct with words and border styles.","anchorHint":"simply because it has been repeated","screenLabelIds":["status.proposed","status.partial","status.open"],"audioId":"L08.S02.c011","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.c012":{"id":"L08.S02.c012","speaker":"coach","text":"Once the shared ground is clear, the group can test whether the elements fit together. That is a different question from whether they all sound attractive. The next section looks at the connections and constraints that make a combined proposal worth developing.","visualEn":"Carry the accurately scoped cards into an unfinished candidate-sequence frame.","anchorHint":"whether the elements fit together","screenLabelIds":["next.fit"],"audioId":"L08.S02.c012","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.d101":{"id":"L08.S02.d101","speaker":"learner","text":"We all agree on the complete plan: demonstration, pair discussion and questions.","visualEn":"Show only this proposed summary in the Participant bubble, under the fixed baseline. Never mark an unsupported summary as fact.","anchorHint":"complete plan","screenLabelIds":["choice.A.status"],"audioId":"L08.S02.d101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L08.S02.d102":{"id":"L08.S02.d102","speaker":"noah","text":"We haven't decided how short the demonstration should be. I supported some pair discussion, not the complete plan.","visualEn":"Noah responds only within this branch. Restore baseline on Retry; his reply is not inherited by another path.","anchorHint":"decided","screenLabelIds":[],"audioId":"L08.S02.d102","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L08.S02.f101":{"id":"L08.S02.f101","speaker":"coach","text":"This account promotes partial support into a whole-plan decision. The correction matters even though its list contains useful ideas. Keep the supported elements, but remove the claim that everyone has agreed to their final arrangement.","visualEn":"Return to the evidence board and compare this summary with F06–F08; no score, correct-answer trophy or learner-performance claim.","anchorHint":"support","screenLabelIds":["feedback.A"],"audioId":"L08.S02.f101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.d201":{"id":"L08.S02.d201","speaker":"learner","text":"There is support for an example and pair discussion, but their timing and the whole sequence are still open. Question time must stay within the thirty minutes.","visualEn":"Show only this proposed summary in the Participant bubble, under the fixed baseline. Never mark an unsupported summary as fact.","anchorHint":"timing and the whole sequence","screenLabelIds":["choice.B.status"],"audioId":"L08.S02.d201","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L08.S02.d202":{"id":"L08.S02.d202","speaker":"noah","text":"Yes, I still want us to decide how short the demonstration should be.","visualEn":"Noah responds only within this branch. Restore baseline on Retry; his reply is not inherited by another path.","anchorHint":"how short","screenLabelIds":[],"audioId":"L08.S02.d202","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L08.S02.f201":{"id":"L08.S02.f201","speaker":"coach","text":"This summary preserves support for elements while keeping the timing open. Noah confirms his own unresolved question here. That reply does not certify Maya's view, complete the schedule or establish a whole-group decision.","visualEn":"Return to the evidence board and compare this summary with F06–F08; no score, correct-answer trophy or learner-performance claim.","anchorHint":"support","screenLabelIds":["feedback.B"],"audioId":"L08.S02.f201","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L08.S02.d301":{"id":"L08.S02.d301","speaker":"learner","text":"No one has agreed to anything, so we should start again with completely new ideas.","visualEn":"Show only this proposed summary in the Participant bubble, under the fixed baseline. Never mark an unsupported summary as fact.","anchorHint":"completely new ideas","screenLabelIds":["choice.C.status"],"audioId":"L08.S02.d301","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L08.S02.d302":{"id":"L08.S02.d302","speaker":"noah","text":"I did say I support some pair discussion. The timing is the part I still want us to decide.","visualEn":"Noah responds only within this branch. Restore baseline on Retry; his reply is not inherited by another path.","anchorHint":"some pair discussion","screenLabelIds":[],"audioId":"L08.S02.d302","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L08.S02.f301":{"id":"L08.S02.f301","speaker":"coach","text":"This account loses support that is already available. Uncertainty about a complete plan does not make every contribution unusable. Keep the partial support and name the particular question, rather than resetting the discussion without a reason.","visualEn":"Return to the evidence board and compare this summary with F06–F08; no score, correct-answer trophy or learner-performance claim.","anchorHint":"already available","screenLabelIds":["feedback.C"],"audioId":"L08.S02.f301","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"}},"holds":{"L08.S02.h101":{"kind":"hold","id":"L08.S02.h101","seconds":8,"purpose":"Privately identify a supported element and the condition or question that limits it.","visualEn":"Leave two small private note slots blank; keep exact source statements accessible.","modes":["watch","practice"],"recordedResponse":false},"L08.S02.h102":{"kind":"hold","id":"L08.S02.h102","seconds":12,"purpose":"Privately rewrite one overbroad agreement claim with a narrower supported scope.","visualEn":"Display the overbroad statement as an example to revise; private rewrite stays blank. No automatic feedback.","modes":["watch","practice"],"recordedResponse":false}},"interactions":{"L08.I01":{"kind":"choice","prompt":"Which account preserves the support that has been stated without turning it into a complete decision?","watchChoice":"B","watchThinkSeconds":8,"baseline":"Use F01–F09 and the three exact support statements F06–F08. These statements concern elements and conditions, not an agreed whole plan. Before every alternative restore this same baseline. A peer correction is an authored branch continuation, not a newly established group decision.","skipNote":"No response selected. Continue to checking the scope of a summary.","rejoinCue":"L08.S02.c010","options":[{"id":"A","label":"We all agree on the complete plan: demonstration, pair discussion and questions.","events":[{"kind":"line","id":"L08.S02.d101"},{"kind":"line","id":"L08.S02.d102"},{"kind":"line","id":"L08.S02.f101"}]},{"id":"B","label":"There is support for an example and pair discussion, but their timing and the whole sequence are still open. Question time must stay within the thirty minutes.","events":[{"kind":"line","id":"L08.S02.d201"},{"kind":"line","id":"L08.S02.d202"},{"kind":"line","id":"L08.S02.f201"}]},{"id":"C","label":"No one has agreed to anything, so we should start again with completely new ideas.","events":[{"kind":"line","id":"L08.S02.d301"},{"kind":"line","id":"L08.S02.d302"},{"kind":"line","id":"L08.S02.f301"}]}],"id":"L08.I01","practiceTimeout":null,"autoSelect":false,"skipIsUnanswered":true,"score":null,"stateStorage":"memory only","branchOutcome":"Authored fictional continuation, not a prediction or universal reaction."}},"boundary":"Use formal explanation and short explicitly fictional excerpts. Partial support, open questions, candidate proposals and adopted decisions stay distinct. A summary does not create consent. Models are separate authored examples, not captured learner speech."},"labels":{"schema":"esssouth.labels/1","sectionId":"L08.S02","labels":{"lesson.title":"Bring Contributions Together into a Shared Proposal","section.title":"Separate Shared Ground from Open Questions","support.scope":"Support for what, and with which condition?","baseline.maya":"I support showing an example, but I don't want it to take away the pair discussion.","baseline.noah":"I support some pair discussion. I still want us to decide how short the demonstration should be.","baseline.participant":"I support protecting the question time. We still need a workable sequence within thirty minutes.","snapshot.label":"Baseline: stated support","maya.support":"Example, without losing pairs","n /*

 * (shared/toolkit/engine.js) and the approved transport pattern (one wall clock, one requestAnimationFrame loop,
 * stop() as the single cancellation boundary, rates 1 / 1.25 / 1.5 / 2 scaling the whole timeline).
 *
 * Added for Lesson 08 (docs/MODE_CONTRACT_EN.md):
 *  - Watch and Practice. Watch plays the declared path ('watch' route). Practice plays the common route and, at a gate,
 *    WAITS without a timer: awaiting_choice → branch_playing → branch_ready → common continuation (Continue), or Skip.
