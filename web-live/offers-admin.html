        $('div', { class: 'w2' }, field('条件 / 到账说明（中文）', inp(o, 'conditionsZh', 'text', { placeholder: '例：入住满 8 周后打款' }))), $('div', { class: 'w2' }, field('只适用于这些房型（逗号分隔，空 = 全部）', (() => { const i = $('input', { value: (o.rooms || []).join(', ') }); i.addEventListener('input', () => { o.rooms = i.value.split(',').map(s => s.trim()).filter(Boolean); dirty = true; markDirty(); }); return i; })())),
        $('div', { class: 'tools' }, $('label', { class: 'ck' }, (() => { const c = $('input', { type: 'checkbox' }); c.checked = !!o.conditional; c.addEventListener('change', () => { o.conditional = c.checked; dirty = true; markDirty(); }); return c; })(), '有条件（续租、推荐、优惠码…），不算进主价格'),
          ch === 'official' ? $('label', { class: 'ck' }, (() => { const c = $('input', { type: 'checkbox' }); c.checked = !!o.directOnly; c.addEventListener('change', () => { o.directOnly = c.checked; dirty = true; markDirty(); }); return c; })(), '仅官网直订') : null,
          $('span', { class: 'sp', style: 'flex:1' }), $('button', { class: 'x', onclick: () => { list.splice(i, 1); dirty = true; render(); } }, '删除这条')));
      card.append(box);
    });
    card.append($('div', {}, $('button', { class: 'btn ghost', onclick: () => { list.push({ type: 'cash', unit: 'once', amount: null, title: '', titleZh: '', conditions: '', conditionsZh: '', paid: '', until: '', rooms: [], conditional: false, directOnly: false }); dirty = true; render(); } }, '＋ 加一条优惠')));
    return card;
  }

  /* ---------- 动作 ---------- */
  async function save() {
    const d = draft;
    if (d.rooms.some(r => !r.name || !r.weeks || !r.rent)) { toast('房型名、周数、周租都要填'); return; }
    if (server) { try { const r = await api('/homes/' + sel, 'PUT', d); D.homes[sel] = r.home; } catch (e) { if (e.message !== 'login') toast('保存失败：' + e.message); return; } }
    else { d.confirmedAt = new Date().toISOString(); delete d.demo; D.homes[sel] = JSON.parse(JSON.stringify(d)); saveLocal(); }
    draft = JSON.parse(JSON.stringify(D.homes[sel])); dirty = false; toast('已保存'); render();
  }
  async function decide(p, how) {
    if (server) { try { await api('/pending/' + p.id + '/' + how, 'POST'); await load(); } catch (e) { if (e.message !== 'login') toast('失败：' + e.message); return; } }
    else { D.pending = D.pending.filter(x => x !== p); if (how === 'approve') { D.homes[p.homeId] = { ...homeData(p.homeId), ...p.found, confirmedAt: new Date().toISOString(), checkStatus: 'same' }; } saveLocal(); }
    draft = JSON.parse(JSON.stringify(homeData(sel))); dirty = false; toast(how === 'approve' ? '已更新到学生端' : '已忽略'); render();
  }
  /* 演示模式的「检查」：模拟官网把第一条现金返现提高 £50，让你看到待核对的样子 */
  function demoCheck(id) {
    const h = JSON.parse(JSON.stringify(homeData(id))); h.checkedAt = new Date().toISOString();
    const o = h.official.find(x => (x.type === 'cash' || x.type === 'voucher') && x.unit === 'once' && x.amount && !x.conditional);
    if (!o) { h.checkStatus = 'same'; D.homes[id] = h; return; }
    const before = o.amount; o.amount = (o.amount || 0) + 50;
    D.pending = (D.pending || []).filter(p => p.homeId !== id);
    D.pending.push({ id: 'p_demo' + Date.now(), homeId: id, at: h.checkedAt, url: h.url || 'https://example.com', changes: ['优惠变了：' + (o.titleZh || o.title) + ' ' + money(before) + ' → ' + money(o.amount) + '（演示：模拟官网变化）'], notes: '', found: { rooms: h.rooms, fees: h.fees, official: h.official } });
    D.homes[id] = { ...homeData(id), checkedAt: h.checkedAt, checkStatus: 'changed' };
  }
  async function checkNow(ids) {
    busy = true; render();
    try {
      if (!server) { (ids || Object.keys(D.homes)).forEach(demoCheck); saveLocal(); await new Promise(r => setTimeout(r, 900)); toast('检查完成（演示）'); }
      else if (ids) { const r = await api('/check', 'POST', { homeId: ids[0], wait: true }); const x = r.results[0] || {}; await load(); toast(x.error ? '检查失败' : x.skipped ? '先填官网地址' : x.changed ? '发现变化，请核对' : '和已确认的一样'); }
      else { await api('/check', 'POST', {}); toast('已开始检查，有变化会出现在「待核对」'); poll(); }
    } catch (e) { if (e.message !== 'login') toast(e.code === 'not_configured' ? '服务器没有配置 AI，不能自动检查' : '检查失败：' + e.message); }
    busy = false; if (sel) draft = dirty ? draft : JSON.parse(JSON.stringify(homeData(sel))); render();
  }
  function poll() { const t = setInterval(async () => { try { await load(); if (!dirty) { if (sel) draft = JSON.parse(JSON.stringify(homeData(sel))); render(); } if (!D.monitor.running) clearInterval(t); } catch (_) { clearInterval(t); } }, 5000); }
  function preview() {
    const h = HOMES.find(x => x.id === sel), copy = JSON.parse(JSON.stringify({ settings: D.settings, homes: { ...D.homes, [sel]: draft } }));
    window.OfferCard.setData(copy); window.OfferCard.open(h);
  }
  function settings() {
    const s = { ...D.settings }, m = window.BookingTools.modal({ eyebrow: '官网优惠管理', title: 'Amber 标签与说明' });
    const f = (label, key, area) => { const i = $(area ? 'textarea' : 'input', {}); i.value = s[key] || ''; i.addEventListener('input', () => { s[key] = i.value; }); return field(label, i); };
    m.body.append($('div', { class: 'grid' }, f('Amber 标签（中文，例：Amber 专属）', 'amberLabel'), f('英文', 'amberLabelEn'), f('Amber 补充说明（中文，可空）', 'amberNote', true), f('英文', 'amberNoteEn', true)));
    m.foot.append($('button', { class: 'btn red', onclick: async () => {
      if (server) { try { const r = await api('/settings', 'PUT', s); D.settings = r.settings; } catch (e) { if (e.message !== 'login') toast('保存失败'); return; } }
      else { D.settings = s; saveLocal(); }
      window.BookingTools.close(); toast('已保存'); render();
    } }, '保存'));
  }

  function render() {
    const main = document.getElementById('main'); main.style.display = ''; main.replaceChildren(renderSide(), renderEd());
    document.getElementById('mode').textContent = server ? (D.monitor.enabled ? '自动监测：每 ' + D.monitor.everyHours + ' 小时' + (D.monitor.running ? ' · 正在检查…' : '') : '自动监测未启用（服务器没有 ANTHROPIC_API_KEY）') : '演示模式：数据存在本浏览器';
    document.getElementById('checkAll').disabled = busy || !D.monitor.enabled;
  }
  document.getElementById('checkAll').addEventListener('click', () => checkNow(null));
  document.getElementById('settingsBtn').addEventListener('click', settings);
  addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  async function start() {
    if (/^https?:$/.test(location.protocol)) {
      try { const r = await fetch('./api/health', { cache: 'no-store' }); server = !!(r.ok && (await r.json()).cases); } catch (_) { server = false; }
    }
    try { await load(); } catch (e) { return; }
    const want = new URLSearchParams(location.search).get('home'); if (want && HOMES.some(h => h.id === want)) { sel = want; draft = JSON.parse(JSON.stringify(homeData(want))); }
    render();
  }
  start();
})();
</script>
