<script>/* shared/toolkit/beat-kit.js */
/*
 * esssouth beat kit: shared pieces for clock-driven teaching beats (it is used by src/beat-open.js;
 * src/beat-renderer.js, the first beat, predates the kit and keeps its own copies).
 *  - math and DOM helpers
 *  - poser: character keyframes (with prep/settle tweaks) blended over 0.45 s; amplitude mouth
 *  - room: the seated characters in a scaled, clipped panel, plus bubbles and their placement
 *  - captions: the baseline phrase segments
 *  - tokens: one element that changes rect and content across scenes (shared elements)
 *  - anchors: times taken from MEASURED silent runs in the decoded clips, with an explicit
 *    estimated fallback. Each anchor records its source, and the page lists them.
 * Every function is a pure function of t; nothing here schedules timers.
 */
(function (global) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg', W = 1920, H = 1080;
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, p) => a + (b - a) * p;
  const F = (t, a, d) => (d <= 0 ? (t >= a ? 1 : 0) : easeIO(clamp((t - a) / d)));
  const win = (t, a, b, fi, fo) => Math.min(F(t, a, fi), 1 - F(t, b - fo, fo));
  const el = (tag, cls, p) => { const n = document.createElement(tag); if (cls) n.className = cls; if (p) p.appendChild(n); return n; };
  const sv = (tag, a, p) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
  const rich = (n, s) => { n.textContent = ''; String(s).split(/\[\[(.+?)\]\]/).forEach((x, i) => { if (!x) return; if (i % 2) { const h = el('span', 'hl', n); h.textContent = x; } else n.appendChild(document.createTextNode(x)); }); return n; };
  const op = (n, o) => { o = clamp(o); n.style.opacity = o.toFixed(3); n.style.visibility = o < 0.003 ? 'hidden' : 'visible'; };
  const lr = (a, b, p) => { const o = {}; Object.keys(a).forEach((k) => (o[k] = typeof a[k] === 'number' && typeof b[k] === 'number' ? lerp(a[k], b[k], p) : p < 0.5 ? a[k] : b[k])); return o; };
  const chain = (t, rects) => { // rects: [[t0, dur, rect], ...]; holds the first rect before t0 and blends each step
    let r = rects[0][2]; for (let i = 1; i < rects.length; i++) { const [t0, d, to] = rects[i]; r = lr(r, to, F(t, t0, d)); } return r; };

  // ---- timing: cues placed in order (gapBefore + measured clip + tail) ----
  function placeCues(beat, clip) {
    const cue = {}; let t = 0;
    beat.cues.forEach((c) => {
      const start = t + (c.gapBefore || 0), len = c.kind === 'hold' ? c.duration : clip[c.id];
      const end = start + len + (c.kind === 'line' ? beat.audioTail : 0);
      cue[c.id] = { id: c.id, start, speechEnd: start + len, end, clip: c.kind === 'line' ? len : null, segments: c.segments || [], speakerId: c.speakerId, kind: c.kind };
      t = end;
    });
    return { cue, duration: t };
  }
  // anchors: runs[id] = measured silent runs [[a,b],...] within the clip (seconds from clip start)
  function anchors(runs, cueTimes) {
    const used = [];
    const A = {
      // k-th silent run (0-based) of a clip that contains the expected number of runs near expect
      pause(id, near, fallback, label) {
        const c = cueTimes[id], rs = (runs[id] || []).filter((r) => r[0] > 0.15 && r[1] < c.clip - 0.1);
        let best = null; rs.forEach((r) => { if (!best || Math.abs(r[0] - near) < Math.abs(best[0] - near)) best = r; });
        const ok = best && Math.abs(best[0] - near) < 0.8;
        const v = ok ? { start: c.start + best[0], end: c.start + best[1], source: 'measured' } : { start: c.start + fallback, end: c.start + fallback + 0.15, source: 'estimated' };
        used.push({ label, id, at: +(v.start - c.start).toFixed(2), source: v.source }); return v;
      },
      est(id, sec, label) { const c = cueTimes[id]; used.push({ label, id, at: +sec.toFixed(2), source: 'estimated' }); return c.start + sec; },
      list: used
    };
    return A;
  }

  // ---- poser ----
  function poser(RIG, chars, rmRef) {
    function resolve(spec, c) {
      const [name, look] = spec.split(':'), base = RIG.POSES[name] || RIG.POSES.neutral;
      let dir = 0; if (look && chars[look] && look !== c.id) dir = Math.sign(chars[look].seatX - c.seatX);
      const A = (k) => RIG.ARM[k] || RIG.ARM.rest, mir = (a) => [-a[0], a[1], -a[2], a[3]], nr = dir >= 0;
      return { lean: base.lean, dir, tilt: base.tilt, nod: base.nod, shake: base.shake, brow: base.brow, inner: base.inner, mouth: base.mouth, turn: dir * 0.85,
        gazeY: look === 'down' ? 1 : base.gazeY || 0, armR: nr ? A(base.near) : A(base.far), armL: nr ? mir(A(base.far)) : mir(A(base.near)) };
    }
    const rest = RIG.ARM.rest;
    const tweaks = {
      prep: (p) => Object.assign(p, { lean: p.lean - 1.2, brow: p.brow + 0.3, mouth: Math.min(p.mouth, 0.1) }),
      settle: (p) => Object.assign(p, { lean: p.lean * 0.6, armR: p.armR.map((v, j) => lerp(v, rest[j], 0.6)), armL: p.armL.map((v, j) => lerp(v, j % 2 ? rest[j] : -rest[j], 0.6)) }),
      down: (p) => Object.assign(p, { gazeY: 0.8 })
    };
    let keys = {};
    const NUM = ['lean', 'dir', 'tilt', 'nod', 'shake', 'brow', 'inner', 'mouth', 'turn', 'gazeY'];
    return {
      set(spec) { keys = {}; Object.keys(spec).forEach((id) => (keys[id] = spec[id].slice().sort((a, b) => a[0] - b[0]).map(([t, s, tw]) => ({ t, pose: tw ? tweaks[tw](resolve(s, chars[id])) : resolve(s, chars[id]) })))); },
      at(id, t) {
        const k = keys[id]; let i = 0; while (i + 1 < k.length && k[i + 1].t <= t) i++;
        const rm = rmRef(), cur = k[i], prev = i ? k[i - 1] : k[0], p = rm ? 1 : F(t, cur.t, 0.45), o = {};
        NUM.forEach((n) => (o[n] = lerp(prev.pose[n], cur.pose[n], p)));
        o.armL = cur.pose.armL.map((v, j) => lerp(prev.pose.armL[j], v, p)); o.armR = cur.pose.armR.map((v, j) => lerp(prev.pose.armR[j], v, p));
        o.eyeTurn = lerp(prev.pose.turn, cur.pose.turn, rm ? 1 : F(t, cur.t - 0.12, 0.25));
        const s = t - cur.t; o.nodNow = rm ? 0 : o.nod * clamp(1 - s / 1.6) * Math.sin(s * Math.PI * 2 * 1.4); o.shakeNow = 0;
        return o;

,"textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.c005":{"id":"L07.S02.c005","speaker":"coach","text":"Privately identify what you know and what you do not. You know the proposal and the two aims. You do not know why the pause occurred or whether the others accept the idea.","visualEn":"Show a blank private distinction beside the known proposal and task. Do not choose a motive or fill the acceptance field.","anchorHint":"whether the others accept the idea","screenLabelIds":["reflection.prompt"],"audioId":"L07.S02.c005","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.c006":{"id":"L07.S02.c006","speaker":"coach","text":"Compare three next turns for this moment. Think about which gives the group a useful opening while leaving opinions unassumed. A response that works after clear agreement may not fit a pause before anyone has responded.","visualEn":"Reveal equal neutral choice cards with the exact excerpt restored. Do not carry the eight-second reflection into the fictional conversation’s timeline.","anchorHint":"leaving opinions unassumed","screenLabelIds":["choice.prompt"],"audioId":"L07.S02.c006","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.c007":{"id":"L07.S02.c007","speaker":"coach","text":"The replies are possible continuations written for practice. Look at what each opening asks others to do. It does not tell us what every person would feel or how every group would respond.","visualEn":"Keep the practice-example label. No mood meter, predicted psychology or permanent good/bad speaker role.","anchorHint":"what each opening asks others to do","screenLabelIds":["choice.note"],"audioId":"L07.S02.c007","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.c008":{"id":"L07.S02.c008","speaker":"coach","text":"Keep the purpose small: offer a next point, rather than secure a final decision in one sentence. An invitation to discuss an idea is not agreement to adopt it.","visualEn":"Retain the open task link and an explicitly unadopted proposal. No vote, final plan or imagined successful welcome session.","anchorHint":"not agreement to adopt it","screenLabelIds":["repair.scope"],"audioId":"L07.S02.c008","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.c010":{"id":"L07.S02.c010","speaker":"coach","text":"The pause alone does not choose the next move. Combine what you observe with what remains open in the task. You can leave space, or offer a question that lets the group examine a specific point.","visualEn":"Every route and Skip rejoin using only the common pause, Maya proposal and task. Remove branch-specific dialogue and opinions; do not assume Noah’s full proposal was heard.","anchorHint":"what remains open in the task","screenLabelIds":["shared.check"],"audioId":"L07.S02.c010","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.c011":{"id":"L07.S02.c011","speaker":"coach","text":"After speaking, make room for a reply and attend to its content. Another proposal may need comparison; a question may need clarification; continued silence may call for more space. The phrase itself cannot guarantee progress.","visualEn":"Show three possible subsequent needs without enacting all as one conversation or inventing current programme facts. No success animation or fixed sequence.","anchorHint":"cannot guarantee progress","screenLabelIds":["followup.rule"],"audioId":"L07.S02.c011","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.c012":{"id":"L07.S02.c012","speaker":"coach","text":"Privately form one possible next turn for the original pause, or choose to wait. Keep the purpose clear and the others’ views open. Pause playback if you want more time.","visualEn":"Restore the original excerpt only; hide full branch models. Keep a blank private response area and waiting as a legitimate choice, with no recording or inferred selection.","anchorHint":"or choose to wait","screenLabelIds":["private.prompt"],"audioId":"L07.S02.c012","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.c013":{"id":"L07.S02.c013","speaker":"coach","text":"If you formed a reply, check what it assumes. Does it offer a task-related opening, or put words into someone else’s mouth? Next, a fresh excerpt will examine what to do when two turns begin before either is finished.","visualEn":"End with a conditional self-check and a fresh-excerpt bridge. No response is analysed, no branch becomes the adopted history, and navigation remains explicit.","anchorHint":"check what it assumes","screenLabelIds":["review.question","next.title"],"audioId":"L07.S02.c013","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.d101":{"id":"L07.S02.d101","speaker":"learner","text":"No one has objected, so let's choose the paired introductions.","visualEn":"Authored alternative A after the exact four-second baseline. Keep the proposed choice as this speaker’s premature suggestion, never an actual adopted decision.","anchorHint":"No one has objected","screenLabelIds":["branch.a.label"],"audioId":"L07.S02.d101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S02.d102":{"id":"L07.S02.d102","speaker":"noah","text":"I haven't said whether I agree. I have another idea to explain.","visualEn":"Noah supplies an authored response in this branch. It establishes neither agreement nor opposition and does not reveal his full proposal. Do not infer a pre-existing emotion.","anchorHint":"I haven't said whether I agree","screenLabelIds":[],"audioId":"L07.S02.d102","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S02.f101":{"id":"L07.S02.f101","speaker":"coach","text":"Moving toward a decision can fit a discussion after positions are clear. Here, silence has been used in place of confirmation. The group has not yet heard Noah’s view or completed the task connection.","visualEn":"Return to known versus unexpressed opinion. No statement that the viewer made a decision or that choosing pairs is inherently wrong.","anchorHint":"in place of confirmation","screenLabelIds":["branch.a.note"],"audioId":"L07.S02.f101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.d201":{"id":"L07.S02.d201","speaker":"learner","text":"How could the paired introductions also help new members find out about the weekly drawing group?","visualEn":"Authored alternative B directed to the group, not a demand on Noah. Link it to the still-open second aim without implying that asking provides programme information.","anchorHint":"find out about the weekly drawing group","screenLabelIds":["branch.b.label"],"audioId":"L07.S02.d201","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S02.d202":{"id":"L07.S02.d202","speaker":"noah","text":"We could each draw or write one thing we'd like to try, then use that to introduce ourselves.","visualEn":"Noah offers the exact separate proposal F05 in this branch only. Show it as another unadopted idea, not a direct confirmation of Maya’s plan or evidence of success.","anchorHint":"draw or write one thing","screenLabelIds":["branch.b.noah"],"audioId":"L07.S02.d202","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S02.f201":{"id":"L07.S02.f201","speaker":"coach","text":"The question makes an open part of the task available for discussion. Noah offers another idea in this example. Neither proposal yet tells us how accurate information about the drawing group will be provided, so that work remains.","visualEn":"Keep both ideas unadopted within this branch and the information-source link unresolved. No programme details, helper or successful result is invented.","anchorHint":"so that work remains","screenLabelIds":["branch.b.note"],"audioId":"L07.S02.f201","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"},"L07.S02.d301":{"id":"L07.S02.d301","speaker":"learner","text":"Noah, you have been quiet. Tell us what you think now.","visualEn":"Authored alternative C. Keep this as a demand in one moment, not a persistent quiet-person label or evidence about Noah’s personality.","anchorHint":"Tell us what you think now","screenLabelIds":["branch.c.label"],"audioId":"L07.S02.d301","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S02.d302":{"id":"L07.S02.d302","speaker":"noah","text":"Could I have a moment to think?","visualEn":"Noah’s authored request concerns what he wants now. It must not be used to establish the cause of the earlier pause or infer that all quiet participants are thinking.","anchorHint":"a moment to think","screenLabelIds":[],"audioId":"L07.S02.d302","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice.","localizationRole":"keep_english"},"L07.S02.f301":{"id":"L07.S02.f301","speaker":"coach","text":"A direct invitation can be useful, but this one demands an immediate answer. The pause does not establish that Noah is ready. An invitation can leave room to think, pass or contribute later rather than requiring an explanation for silence.","visualEn":"Show optional space and later participation as possible alternatives, not a new enacted reply. No blame, diagnosed emotion or automatic improvement claim.","anchorHint":"leave room to think, pass or contribute later","screenLabelIds":["branch.c.note"],"audioId":"L07.S02.f301","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses.","localizationRole":"coach_explanation"}},"holds":{"L07.S02.h001":{"kind":"hold","id":"L07.S02.h001","seconds":4,"purpose":"Illustrate a short pause after the proposal, without assigning a reason.","visualEn":"Hold the unadopted proposal for exactly four illustrative seconds. Label the pause Chosen illustration interval; do not display a universal intervention threshold, a test, a motive, agreement or waiting-for-input state.","modes":["watch","practice"],"recordedResponse":false},"L07.S02.h101":{"kind":"hold","id":"L07.S02.h101","seconds":8,"purpose":"Privately distinguish the observed pause from assumptions about agreement or motive.","visualEn":"Keep the private area blank. This is reflection after the four-second illustrative excerpt, not an extension of the characters’ pause or a speaking-time threshold.","modes":["watch","practice"],"recordedResponse":false},"L07.S02.h102":{"kind":"hold","id":"L07.S02.h102","seconds":8,"purpose":"Privately choose or rehearse a small next move without assuming agreement.","visualEn":"Keep the private area blank. This learner reflection does not extend the fictional pause or count as an actual spoken intervention.","modes":["watch","practice"],"recordedResponse":false}},"interactions":{"L07.I01":{"kind":"choice","prompt":"After this pause, which move offers a useful opening without assuming agreement or demanding an immediate reply from one person?","watchChoice":"B","watchThinkSeconds":8,"rejoinCue":"L07.S02.c010","options":[{"id":"A","label":"No one has objected, so let's choose the paired introductions.","events":[{"kind":"line","id":"L07.S02.d101"},{"kind":"line","id":"L07.S02.d102"},{"kind":"line","id":"L07.S02.f101"}]},{"id":"B","label":"How could the paired introductions also help new members find out about the weekly drawing group?","events":[{"kind":"line","id":"L07.S02.d201"},{"kind":"line","id":"L07.S02.d202"},{"kind":"line","id":"L07.S02.f201"}]},{"id":"C","label":"Noah, you have been quiet. Tell us what you think now.","events":[{"kind":"line","id":"L07.S02.d301"},{"kind":"line","id":"L07.S02.d302"},{"kind":"line","id":"L07.S02.f301"}]}],"skipNote":"Comparison skipped. Continue to the shared explanation without treating silence as a response or inferring a learner choice.","baseline":"Fresh S02 excerpt only: Maya has just offered exact F04; an illustrative four-second pause follows and Noah has not yet responded. The cause and opinions are unknown. Retry restores only that baseline and removes all prior replies, Noah’s revealed proposal and any suggested decision. Four seconds is not a universal threshold. Watch demonstrates B only after eight seconds of learner reflection; reflection is outside the fictional pause. Practice waits indefinitely. Continue or Skip joins c010 once without assumed agreement, speaking, readiness or selected activity.","id":"L07.I01","practiceTimeout
