<script>/* shared/toolkit/beat-kit.js */
/*
 * esssouth beat kit: shared pieces for clock-driven teaching beats (it is used by src/beat-open.js;
 * src/beat-renderer.js, the first beat, predates the kit and keeps its own copies).
 *  - math and DOM helpers
 *  - poser: character keyframes (with prep/settle tweaks) blended over 0.45 s; amplitude mouth
 *  - room: the seated characters in a scaled, clipped panel, plus bubbles and their placement
 *  - captions: the baseline phrase segments
 *  - tokens: one element that changes rect and content across scenes (shared elements)
 *  - anchors: times taken from MEASURED silent runs in the decoded clips, with an explicit
 *    estimated fallback. Each anchor records its source, and the page lists them.
 * Every function is a pure function of t; nothing here schedules timers.
 */
(function (global) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg', W = 1920, H = 1080;
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, p) => a + (b - a) * p;
  const F = (t, a, d) => (d <= 0 ? (t >= a ? 1 : 0) : easeIO(clamp((t - a) / d)));
  const win = (t, a, b, fi, fo) => Math.min(F(t, a, fi), 1 - F(t, b - fo, fo));
  const el = (tag, cls, p) => { const n = document.createElement(tag); if (cls) n.className = cls; if (p) p.appendChild(n); return n; };
  const sv = (tag, a, p) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
  const rich = (n, s) => { n.textContent = ''; String(s).split(/\[\[(.+?)\]\]/).forEach((x, i) => { if (!x) return; if (i % 2) { const h = el('span', 'hl', n); h.textContent = x; } else n.appendChild(document.createTextNode(x)); }); return n; };
  const op = (n, o) => { o = clamp(o); n.style.opacity = o.toFixed(3); n.style.visibility = o < 0.003 ? 'hidden' : 'visible'; };
  const lr = (a, b, p) => { const o = {}; Object.keys(a).forEach((k) => (o[k] = typeof a[k] === 'number' && typeof b[k] === 'number' ? lerp(a[k], b[k], p) : p < 0.5 ? a[k] : b[k])); return o; };
  const chain = (t, rects) => { // rects: [[t0, dur, rect], ...]; holds the first rect before t0 and blends each step
    let r = rects[0][2]; for (let i = 1; i < rects.length; i++) { const [t0, d, to] = rects[i]; r = lr(r, to, F(t, t0, d)); } return r; };

  // ---- timing: cues placed in order (gapBefore + measured clip + tail) ----
  function placeCues(beat, clip) {
    const cue = {}; let t = 0;
    beat.cues.forEach((c) => {
      const start = t + (c.gapBefore || 0), len = c.kind === 'hold' ? c.duration : clip[c.id];
      const end = start + len + (c.kind === 'line' ? beat.audioTail : 0);
      cue[c.id] = { id: c.id, start, speechEnd: start + len, end, clip: c.kind === 'line' ? len : null, segments: c.segments || [], speakerId: c.speakerId, kind: c.kind };
      t = end;
    });
    return { cue, duration: t };
  }
  // anchors: runs[id] = measured silent runs [[a,b],...] within the clip (seconds from clip start)
  function anchors(runs, cueTimes) {
    const used = [];
    const A = {
      // k-th silent run (0-based) of a clip that contains the expected number of runs near expect
      pause(id, near, fallback, label) {
        const c = cueTimes[id], rs = (runs[id] || []).filter((r) => r[0] > 0.15 && r[1] < c.clip - 0.1);
        let best = null; rs.forEach((r) => { if (!best || Math.abs(r[0] - near) < Math.abs(best[0] - near)) best = r; });
        const ok = best && Math.abs(best[0] - near) < 0.8;
        const v = ok ? { start: c.start + best[0], end: c.start + best[1], source: 'measured' } : { start: c.start + fallback, end: c.start + fallback + 0.15, source: 'estimated' };
        used.push({ label, id, at: +(v.start - c.start).toFixed(2), source: v.source }); return v;
      },
      est(id, sec, label) { const c = cueTimes[id]; used.push({ label, id, at: +sec.toFixed(2), source: 'estimated' }); return c.start + sec; },
      list: used
    };
    return A;
  }

  // ---- poser ----
  function poser(RIG, chars, rmRef) {
    function resolve(spec, c) {
      const [name, look] = spec.split(':'), base = RIG.POSES[name] || RIG.POSES.neutral;
      let dir = 0; if (look && chars[look] && look !== c.id) dir = Math.sign(chars[look].seatX - c.seatX);
      const A = (k) => RIG.ARM[k] || RIG.ARM.rest, mir = (a) => [-a[0], a[1], -a[2], a[3]], nr = dir >= 0;
      return { lean: base.lean, dir, tilt: base.tilt, nod: base.nod, shake: base.shake, brow: base.brow, inner: base.inner, mouth: base.mouth, turn: dir * 0.85,
        gazeY: look === 'down' ? 1 : base.gazeY || 0, armR: nr ? A(base.near) : A(base.far), armL: nr ? mir(A(base.far)) : mir(A(base.near)) };
    }
    const rest = RIG.ARM.rest;
    const tweaks = {
      prep: (p) => Object.assign(p, { lean: p.lean - 1.2, brow: p.brow + 0.3, mouth: Math.min(p.mouth, 0.1) }),
      settle: (p) => Object.assign(p, { lean: p.lean * 0.6, armR: p.armR.map((v, j) => lerp(v, rest[j], 0.6)), armL: p.armL.map((v, j) => lerp(v, j % 2 ? rest[j] : -rest[j], 0.6)) }),
      down: (p) => Object.assign(p, { gazeY: 0.8 })
    };
    let keys = {};
    const NUM = ['lean', 'dir', 'tilt', 'nod', 'shake', 'brow', 'inner', 'mouth', 'turn', 'gazeY'];
    return {
      set(spec) { keys = {}; Object.keys(spec).forEach((id) => (keys[id] = spec[id].slice().sort((a, b) => a[0] - b[0]).map(([t, s, tw]) => ({ t, pose: tw ? tweaks[tw](resolve(s, chars[id])) : resolve(s, chars[id]) })))); },
      at(id, t) {
        const k = keys[id]; let i = 0; while (i + 1 < k.length && k[i + 1].t <= t) i++;
        const rm = rmRef(), cur = k[i], prev = i ? k[i - 1] : k[0], p = rm ? 1 : F(t, cur.t, 0.45), o = {};
        NUM.forEach((n) => (o[n] = lerp(prev.pose[n], cur.pose[n], p)));
        o.armL = cur.pose.armL.map((v, j) => lerp(prev.pose.armL[j], v, p)); o.armR = cur.pose.armR.map((v, j) => lerp(prev.pose.armR[j], v, p));
        o.eyeTurn = lerp(prev.pose.turn, cur.pose.turn, rm ? 1 : F(t, cur.t - 0.12, 0.25));
        const s = t - cur.t; o.nodNow = rm ? 0 : o.nod * clamp(1 - s / 1.6) * Math.sin(s * Math.PI * 2 * 1.4); o.shakeNow = 0;
        return o;
      }
    };
  }
  function mouth(core, env, cueT, t, rm) {
    if (!cueT) return 0; const u = t - cueT.start; if (u < 0 || u > cueT.clip) return 0;
    if (env) { const a = core.envelopeAt(env, u); return a > 0 ? (rm ? 0.35 : 0.1 + 0.8 * a) : 0; }
    return rm ? 0.35 : 0.25 + 0.5 * Math.abs(Math.sin(u * Math.PI * 4.6));
  }

  // ---- room ----
  function room(stage, RIG, characters, tf) {
    const box = el('div', 'room', stage);
    const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H }, box);

      if (gate) { const g = steps.find((s) => s.kind === 'gate' || s.kind === 'think'); tr.gateStep = g; const br = steps.filter((s) => s.branch); tr.branchStart = br.length ? br[0].start : null; tr.branchEnd = br.length ? br[br.length - 1].end : null; tr.readyStep = steps.find((s) => s.kind === 'ready') || null; }
      tracks[key] = tr;
    });
    const anchorList = Object.entries(A).map(([name, a]) => ({ name, cue: a.cue, phrase: a.phrase, localSec: +localOf(name).toFixed(3), suppliedSec: a.supplied != null ? a.supplied : null, source: a.source }));
    return { tracks, gate, cueTiming: ct, anchors: anchorList, holdSec, words };
  }

  // the common section position of route time x (the skip/main route is the common timeline: no branch, gate as a point)
  function commonTime(C, route, x) {
    const common = C.tracks[C.gate ? 'practice:skip' : 'practice:main'], s = route.stepAt(x);
    if (common.has(s.id) && s.common) return common.cue(s.id).start + Math.min(x - s.start, s.dur);
    if (C.gate) return common.gateStep.end; // inside the gate, a branch or the think hold: the gate's common position
    return x;
  }
  return { compile, commonTime, words, TAIL, GATE_PRESENT };
});

<script>/* shared/l04/kit.js */
/*
 * esssouth Lesson 04 · scene kit. Thin Lesson 04 layer over the approved recipes (shared/toolkit/recipes.js): every motion

 *  - base(E, ctx): chrome tokens first (kicker, title), the section's content tokens, then (finishTokens) the gate option

 *  - helpers(E, S, tr, ctx): the approved recipe helpers bound to one route, plus cue/anchor lookups by short id,
 *    a speaker-aware bubble (say), a character-line wrapper (line), the gate presentation (gate) and clearAll.
 * Deliberate extension (recorded in STYLE_PROVENANCE.md): the bubble tail points at the speaking seat for Maya and Noah

 */
(function (global) {
  'use strict';
  function base(E, ctx) {
    const Rx = ctx.Rx, R = Rx.R, L = E.label, DEF = { room: { s: Rx.ROOM.full.s, x: Rx.ROOM.full.x, y: Rx.ROOM.full.y, o: 0 } };

      tok('bubL', GG.bubWide, 'bubble', '', 'token.quote', { who: 1, spk: 'learner' });
    };
    K.optRects = [R(150, 470, 1620, 104, 30), R(150, 594, 1620, 104, 30), R(150, 718, 1620, 104, 30)];
    return K;
  }

  function helpers(E, S, tr, ctx) {
    const Rx = ctx.Rx, MOTION = Rx.MOTION, D = ctx.D, L = E.label, markup = global.EsssouthStyleEngine.markup, P = D.sectionId + '.';
    const GG = Object.assign({}, Rx.GEO, ctx.scene.G || {});
    Rx.helpers(E, S, { G: GG, L, Q: E.cueText, markup, FRAMES: ctx.scene.FRAMES, HEAD: ctx.scene.HEAD, IMAGINED: ctx.scene.IMAGINED });
    const X = { S, tr, L, MOTION, R: Rx.R, WAIT: Rx.WAIT, GG, neutral: Rx.neutral, speak: Rx.speak, dline: Rx.dline, head: Rx.head };
    X.id = (s) => (s.indexOf('.') >= 0 && s.startsWith('L04') ? s : P + s);
    X.has = (s) => tr.has(X.id(s));
    X.cue = (s) => tr.cue(X.id(s));
    X.X0 = (s) => X.cue(s).start;
    X.end = (s) => X.cue(s).end;
    X.sp = (s) => X.cue(s).speechEnd;
    X.at = (n) => tr.at(n);
    X.a = (s) => tr.at('a_' + X.id(s).replace(/\./g, '_')); // the supplied semantic anchor of a cue
    X.stepsOf = (block) => tr.steps.filter((s) => s.block === X.id(block));
    // speaker-aware bubble: exact cue text, key phrases blue 0.1 s after it rises (the approved say(), plus the speaker)
    X.say = (c, hls, wait, rectOverride) => { // rectOverride: a taller bubble for an unusually long line (same width, style and tail)
      const s = c.start + (wait || 0), rect = rectOverride || GG.bubWide, spk = c.speakerId;
      if (S.vis.has('bubL')) S.put('bubL', c.start - 0.1, MOTION.focus, { o: 0, hl: 0 }); // the previous speaker's words leave as this line starts
      S.set('bubL', s - 0.16, 0, Object.assign({}, rect, { text: markup(E.cueText(c.cueId), hls || []), hl: 0, y: rect.y + 12, o: 0, spk, kind: 'bubble spk-' + spk }));

    X.hold = (id, label) => { const H = X.cue(id); S.hold(H, label || L('hold.' + H.id)); return H; };

    // the gate presentation, the same in every route up to the gate end: prompt + hint in the caption band, neutral options
    X.gate = (opts) => {
      opts = opts || {}; const g = tr.gateStep; if (!g) return null; const G = ctx.C.gate, t = g.start, think = g.kind === 'think';
      const hintKey = G.kind === 'choice' ? (think ? 'ui.thinkHint' : 'ui.gateHint') : (think ? 'ui.thinkHint' : 'ui.rehearseHint');
      S.rise('holdTxt', t + 0.05, GG.holdTxt, { text: L('gate.prompt') });
      S.set('holdHint', t + 0.1, 0, { text: L(hintKey) }); S.rise('holdHint', t + 0.2, GG.holdHint);
      if (think) { S.set('holdBar', t + 0.05, 0, Object.assign({}, GG.holdBar, { w: 0, o: 1 })); S.vis.add('holdBar'); S.put('holdBar', t + 0.1, g.dur - 0.4, { w: GG.holdBar.w }); }
      const ids = G.kind === 'choice' ? G.options.map((o) => 'opt.' + o.key) : [];
      ids.forEach((id, i) => S.rise(id, t + 0.25 + i * 0.15, (opts.optRects || ctx.scene.optRects)[i]));
      if (think && G.kind === 'choice') S.put('opt.' + G.watchKey, g.end - 0.9, MOTION.morph, { kind: 'option sel', act: 1 });
      // leaving the gate (watch: after thinking; practice: when the branch or the common route starts)
      S.hide(['holdTxt', 'holdBar', 'holdHint'], g.end, 0.2);
      return { start: t, end: g.end, ids };
    };
    return X;
  }
  global.L04Kit = { base, helpers };
})(window);

<script>/* shared/l04/audio-hook.js */
/*
 * esssouth Lesson 04 · future-audio attachment hook. This review is SILENT: every slot in content/source/audio-slots.en.json
 * has path = null, so create() returns null and nothing is loaded, decoded or played.
 *
 * When narration exists (downstream pass): fill each slot's path (relative to the section folder), durationSeconds
 * (measured) and lang, e.g. with tools/attach-audio.mjs. Then:
 *  - profile(D) returns { voiceSec: { cueId: measuredSeconds } }: the compiler replaces the reading estimate with the
 *    measured clip; anchors keep their relative place in the line; holds, motion durations and branch order are unchanged.
 *  - create(D, C) returns a binder that starts the clip of the cue under the visual clock at the right offset, follows the
 *    same rate (preservesPitch = true) and is stopped by the player's single cancellation boundary (stop()). Audio never
 *    runs past a waiting gate: start(track, t, rate, limit) only schedules clips that begin before `limit`.
 * Missing or undecodable clips are listed in window.__l04audio.problems; they are never silently counted as attached.
 */
(function (global) {
  'use strict';
  function slotsWithAudio(D) { return Object.values((D.audioSlots && D.audioSlots.slots) || {}).filter((s) => s.path); }
  function profile(D) {
    const s = slotsWithAudio(D); if (!s.length) return null;
    const voiceSec = {}; s.forEach((x) => { if (x.durationSeconds != null) voiceSec[x.audioId] = +x.durationSeconds; });
    return { voiceSec, source: 'measured audio (' + (D.audioSlots.lang || 'en') + ')' };
  }
  function create(D) {
    const slots = slotsWithAudio(D); if (!slots.length) return null;
    const els = {}, problems = []; global.__l04audio = { problems, els };
    slots.forEach((s) => { const a = new Audio(); a.preload = 'auto'; a.src = s.path; a.preservesPitch = true; a.addEventListener('error', () => problems.push({ audioId: s.audioId, path: s.path, error: 'load/decode failed' })); els[s.audioId] = a; });
    let timers = [];
    return {
      start(track, t, rate, limit) {
        this.stop();
        track.lines.forEach((c) => { const a = els[c.cueId]; if (!a || c.start >= limit || c.speechEnd <= t) return;
          const begin = () => { a.playbackRate = rate; a.currentTime = Math.max(0, t - c.start); a.play().catch((e) => problems.push({ audioId: c.cueId, error: String(e) })); };
          if (c.start <= t) begin(); else timers.push(setTimeout(begin, (c.start - t) / rate * 1000)); });
      },
      stop() { timers.forEach(clearTimeout); timers = []; Object.values(els).forEach((a) => { if (!a.paused) a.pause(); }); }
    };
  }
  global.L04Audio = { profile, create };
})(window);

ed phrases, not a viewer transcript. Link each to its exact object: the reason or the proposal.","anchorHint":"These are different commitments","screenLabelIds":["recognition.phrase","agreement.phrase"],"audioId":"L04.S02.c004","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c005":{"id":"L04.S02.c005","speaker":"coach","text":"Do not use agreement as a polite disguise for a concern you want to raise. Equally, do not add an acknowledgement you do not mean. A direct, reasoned objection can also be appropriate.","visualEn":"Show an optional recognition card, not a mandatory first step. Keep a direct objection route available with equal visual weight.","anchorHint":"A direct, reasoned objection can also be appropriate","screenLabelIds":["honesty.rule"],"audioId":"L04.S02.c005","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c006":{"id":"L04.S02.c006","speaker":"coach","text":"Before comparing replies, consider what you can genuinely recognise here. The time limit is real within the scenario. Whether immediate tool use best serves understanding has not been established.","visualEn":"Retain the fixed task time and unresolved proposal. Provide a blank private reflection area rather than an automatically selected personal stance.","anchorHint":"has not been established","screenLabelIds":["reflection.prompt"],"audioId":"L04.S02.c006","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c007":{"id":"L04.S02.c007","speaker":"coach","text":"For this exercise, consider a speaker who values saving time but worries that immediate help could leave too little room for an independent attempt. Which reply expresses both points honestly?","visualEn":"State this as an assigned fictional speaking position, not a detected learner belief. Reveal three neutral alternatives at the gate.","anchorHint":"an independent attempt","screenLabelIds":["choice.position"],"audioId":"L04.S02.c007","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c008":{"id":"L04.S02.c008","speaker":"coach","text":"The peer replies are authored possibilities. They illustrate what the wording introduces into this exchange, not a prediction of Maya’s feelings or a guarantee that one sentence will resolve the difference.","visualEn":"Keep proposal state unchanged and label the continuations as authored. No mood meter, applause or permanent good/bad speaker identity.","anchorHint":"not a prediction of Maya’s feelings","screenLabelIds":["choice.note"],"audioId":"L04.S02.c008","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c010":{"id":"L04.S02.c010","speaker":"coach","text":"The shared task gives a reason to care about time. It also gives a reason to examine opportunities for reasoning. Recognising one consideration does not remove the other, and neither settles the method on its own.","visualEn":"All paths rejoin here once. Reconstruct the two task-related considerations from common facts, without assuming an option was chosen or a peer continuation was heard.","anchorHint":"neither settles the method on its own","screenLabelIds":["shared.criteria"],"audioId":"L04.S02.c010","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c011":{"id":"L04.S02.c011","speaker":"coach","text":"You can say what you recognise and what you question. Keep both specific. Empty praise followed by an unrelated objection does not make the concern clearer merely because it sounds polite.","visualEn":"Show two meaningful connections to the source rather than a fixed compliment-then-objection template. No automatic praise or emotional scoring.","anchorHint":"Keep both specific","screenLabelIds":["response.check"],"audioId":"L04.S02.c011","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c012":{"id":"L04.S02.c012","speaker":"coach","text":"Acknowledgement is optional. If the reason is already understood, a concise objection may be enough. The aim is an honest, relevant response, not a requirement to begin every disagreement with I agree.","visualEn":"Move the acknowledgement card aside as optional. Keep a direct objection route visible; do not imply politeness requires false agreement.","anchorHint":"Acknowledgement is optional","screenLabelIds":["acknowledgement.optional"],"audioId":"L04.S02.c012","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c013":{"id":"L04.S02.c013","speaker":"coach","text":"For the same assigned position, form a short reply in your own words. Recognise the time concern if useful, then make the reservation clear. Do not claim that immediate help guarantees no learning.","visualEn":"Hide complete options and branch models. Keep the task, assigned position and blank private reply area. No simulated recording or copied answer.","anchorHint":"make the reservation clear","screenLabelIds":["private.prompt"],"audioId":"L04.S02.c013","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c014":{"id":"L04.S02.c014","speaker":"coach","text":"Think first or speak privately. Nothing is recorded or assessed. The pause is a small opportunity, not a deadline; pause playback if you want longer.","visualEn":"Show a quiet private-practice notice. No microphone prompt, timer pressure or progress claim based on time spent.","anchorHint":"not a deadline","screenLabelIds":["private.note","private.time"],"audioId":"L04.S02.c014","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.c015":{"id":"L04.S02.c015","speaker":"coach","text":"If you tried a reply, check whether it says what the assigned speaker actually means. If you did not rehearse, you can return later. Next we will make the concern itself more precise.","visualEn":"Offer a conditional self-check and neutral next-section title. Keep the source undecided; no automatic advancement, score or claim of improved skill.","anchorHint":"make the concern itself more precise","screenLabelIds":["review.question","next.title"],"audioId":"L04.S02.c015","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural pauses."},"L04.S02.d101":{"id":"L04.S02.d101","speaker":"learner","text":"Yes, that sounds good. Let us use it immediately.","visualEn":"Authored alternative A. Show a proposal-level agreement marker inside this branch only, not as the group’s actual adopted plan.","anchorHint":"use it immediately","screenLabelIds":["branch.a.label"],"audioId":"L04.S02.d101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice."},"L04.S02.d102":{"id":"L04.S02.d102","speaker":"maya","text":"Do you mean we should use the tool whenever a step becomes difficult?","visualEn":"Authored Maya check, calm and neutral. She asks what the agreement means; do not imply the group proceeds or that the learner feels pressured.","anchorHint":"whenever a step becomes difficult","screenLabelIds":[],"audioId":"L04.S02.d102","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Natural collaborative speech; restrained gesture, no exaggerated conflict or comic voice."},"L04.S02.f101":{"id":"L04.S02.f101","speaker":"coach","text":"This can be genuine agreement in another situation. Under the position given here, it conceals the reservation instead of expressing it. A friendly reply is not useful if it states agreement the speaker does not mean.","visualEn":"Return to the assigned fictional position and compare its concern with the branch wording. No assessment of the real learner’s beliefs or honesty.","anchorHint":"Under the position given here","screenLabelIds":["branch.a.note"],"audioId":"L04.S02.f101","lang":"en","textStatus":"Original proposed exact script; not recorded audio, an observed learner answer, or an official assessment.","delivery":"Calm, concrete teaching; emphasis follows the semantic distinction, with natural paus       destroy() { stop(); document.removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onVis); } };
  }
  boot().catch((e) => { console.error(e); note('Startup failed: ' + e.message, true); document.body.dataset.ready = 'error'; });
})();

</script>
